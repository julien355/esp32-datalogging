name: ci

on:
  push:
    branches: ["**"]
    tags: ["fw-v*"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build (native USB and UART variants)
        working-directory: firmware
        run: pio run -e logger -e logger-uart
      - name: Size
        working-directory: firmware
        run: ls -l .pio/build/logger/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/.pio/build/logger/firmware.bin
            firmware/.pio/build/logger/bootloader.bin
            firmware/.pio/build/logger/partitions.bin
            firmware/.pio/build/logger-uart/firmware.bin

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s server/tests -v
      - name: Docker image builds
        run: docker build -f server/Dockerfile -t arkan-monitoring-ingest:ci .

  # Tag fw-v<version> (equal to FW_VERSION in firmware/include/config.h): a GitHub release with the
  # two OTA images, which "Firmware update" on the site page can send to a logger (docs/OTA.md).
  release:
    if: startsWith(github.ref, 'refs/tags/fw-v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: build
      - name: Tag must match FW_VERSION
        run: |
          ver=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/include/config.h)
          echo "FW_VERSION=$ver, tag=${GITHUB_REF_NAME}"
          test "fw-v$ver" = "$GITHUB_REF_NAME"
          echo "VER=$ver" >> "$GITHUB_ENV"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/logger/firmware.bin "logger-$VER.bin"
          cp build/logger-uart/firmware.bin "logger-uart-$VER.bin"
          cp build/logger/bootloader.bin "bootloader-$VER.bin"
          cp build/logger/partitions.bin "partitions-$VER.bin"
          notes="OTA images: logger-$VER.bin (native USB build, the default) and logger-uart-$VER.bin (UART build)."
          notes="$notes First flash by cable: bootloader 0x0, partitions 0x8000, firmware 0x10000."
          files="logger-$VER.bin logger-uart-$VER.bin bootloader-$VER.bin partitions-$VER.bin"
          # The release may already exist (made on GitHub's "Draft a new release" page): add the files to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Logger firmware $VER" --notes "$notes" $files
          fi

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modbus simulator tests
        run: |
          pip install pyserial
          python -m unittest discover -s tools/modbus_sim -v
