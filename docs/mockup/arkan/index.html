        Keep the standard names (<span id="stdNames"></span>): the alarms, the daily report and the OED export look for them.<br>
        <b>fc</b>: 3 = holding registers, 4 = input registers. <b>addr</b>: 0-based address, <code>0x0018</code> or <code>24</code> (PLC number 40025 with fc 3 = <code>0x0018</code>).<br>
        <b>type</b>: <code>u16 s16</code> (one register), <code>u32 s32 f32</code> (two registers, high word first), <code>u32sw s32sw f32sw</code> (low word first).<br>
        <b>scale</b>: raw value x scale = value in V, A, Hz, kW, kvar, kVA, kWh, kvarh (a meter in W needs 0.001).<br>
        <b>ct</b>: also multiplied by the logger's <code>ct_mult</code> (meters that give secondary values).<br>
        <b>agg</b>: <code>minmax</code> = mean + <code>_min</code> + <code>_max</code> columns, <code>mean</code>, <code>last</code> for energy counters.</p>
        <p>How it reaches the logger: the logger asks for a new table every <code>rcfg_check_m</code> minutes (15 by default) or at once with the console command <code>config</code>.
        It checks the table, writes <code>/config/registers.csv</code> on its SD card (the previous file is kept as <code>registers.bak</code>) and restarts.
        The columns of that day's records change, so the platform starts a <code>_2</code> day file.</p></details></section>
    ${sec('Meter link settings')}<section class="card"><div class="fgrid c2">
        <div class="field"><label for="s_meters">meters (id:Modbus address, comma separated)</label><input type="text" id="s_meters" placeholder="EM01:1"></div>
        <div class="field"><label for="s_mb_baud">mb_baud</label><select id="s_mb_baud"></select></div>
        <div class="field"><label for="s_mb_format">mb_format</label><select id="s_mb_format"></select></div>
        <div class="field"><label for="s_ct_mult">ct_mult (1 unless the meter gives secondary values)</label><input type="text" id="s_ct_mult" placeholder="1"></div></div>
      <div class="bar"><button class="btn" id="settingsBtn">Send these settings</button><span class="muted small" id="settingsInfo"></span></div><div id="settingsResult"></div></section>
    ${sec('History')}<section class="card"><div class="tablewrap"><table class="data" id="hist"><thead><tr><th>Version</th><th>Sent (UTC)</th><th>By</th><th>What</th><th>Comment</th><th></th></tr></thead><tbody></tbody></table></div></section></div>`;
  if (!device) { el('pick').hidden = false; el('pick').textContent = `No logger registered for ${site}.`; return; }
  const regs = el('regs');
  regs.addEventListener('input', refreshMarks); regs.addEventListener('change', refreshMarks);
  regs.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const tr = b.closest('tr');
    if (b.dataset.act === 'del') tr.remove();
    if (b.dataset.act === 'up' && tr.previousElementSibling) tr.parentNode.insertBefore(tr, tr.previousElementSibling);
    refreshMarks(); });
  el('addRow').onclick = () => setRows([...getRows(), {name: '', fc: '3', addr: '0x0000', type: 'u16', scale: '1', ct: false, agg: 'minmax'}]);
  el('loadLogger').onclick = () => { if (!RV?.reported?.rows?.length) return msg('result', 'warn', 'The logger has not reported a table yet.');
    setRows(RV.reported.rows); msg('result', 'good', 'Loaded the table the logger reported.'); };
  el('loadAsked').onclick = () => { const p = RV?.platform;
    if (!p || p.builtin || !p.csv) return msg('result', 'warn', 'No table sent yet (or the last one sent was "back to built-in").');
    setRows(csvToRows(p.csv)); msg('result', 'good', `Loaded version ${p.version}.`); };
  el('importBtn').onclick = () => el('importFile').click();
  el('importFile').onchange = async e => { const f = e.target.files[0]; if (!f) return;
    if (f.size > 65536) return msg('result', 'crit', 'File too large for a register table.');
    setRows(csvToRows(await f.text())); e.target.value = ''; await regCheck(`Imported ${f.name}.`); };
  el('exportBtn').onclick = () => { const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rowsToCsv(getRows())], {type: 'text/csv'})); a.download = `registers-${device}.csv`; a.click(); URL.revokeObjectURL(a.href); };
  el('textBtn').onclick = () => { const b = el('textBox'); b.hidden = !b.hidden; if (!b.hidden) el('csvText').value = rowsToCsv(getRows()); };
  el('textApply').onclick = async () => { setRows(csvToRows(el('csvText').value)); await regCheck(); };
  el('checkBtn').onclick = () => regCheck();
  el('sendBtn').onclick = async () => {
    const j = await regCheck();
    if (!j.ok) return;
    if (!ask(`Send this table (${j.rows.length} values) to ${device}?` + (j.warnings.length ? `\n\nThere are ${j.warnings.length} warning(s): read them first.` : '') +
      `\n\nThe logger takes it at its next check (every ${RV?.reported?.settings?.rcfg_check_m || 15} min, or "config" on its console), writes it to its SD card and restarts. Its record columns change from then on.`)) return;
    const r = await api('POST', `/api/v1/admin/registers/${device}`, {csv: j.csv, comment: el('comment').value});
    if (!r.ok) return showCheck(r);
    showCheck(r, `Version ${r.version} saved: waiting for the logger.`);
    el('comment').value = ''; regLoad(false);
  };
  el('builtinBtn').onclick = async () => {
    if (!ask(`Tell ${device} to delete /config/registers.csv (kept as registers.bak) and use the table built into its firmware?`)) return;
    const r = await api('POST', `/api/v1/admin/registers/${device}`, {builtin: true, comment: el('comment').value});
    if (!r.ok) return msg('result', 'crit', r.error || 'failed');
    msg('result', 'good', `Version ${r.version} saved (built-in table): waiting for the logger.`); regLoad(false);
  };
  // An empty first choice: nothing is sent for a field left on it (the logger may not have reported yet).
  el('s_mb_baud').innerHTML = '<option value="">(unchanged)</option>' + BAUDS.map(b => `<option>${b}</option>`).join('');
  el('s_mb_format').innerHTML = '<option value="">(unchanged)</option>' + FORMATS.map(b => `<option>${b}</option>`).join('');
  el('settingsBtn').onclick = async () => {
    const cur = RV?.reported?.settings || {}, body = {}, changes = [];
    for (const k of ['meters', 'mb_baud', 'mb_format', 'ct_mult']) { const v = el('s_' + k).value.trim();
      if (v && v !== String(cur[k] ?? '')) { body[k] = v; changes.push(`${k}: ${cur[k] ?? '?'} -> ${v}`); } }
    if (!changes.length) return msg('settingsResult', 'warn', 'Nothing changed from what the logger reported.');
    if (!ask(`Send to ${device}?\n\n${changes.join('\n')}\n\nThe logger applies them at its next check and restarts.`)) return;
    const r = await api('POST', `/api/v1/admin/meter-settings/${device}`, body);
    if (!r.ok) return msg('settingsResult', 'crit', (r.errors || [r.error]).join('\n'));
    msg('settingsResult', 'good', `Settings version ${r.version} saved: waiting for the logger.`); regLoad(false);
  };
  el('hist').addEventListener('click', e => { const b = e.target.closest('button[data-h]'); if (!b) return;
    const h = RV.history[Number(b.dataset.h)];
    setRows(csvToRows(h.csv || '')); msg('result', 'good', `Loaded version ${h.version} into the editor. "Send to the logger" makes it a new version.`);
    el('regs').scrollIntoView({behavior: 'smooth', block: 'start'}); });
  el('reload').onclick = () => regLoad(false);
  if (el('devsel')) el('devsel').onchange = e => { device = e.target.value; show('register'); };
  await regLoad(true);
}

// ------------------------------------------------------------------ firmware update (ADMIN_USERS only)
const fwState = {};   // device -> last view from the server
const fwPost = (url, body, json) => fetch(url, {method: 'POST', cache: 'no-store', body,
  headers: {'X-Requested-With': 'arkan', 'Content-Type': json ? 'application/json' : 'application/octet-stream'}});
function fwStatusHtml(v, off) {
  let h = `Running <b>${esc(v.running || 'unknown')}</b>${v.env ? ` (${esc(v.env)} build)` : ''}. `;
  const o = v.offer;
  if (!o) h += 'No firmware offered.';
  else {
    const who = `${o.scope === 'default' ? 'to every logger' : 'to this logger'}${o.by ? ' by ' + esc(o.by) : ''}, ${localTime(o.published, off)}`;
    const what = `<b>${esc(o.version)}</b> (${esc(o.source || o.file)}) offered ${who}`;
    h += {installed: `<span class="ok">${what}: installed.</span>`,
          waiting: `<span class="warnc">${what}: waiting for the logger (within a minute if it is online, else at its next check).</span>`,
          rolled_back: `<span class="bad">${what}: the logger kept restarting on it and went back to ${esc(v.running)}. Not offered again.</span>`,
          not_newer: `${what}: not newer than the running version, nothing to do.`}[v.state] || what;
  }
  if (v.ota_on === '0') h += '<br><span class="bad">ota_on is 0 on this logger: it does not take updates (manage.py set-config ota_on=1).</span>';
  for (const e of v.events.slice(0, 6)) {
    const d = e.kind === 'firmware' ? (e.from ? `firmware ${esc(e.from)} -> ${esc(e.to)}` : `first seen with firmware ${esc(e.to)}`)
            : e.kind === 'boot' ? `restart: ${esc(e.reason)}`
            : `${esc(e.kind.replace('ota_', ''))} ${esc(e.version || '')} ${e.by ? 'by ' + esc(e.by) : ''}`;
    h += `<div class="ev">${localTime(e.ts, off)}: ${d}</div>`;
  }
  return h;
}
async function fwRefresh(dev, off) {
  const r = await fetch(`/api/v1/admin/fw/${encodeURIComponent(dev)}`, {cache: 'no-store'});
  if (!r.ok) return;
  const v = await r.json();
  fwState[dev] = v;
  el(`fws-${dev}`).innerHTML = fwStatusHtml(v, off);
  el(`fwsum-${dev}`).textContent = `${dev} · running ${v.running || 'unknown'}${v.state === 'waiting' ? ', update waiting' : ''}`;
  const sel = el(`fwfile-${dev}`);
  if (!sel.dataset.done) {
    sel.innerHTML = v.files.length ? v.files.map(f => `<option value="${esc(f.file)}">${esc(f.file)} (${Math.round(f.size / 1024)} kB)</option>`).join('') : '<option value="">none yet</option>';
    sel.dataset.done = 1;
  }
}
async function fwGithub(devs) {
  let rel = [], err = '';
  try { const r = await fetch('/api/v1/admin/github/releases', {cache: 'no-store'}); const j = await r.json(); if (r.ok) rel = j.releases; else err = j.error; }
  catch (e) { err = 'server not reachable'; }
  for (const dev of devs) {
    const sel = el(`fwgh-${dev}`), env = fwState[dev]?.env || 'usb';
    if (err || !rel.length) { sel.innerHTML = `<option value="">${esc(err || 'no release with a logger-*.bin file')}</option>`; continue; }
    let o = '', picked = false;
    for (const x of rel) for (const a of x.assets) {
      const aEnv = (a.name.match(/^logger-([a-z0-9]+)-\d/) || [, 'usb'])[1];
      const pick = !picked && aEnv === env;
      picked = picked || pick;
      o += `<option value="${a.id}"${pick ? ' selected' : ''}>${esc(x.tag)}: ${esc(a.name)}${x.prerelease ? ' (pre-release)' : ''}</option>`;
    }
    sel.innerHTML = o;
  }
}
async function fwAction(dev, kind, off) {
  const m = el(`fwmsg-${dev}`), force = el(`fwforce-${dev}`).checked;
  let label, call;
  if (kind === 'cancel') {
    if (!ask(`Withdraw the firmware offered to ${dev}?`)) return;
    call = () => fwPost(`/api/v1/admin/fw/${dev}/cancel`, '{}', true);
  } else {
    if (kind === 'github') {
      const id = el(`fwgh-${dev}`).value;
      if (!id) return;
      label = el(`fwgh-${dev}`).selectedOptions[0].textContent;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/github`, JSON.stringify({asset_id: +id, force}), true);
    } else if (kind === 'upload') {
      const f = el(`fwup-${dev}`).files[0];
      if (!f) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Choose a .bin file first.</div>'; return; }
      label = f.name;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/upload?force=${force ? 1 : 0}&name=${encodeURIComponent(f.name)}`, f, false);
    } else {
      const file = el(`fwfile-${dev}`).value;
      if (!file) return;
      label = file;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/offer`, JSON.stringify({file, force}), true);
    }
    if (!ask(`Send ${label} to ${dev}?\n\nThe logger installs it and restarts (about 30 s without readings, nothing is lost: the SD card keeps recording). If the new firmware keeps restarting, it goes back to the current one by itself.`)) return;
  }
  m.textContent = 'Working...';
  try {
    const r = await call();
    const j = await r.json();
    m.innerHTML = r.ok ? `<div class="banner good" style="margin:8px 0 0">${kind === 'cancel' ? (j.cancelled ? 'Offer withdrawn.' : 'Nothing was offered to this logger.') : `Firmware ${esc(j.offer.version)} offered to ${esc(dev)}.`}</div>`
                       : `<div class="banner crit" style="margin:8px 0 0">${esc(j.error || 'HTTP ' + r.status)}</div>`;
    if (r.ok) el(`fwfile-${dev}`).dataset.done = '';
  } catch (e) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Server not reachable.</div>'; }
  fwRefresh(dev, off);
}
async function fwInit() {
  try { ME = await getJ('/api/v1/admin/me'); } catch (e) { return; }
  renderChrome();
  if (!ME.admin || !site) return;
  const st = await getJ('/api/v1/status');
  const devs = Object.keys((st.sites || {})[site] || {});
  if (!devs.length) return;
  const off = (await getJ(`/api/v1/live/${site}`)).profile?.utc_offset_h ?? 8;
  let h = head('Firmware update', 'Send a firmware to one logger: from a GitHub release, a .bin file, or a file already on the server. '
    + 'The logger restarts once; a firmware that keeps restarting goes back to the previous one by itself. See docs/OTA.md.', '<span class="pill info">Admin only</span>');
  for (const dev of devs) {
    const d = esc(dev);
    h += `<section class="card mb-16"><div class="card-head"><h2 id="fwsum-${d}">${d}</h2></div>
      <div class="fwstat" id="fws-${d}">Loading...</div>
      <div class="fwrow"><b>From a GitHub release</b><select id="fwgh-${d}" aria-label="GitHub release"><option value="">${ME.github ? 'loading...' : 'FW_GITHUB_REPO not set on the server'}</option></select>
        <button class="btn primary" data-dev="${d}" data-act="github">Send to ${d}</button></div>
      <div class="fwrow"><b>From a file on this computer</b><input type="file" id="fwup-${d}" accept=".bin" aria-label="Firmware file">
        <button class="btn" data-dev="${d}" data-act="upload">Upload and send to ${d}</button></div>
      <div class="fwrow"><b>Already on the server</b><select id="fwfile-${d}" aria-label="File on the server"></select>
        <button class="btn" data-dev="${d}" data-act="offer">Send to ${d}</button></div>
      <div class="fwrow"><b>Options</b><label class="check" style="padding:0"><input type="checkbox" id="fwforce-${d}"> force: allow an older version or the other build variant</label>
        <button class="btn danger" data-dev="${d}" data-act="cancel">Withdraw the offer</button></div>
      <div id="fwmsg-${d}"></div></section>`;
  }
  el('fw').innerHTML = h;
  el('fw').addEventListener('click', ev => { const b = ev.target.closest('button[data-act]'); if (b) fwAction(b.dataset.dev, b.dataset.act, off); });
  await Promise.all(devs.map(dev => fwRefresh(dev, off)));
  if (ME.github) fwGithub(devs);
  setInterval(() => devs.forEach(dev => fwRefresh(dev, off)), 30000);
}

// ------------------------------------------------------------------ page
let shown = 0;   // the latest show(): an older one still loading never writes its error over it
const LABEL = {quality: 'power quality', voltage: 'power quality', pf: 'power quality', versions: 'firmware versions', register: 'register table', sites: 'list of sites'};
async function show(id) {
  view = known(id) ? id : site ? 'now' : 'sites';
  renderChrome();
  el('fw').hidden = true;
  scrollTo(0, 0);
  if (view === 'firmware') {   // the panel lives in #fw, out of reach of the 15 s refresh of #content
    el('content').innerHTML = '';
    await fwReady;
    if (view !== 'firmware') return;
    if (isAdmin()) el('fw').hidden = false;
    else el('content').innerHTML = head('Firmware update', '') + '<section class="card"><div class="empty">Firmware update is only for the logins listed in ADMIN_USERS on the server (docs/OTA.md).</div></section>';
    return;
  }
  if (view === 'now') { el('content').innerHTML = ''; return tick(); }
  el('content').innerHTML = '<section class="card"><div class="empty">Loading…</div></section>';
  const n = ++shown;
  try { await renderHistory(); }
  catch (e) { console.error(e); if (n === shown) el('content').innerHTML = `<section class="card"><div class="empty">Could not read the ${WXVIEWS[view] ? 'weather' : LABEL[view] || 'history'} from the server.</div></section>`; }
}
document.addEventListener('click', ev => {
  const r = ev.target.closest('button[data-role]');
  if (r) return setRole(r.dataset.role);
  const b = ev.target.closest('button[data-span],button[data-day],button[data-vf],[data-qday]');
  if (!b || b.disabled) return;
  if (b.dataset.qday) {   // a day of the power quality pages: a link opens #voltage on it, a button redraws the day only
    qDay = b.dataset.qday;
    if (b.tagName === 'A' || !el('qday')) return;
    return qDaySection().catch(() => { el('qday').innerHTML = '<section class="card"><div class="empty">Could not read that day from the server.</div></section>'; });
  }
  if (b.dataset.vf) vfAll = b.dataset.vf === 'all';
  if (b.dataset.span) { span = +b.dataset.span; range = null; periodChanged(); }
  if (b.dataset.day) dayShown = b.dataset.day;
  show(view);
});
// From and To: Show (or Enter) applies the two dates; until then Show is highlighted. A day's calendar (One day, Voltage) applies
// at once, a moment after the last change, so typing a date digit by digit does not redraw the page at every digit.
document.addEventListener('click', ev => { if (ev.target.closest('button[data-apply]')) applyRange(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && /^(from|to)$/.test(ev.target.dataset?.pick || '')) { ev.preventDefault(); applyRange(); } });
const datesEdited = () => { const b = document.querySelector('button[data-apply]'), d = pDates();
  if (b && el('pFrom') && el('pTo')) b.classList.toggle('primary', el('pFrom').value !== d.from || el('pTo').value !== d.to); };
let pickT;
for (const type of ['input', 'change']) document.addEventListener(type, ev => {
  const k = ev.target.dataset?.pick;
  if (k === 'from' || k === 'to') return datesEdited();
  if (type !== 'change' || (k !== 'day' && k !== 'qday')) return;
  const v = ev.target.value, v0 = view;
  clearTimeout(pickT);
  pickT = setTimeout(() => {   // a redraw meanwhile (resize, refresh) replaced the field: the date chosen still counts
    if (view !== v0 || !/^\d{4}-\d{2}-\d{2}$/.test(v) || v > todayH() || v < '2000-01-01') return;   // other page, or half typed
    if (k === 'day') { dayShown = v; return show(view); }
    if (!el('qday')) return;
    qDay = v;
    qDaySection().catch(() => { el('qday').innerHTML = '<section class="card"><div class="empty">Could not read that day from the server.</div></section>'; });
  }, 600);
});
addEventListener('hashchange', () => show(location.hash.slice(1)));
const STATIC = ['now', 'firmware', 'prefs', 'register'];   // not redrawn by a resize or the 5-minute refresh
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!STATIC.includes(view)) renderHistory().catch(() => {}); }, 300); });

async function tick() {
  try { await loadSite(); }
  catch (e) { console.error(e); STATUS = '<span class="live-pill off"><i></i>Server not reachable</span>'; renderChrome(); }
}
if (MOCK) el('mocknote').hidden = false;
fwReady = fwInit().catch(() => {});
view = known(location.hash.slice(1)) ? location.hash.slice(1) : site ? 'now' : 'sites';
renderChrome();
const redraw = () => renderHistory().catch(() => {});   // in place: no "Loading" and no jump to the top
if (!site) { show(view); setInterval(() => { if (view === 'sites' && !document.hidden) redraw(); }, 15000); }
else {   // the live call also brings the site profile (names, sensors, contract) the other pages use
  if (view === 'now') tick(); else tick().finally(() => fwReady).finally(() => show(view));
  setInterval(tick, 15000);
  setInterval(() => {   // a period that ended before today does not change: not read again
    if (STATIC.includes(view) || document.hidden || (range && range.to < todayH())) return;
    delete HCACHE[pq(per())]; delete QCACHE[pq(per())]; WXC = null; WXL = {}; redraw();
  }, 300e3);
}
</script>
