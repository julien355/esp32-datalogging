<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arkan Monitoring: design mockup</title>
<style>/* Arkan UI kit, R1, status S3 (for owner review), 24 October 2026 (R0 the same morning; R1 adds what the Hub port needed: tone pills, small button, five-tile row, landing shell).
   Extracted from the CMMS demo of 21 October 2026 and extended for the Project Hub (progress, deliverables, data room, onboarding, parties).
   One stylesheet, no build step, no network. Class names are the CMMS names, so the CMMS can adopt this file without markup changes.
   Layout follows the width of .shell (container queries): icon rail from 700px, full sidebar from 1100px, top bar and bottom tabs below 700px.
   Needs arkan-ui.js for display settings, sheets and filters; everything else renders from the stylesheet alone.
   Fonts: Satoshi if installed or self-hosted, then Plus Jakarta Sans, then the system font. This file loads nothing from the network.
   Left in the CMMS (not shared): site plan, pins, rooms, QR, asset condition, live electricity, PM week. Deviations: see README.md. */
:root{
  color-scheme:light;
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#EEF3F9; --stage:#E9EDF2;
  --ink:#1F1F1F; --ink-2:#3A3A3A; --muted:#5B6674;
  --line:#D7DDE4; --line-2:#C0C4C9; --grid:#E7EBF0; --control:#7B8594;
  --brand:#0D62BC; --brand-ink:#163F73; --brand-bright:#1B8ED1; --brand-tint:#E4EFFC; --brand-tint-2:#C1DDFD;
  --action:#0D62BC; --action-hover:#163F73; --on-action:#FFFFFF; --focus:#1B8ED1;
  --good:#2FA66A; --good-ink:#1C7A4B; --good-bg:#E3F3EA;
  --warn:#D06A0A; --warn-ink:#99510B; --warn-bg:#FDEFE0;
  --crit:#D14343; --crit-ink:#A62A2A; --crit-bg:#FBE6E6;
  --wordmark:#0C345C; --tile:#FFFFFF;
  --band:rgba(47,166,106,.11); --area:rgba(13,98,188,.10);
  --shadow-card:0 1px 2px rgba(31,31,31,.05),0 6px 20px rgba(31,31,31,.06);
  --shadow-pop:0 4px 8px rgba(31,31,31,.08),0 16px 40px rgba(31,31,31,.14);
  --scrim:rgba(18,24,33,.42);
  --font:'Satoshi','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r-sm:4px; --r-md:8px; --r-lg:14px; --r-pill:999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="contrast"]){
  --bg:#0E131A; --surface:#151C25; --surface-2:#1C2633; --stage:#090D12;
  --ink:#F2F5F9; --ink-2:#D0D8E2; --muted:#98A4B4;
  --line:#283341; --line-2:#3A4657; --grid:#202A36; --control:#6E7C91;
  --brand:#5AA2EC; --brand-ink:#AFCFF5; --brand-bright:#62B6EA; --brand-tint:#172F4C; --brand-tint-2:#21426B;
  --action:#2C77CC; --action-hover:#2268B8; --on-action:#FFFFFF; --focus:#62B6EA;
  --good:#47BF81; --good-ink:#82DAAB; --good-bg:#12321F;
  --warn:#F5A04E; --warn-ink:#F7BE84; --warn-bg:#3A2613;
  --crit:#EE6B6B; --crit-ink:#F59B9B; --crit-bg:#3E1A1C;
  --wordmark:#E8EEF6; --tile:#FFFFFF;
  --band:rgba(71,191,129,.14); --area:rgba(90,162,236,.16);
  --shadow-card:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);
  --shadow-pop:0 4px 8px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C25; --surface-2:#1C2633; --stage:#090D12;
  --ink:#F2F5F9; --ink-2:#D0D8E2; --muted:#98A4B4;
  --line:#283341; --line-2:#3A4657; --grid:#202A36; --control:#6E7C91;
  --brand:#5AA2EC; --brand-ink:#AFCFF5; --brand-bright:#62B6EA; --brand-tint:#172F4C; --brand-tint-2:#21426B;
  --action:#2C77CC; --action-hover:#2268B8; --on-action:#FFFFFF; --focus:#62B6EA;
  --good:#47BF81; --good-ink:#82DAAB; --good-bg:#12321F;
  --warn:#F5A04E; --warn-ink:#F7BE84; --warn-bg:#3A2613;
  --crit:#EE6B6B; --crit-ink:#F59B9B; --crit-bg:#3E1A1C;
  --wordmark:#E8EEF6; --tile:#FFFFFF;
  --band:rgba(71,191,129,.14); --area:rgba(90,162,236,.16);
  --shadow-card:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);
  --shadow-pop:0 4px 8px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink-2);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.mono{font-family:var(--mono);font-size:.84em;font-weight:500;letter-spacing:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* App shell */
.shell{container:app/inline-size}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .t-prop{min-width:0;flex:1;line-height:1.2}
.topbar .t-prop b{display:block;color:var(--ink);font-size:15px}
.topbar .t-prop small{color:var(--muted);font-size:12px}
.main{min-width:0;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar{position:sticky;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border-top:1px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 2px;border-radius:10px;min-width:0}
.tabbar a span,.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar a[aria-current="page"],.tabbar button[aria-current="page"]{color:var(--brand)}
.tabbar .tb-report .tb-ic{display:grid;place-items:center;width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--action);color:var(--on-action);box-shadow:var(--shadow-pop)}
.tabbar .tb-report .tb-ic .i{width:24px;height:24px}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark-tile{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;background:var(--tile);border:1px solid var(--line)}
.mark-tile svg{width:28px;height:28px}
.brand-txt{display:flex;flex-direction:column;line-height:1;gap:4px;min-width:0}
.brand-txt .wm{color:var(--wordmark);display:block;height:14px}
.brand-txt .wm svg{height:14px;width:auto;display:block}
.brand-txt .prod{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.side{position:sticky;top:0;height:100vh;flex-direction:column;gap:8px;background:var(--surface);border-right:1px solid var(--line);padding-block:16px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;overflow-y:auto}
.side .brand{justify-content:center;padding-bottom:8px}
.side .brand-txt{display:none}
.side .prop{display:none}
.snav{display:flex;flex-direction:column;gap:2px}
.snav a,.snav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;color:var(--ink-2);font-size:11px;font-weight:600;text-align:center}
.snav a:hover,.snav button:hover{background:var(--surface-2)}
.snav a[aria-current="page"],.snav button[aria-current="page"]{background:var(--brand-tint);color:var(--brand-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .full{display:none}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);margin-inline:auto;font-size:12px;font-weight:700}
.icon-btn:hover{background:var(--surface-2)}

@container app (min-width:700px){
  .app{grid-template-columns:84px minmax(0,1fr)}
  .side{display:flex}
  .topbar,.tabbar{display:none}
  .main{padding-block:24px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
}
@container app (min-width:1100px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .side{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;gap:12px}
  .side .brand{justify-content:flex-start;padding:4px 4px 4px}
  .side .brand-txt{display:flex}
  .side .prop{display:block;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);line-height:1.3}
  .side .prop b{display:block;color:var(--ink);font-size:14px}
  .side .prop small{color:var(--muted);font-size:12px}
  .snav a,.snav button{flex-direction:row;gap:12px;padding:9px 12px;font-size:14px;text-align:left}
  .side-foot .rail{display:none}
  .side-foot .full{display:flex;flex-direction:column;gap:8px}
  .main{padding-block:28px 56px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.field-row{display:flex;flex-direction:column;gap:4px}
.field-row label{font-size:12px;font-weight:600;color:var(--muted)}
select,input[type="text"],input[type="number"],input[type="search"],textarea{width:100%;min-width:0;padding:9px 11px;border-radius:var(--r-md);border:1px solid var(--control);background:var(--surface);color:var(--ink);font-size:14.5px}
textarea{min-height:84px;resize:vertical}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-md);background:var(--surface-2);gap:2px}
.seg button{padding:5px 10px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip-demo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border-radius:var(--r-pill);padding:3px 8px;white-space:nowrap}

/* Page parts */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head h1{font-size:24px;font-weight:800;line-height:1.2}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-md);font-weight:700;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.block{width:100%}
.btn.lg{padding:14px 18px;font-size:15.5px}
.btn:active{opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head h2{font-size:15.5px;font-weight:700}
.link{color:var(--brand);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--brand-tint);color:var(--brand-ink);margin-bottom:16px;font-size:14px}
.banner b{color:var(--brand-ink)}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.warn b{color:var(--warn-ink)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .eyebrow{font-size:10.5px;line-height:1.35;min-height:2.7em}
.kpi .big{font-size:30px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em}
.kpi .big small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:var(--r-pill);padding:2px 8px 2px 6px;align-self:flex-start;white-space:nowrap}
.state .i{width:14px;height:14px;stroke-width:2.2}
.state.good{background:var(--good-bg);color:var(--good-ink)}
.state.warn{background:var(--warn-bg);color:var(--warn-ink)}
.state.crit{background:var(--crit-bg);color:var(--crit-ink)}
.state.info{background:var(--brand-tint);color:var(--brand-ink)}
.state.neutral{background:var(--surface-2);color:var(--muted)}

.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:700px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash{grid-template-columns:repeat(6,minmax(0,1fr))}
  .w-site,.w-att,.w-pace{grid-column:span 6}
  .w-third{grid-column:span 3}
}
@container app (min-width:1100px){
  .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
  .dash{grid-template-columns:repeat(12,minmax(0,1fr))}
  .w-site{grid-column:span 8}
  .w-att{grid-column:span 4}
  .w-third,.w-pace{grid-column:span 4}
}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px 2px 7px;border-radius:var(--r-pill);white-space:nowrap;line-height:1.5}
.pill .i{width:13px;height:13px;stroke-width:2.2}
.pri-urgent{background:var(--crit-bg);color:var(--crit-ink)}
.pri-high{background:var(--warn-bg);color:var(--warn-ink)}
.pri-normal{background:var(--brand-tint);color:var(--brand-ink)}
.pri-low{background:var(--surface-2);color:var(--muted)}
.st{border:1px solid var(--line);color:var(--ink-2);background:var(--surface);font-weight:600}
.st .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.s-open .dot,.st.s-assigned .dot{background:var(--brand)}
.st.s-progress .dot{background:var(--brand-bright);box-shadow:0 0 0 3px var(--brand-tint)}
.st.s-parts .dot,.st.s-contractor .dot{background:var(--warn)}
.st.s-check .dot{background:var(--good)}
.st.s-closed .dot,.st.s-scheduled .dot{background:var(--line-2)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand-tint-2);color:var(--brand-ink);font-size:11px;font-weight:800;flex:none}
.av.none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2)}
.av.ext{background:var(--warn-bg);color:var(--warn-ink)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.due .i{width:14px;height:14px}
.due.crit{color:var(--crit-ink);font-weight:700}
.due.warn{color:var(--warn-ink);font-weight:700}

/* Job list */
.jlist{display:flex;flex-direction:column}
.jrow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px;padding:12px 8px;border-radius:var(--r-md);width:100%;align-items:start}
.jrow+.jrow{border-top:1px solid var(--line)}
.jrow:hover{background:var(--surface-2)}
.jrow[aria-current="true"]{background:var(--brand-tint)}
.jic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--brand-ink)}
.jtitle{color:var(--ink);font-weight:700;font-size:14.5px;line-height:1.35}
.jmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.jtags{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jtags .av{width:24px;height:24px;font-size:10px;margin-left:auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.fchip{padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--brand-ink);border-color:var(--brand-ink);color:var(--surface)}
.fchip .n{font-weight:700;opacity:.7;margin-left:4px}
.filters select{width:auto;padding:6px 10px;font-size:13px}
.filters .search{flex:1;min-width:160px}
.jobs-layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:1100px){.jobs-layout.split{grid-template-columns:minmax(0,1fr) 440px}}
.panel{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* Detail */
.dhead{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:19px;font-weight:800;line-height:1.3}
.dtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:14px;padding-block:14px;border-bottom:1px solid var(--line)}
.dl dt{color:var(--muted);font-size:12.5px;font-weight:600;padding-top:1px}
.dl dd{margin:0;color:var(--ink);min-width:0}
.dsec{padding-block:14px;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.photo{display:grid;place-items:center;gap:6px;aspect-ratio:4/3;max-width:100%;border-radius:var(--r-md);background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);border:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center;padding:12px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.photo .i{width:28px;height:28px}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.orig{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-md);padding:8px 10px;margin-top:2px}
.orig i{font-style:normal;color:var(--ink-2)}
.ooo{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--crit-ink);background:var(--crit-bg);border-radius:var(--r-md);padding:8px 10px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.timeline li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:13.5px}
.timeline .when{font-size:12px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks button{display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 6px;border-radius:6px;font-size:14px;color:var(--ink)}
.checks button:hover{background:var(--surface-2)}
.checks button[disabled]{cursor:default}
.checks button[disabled]:hover{background:none}
.box{width:20px;height:20px;flex:none;border-radius:5px;border:1.5px solid var(--control);display:grid;place-items:center;margin-top:1px;background:var(--surface)}
.box .i{width:14px;height:14px;stroke-width:2.6;visibility:hidden}
.done .box{background:var(--good);border-color:var(--good);color:#fff}
.done .box .i{visibility:visible}
.done .ctext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.actions .btn{flex:1 1 auto}
.stepper{display:flex;gap:4px;margin-top:4px}
.stepper span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stepper span.on{background:var(--brand)}
.stepper-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;justify-content:flex-end;align-items:stretch;background:var(--scrim)}
.sheet{background:var(--surface);width:min(480px,100%);height:100%;overflow:auto;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));box-shadow:var(--shadow-pop)}
.sheet.small{height:auto;max-height:100%;align-self:flex-end;width:100%;border-radius:18px 18px 0 0;padding-left:max(20px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet.small{align-self:center;width:min(440px,92%);border-radius:var(--r-lg);margin-right:auto;margin-left:auto;padding-bottom:24px}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;position:sticky;top:-12px;background:var(--surface);padding-block:8px;z-index:2}
.sheet-top .icon-btn{margin:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);margin-bottom:8px;color:var(--ink)}
.opt:hover{background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;width:max-content;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:var(--r-md);font-size:14px;font-weight:600;box-shadow:var(--shadow-pop);max-width:min(520px,calc(100% - 32px));display:flex;gap:10px;align-items:center}
@media (min-width:700px){.toast{bottom:28px}}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line-2);display:inline-block}
/* Charts */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .lbl{fill:var(--ink);font-size:11.5px;font-weight:700;font-family:var(--font)}
.chart .band{fill:var(--band)}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--area)}
.chart .mk-bad{fill:var(--crit);stroke:var(--surface);stroke-width:2}
.chart .mk-end{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--line-2);stroke-width:1}
.chart .xhd{fill:var(--surface);stroke:var(--brand);stroke-width:2}
.chart .lim{stroke:var(--crit);stroke-width:1;stroke-dasharray:4 4}
.tip{position:absolute;top:-6px;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translateY(-100%);box-shadow:var(--shadow-pop);z-index:3}
.tip b{font-weight:700}
.spark-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:end;padding-block:10px}
.spark-row+.spark-row{border-top:1px solid var(--line)}
.spark-row .v{font-size:22px;font-weight:800;color:var(--ink);line-height:1;text-align:right}
.spark-row .v small{font-size:12px;color:var(--muted);font-weight:600}
.spark-row .chart{grid-column:1/-1}
details.tbl summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:13px;margin-top:8px}
.tablewrap{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
table.data th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
table.data td.wrap{white-space:normal;min-width:180px}
table.data tr:last-child td{border-bottom:0}
.num{text-align:right}

/* Lists, pacing, week */
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alist li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;padding-block:10px;align-items:start;font-size:14px}
.alist li+li{border-top:1px solid var(--line)}
.alist .ai{display:grid;place-items:center;width:32px;height:32px;border-radius:9px}
.alist .ai.crit{background:var(--crit-bg);color:var(--crit-ink)}
.alist .ai.good{background:var(--good-bg);color:var(--good-ink)}
.alist .ai.warn{background:var(--warn-bg);color:var(--warn-ink)}
.alist .ai.info{background:var(--brand-tint);color:var(--brand-ink)}
.alist b{color:var(--ink)}
.alist small{display:block;color:var(--muted);font-size:12.5px}
.pace{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-block:10px 8px}
.pace span{height:30px;border-radius:5px;border:1px solid var(--line-2);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface)}
.pace span.done{background:var(--good-bg);border-color:var(--good);color:var(--good-ink)}
.pace span.prog{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-ink)}
.pace-note{font-size:13px;color:var(--muted)}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:900px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.three{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:1100px){.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* Report */
.report{max-width:640px}
.step{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.step-l{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:15px}
.step-n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand-ink);color:var(--surface);font-size:12px;font-weight:800}
.gridpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container app (min-width:560px){.gridpick{grid-template-columns:repeat(3,minmax(0,1fr))}.gridpick.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:var(--r-md);border:1px solid var(--control);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;line-height:1.3;min-width:0}
.pick .i{color:var(--brand-ink)}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 1px var(--brand)}
.toggle{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);border:1px solid var(--control);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;width:100%}
.switch{width:40px;height:24px;border-radius:12px;background:var(--control);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed="true"] .switch{background:var(--action)}
.toggle[aria-pressed="true"] .switch::after{transform:translateX(16px)}
.err{color:var(--crit-ink);font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.sugg{font-size:13px;color:var(--muted)}

/* Assets */
.alay{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:1100px){.alay.split{grid-template-columns:minmax(0,1fr) 400px}}
.agroup h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;display:flex;gap:8px;align-items:center}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 8px;border-radius:var(--r-md);width:100%;align-items:center}
.arow+.arow{border-top:1px solid var(--line)}
.arow:hover{background:var(--surface-2)}
.arow[aria-current="true"]{background:var(--brand-tint)}
.arow .an{font-weight:700;color:var(--ink);font-size:14px}
.arow .ameta{font-size:12.5px;color:var(--muted)}
.meter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meter div{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px}
.meter b{display:block;font-size:18px;color:var(--ink);font-weight:800}
.meter small{color:var(--muted);font-size:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.more-list .opt .i{color:var(--brand-ink)}

/* Navigation separator */
.snav .sep{height:1px;background:var(--line);margin:8px 6px}
.snav .sep-l{display:none}
@container app (min-width:1100px){.snav .sep-l{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 12px 4px}}

.rooms-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:12px}
.rooms-strip button{border:1px solid var(--line-2);border-radius:6px;padding:4px 2px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--surface);line-height:1.25;min-width:0}
.rooms-strip button small{display:block;font-size:10px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rooms-strip button.ooo{background:var(--crit-bg);border-color:var(--crit)}
.rooms-strip button.pm{background:var(--brand-tint);border-color:var(--brand)}
.rooms-strip button.occ{background:var(--surface-2)}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good-ink);background:var(--good-bg);padding:2px 9px;border-radius:var(--r-pill);white-space:nowrap}
.live-pill i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1.6s infinite}
.live-pill.gen{color:var(--warn-ink);background:var(--warn-bg)}
.live-pill.gen i{background:var(--warn)}
@keyframes blink{50%{opacity:.25}}
.capbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:10px 0 5px}
.capbar span{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .6s}
.capbar.gen span{background:var(--warn)}
/* Data room */
.dr{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:900px){.dr{grid-template-columns:250px minmax(0,1fr)}}
.tree-wrap{display:none}
@container app (min-width:900px){.tree-wrap{display:block;align-self:start}}
.tree{display:flex;flex-direction:column;gap:2px}
.tree button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-md);font-size:13.5px;color:var(--ink-2);width:100%;text-align:left}
.tree button:hover{background:var(--surface-2)}
.tree button.sub{padding-left:36px;font-size:13px}
.tree button[aria-current="true"]{background:var(--brand-tint);color:var(--brand-ink);font-weight:700}
.tree button .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.tree button .fn{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:18px}
.tree .miss{color:var(--warn-ink)}
.tree hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.folder-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
@container app (min-width:900px){.folder-chips{display:none}}
.ftype{display:inline-grid;place-items:center;min-width:40px;height:22px;border-radius:5px;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:0 5px}
.ft-pdf{background:var(--crit-bg);color:var(--crit-ink)}
.ft-dwg{background:var(--brand-tint);color:var(--brand-ink)}
.ft-xlsx{background:var(--good-bg);color:var(--good-ink)}
.ft-jpg{background:var(--warn-bg);color:var(--warn-ink)}
.ft-none,.ft-file{background:var(--surface-2);color:var(--muted)}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 8px;border-radius:var(--r-md);width:100%}
.drow+.drow{border-top:1px solid var(--line)}
.drow:hover{background:var(--surface-2)}
.drow .dn{font-weight:700;color:var(--ink);font-size:14px}
.drow .dm{font-size:12.5px;color:var(--muted)}
.drow.missing .dn{color:var(--muted);font-style:italic}
.dgroup h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px}
.dgroup:first-child h3{margin-top:2px}
.sheet.wide{width:min(760px,100%)}
.viewer{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px;margin-block:14px}
.viewer img{width:100%;display:block;border-radius:6px}
.paper{background:#FFFFFF;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.paper svg{display:block;width:100%;height:auto}
.viewer .vnote{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.revs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.revs li{display:flex;justify-content:space-between;gap:8px}
.up-in{position:absolute;opacity:0;width:1px;height:1px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.idbox{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;font-size:12.5px;color:var(--muted)}
.idbox .mono{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.req{color:var(--crit-ink)}
/* Reports */
.rp-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.rp-paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
.rp-band{background:var(--brand-ink);color:var(--surface);padding:18px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-end}
.rp-band h2{color:var(--surface);font-size:19px;font-weight:800}
.rp-band .eyebrow{color:var(--surface);opacity:.8}
.rp-band small{font-size:12.5px;opacity:.85}
.rp-body{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.rp-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@container app (min-width:700px){.rp-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rp-kpis div{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.rp-kpis small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.rp-kpis b{display:block;font-size:19px;color:var(--ink);font-weight:800;margin-top:3px}
.rp-kpis span{font-size:12px;color:var(--muted)}
.rp-sec h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.share{display:inline-block;height:6px;border-radius:3px;background:var(--brand-bright);vertical-align:middle;margin-right:8px}
.chart .bar{fill:var(--brand-bright)}
.chart .bar.hi{fill:var(--brand)}
.rp-note{font-size:12.5px;color:var(--muted)}

/* =====================================================================
   Additions to the CMMS base (everything below is new in the kit)
   ===================================================================== */

/* Document-level basics the CMMS page got from its host */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
a{color:var(--brand)}
.snav a,.tabbar a{text-decoration:none}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:var(--r-md);border:2px solid var(--focus);font-weight:700}
.skip:focus{left:8px}
body.sheet-open{overflow:hidden}
.small:not(.sheet){font-size:12.5px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-16{margin-bottom:16px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.jrow .jtitle,.jrow .jmeta{display:block}

/* High contrast mode (from the Hub): black ground, white text, yellow accent. Colour is never the only signal. */
:root[data-theme="contrast"]{
  --bg:#000000; --surface:#000000; --surface-2:#1A1A1A; --stage:#000000;
  --ink:#FFFFFF; --ink-2:#FFFFFF; --muted:#E6E6E6;
  --line:#FFFFFF; --line-2:#FFFFFF; --grid:#707070; --control:#FFFFFF;
  --brand:#FFE14D; --brand-ink:#FFE14D; --brand-bright:#FFE14D; --brand-tint:#241F00; --brand-tint-2:#403600;
  --action:#FFE14D; --action-hover:#FFFFFF; --on-action:#000000; --focus:#FFFFFF;
  --good:#6DFF9D; --good-ink:#6DFF9D; --good-bg:#00210E;
  --warn:#FFB84D; --warn-ink:#FFD24D; --warn-bg:#2B1A00;
  --crit:#FF8A80; --crit-ink:#FF8A80; --crit-bg:#2D0A08;
  --wordmark:#FFFFFF; --tile:#FFFFFF;
  --band:rgba(109,255,157,.18); --area:rgba(255,225,77,.16);
  --shadow-card:none; --shadow-pop:0 0 0 2px #FFFFFF;
  --scrim:rgba(0,0,0,.8); color-scheme:dark;
}
:root[data-theme="contrast"] a{text-decoration:underline}
:root[data-theme="contrast"] .snav a,:root[data-theme="contrast"] .tabbar a,:root[data-theme="contrast"] .btn,:root[data-theme="contrast"] .skip{text-decoration:none}
:root[data-theme="contrast"] .card,:root[data-theme="contrast"] .kpi,:root[data-theme="contrast"] .side,:root[data-theme="contrast"] .topbar,:root[data-theme="contrast"] .tabbar,:root[data-theme="contrast"] .sheet{border-width:2px}

:root[data-theme="contrast"] .seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #FFFFFF}
.card-head{flex-wrap:wrap;row-gap:4px}

/* Display settings (from the Hub): text size, density, motion. Set by arkan-ui.js on <html>. */
html[data-size="small"] body{zoom:.92}
html[data-size="large"] body{zoom:1.12}
html[data-density="compact"] .card{padding:12px}
html[data-density="compact"] .kpi{padding:10px 12px;gap:4px}
html[data-density="compact"] .jrow{padding:7px 8px}
html[data-density="compact"] .arow,html[data-density="compact"] .drow{padding-block:6px}
html[data-density="compact"] table.data td,html[data-density="compact"] table.data th{padding-block:4px}
html[data-density="compact"] .alist li{padding-block:6px}
html[data-density="compact"] .dash,html[data-density="compact"] .tiles{gap:10px}
html[data-motion="reduce"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}

/* Dashboard grid helpers: a hero widget, a side widget and a full-width widget */
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.w-hero,.w-side,.w-full{grid-column:1/-1}
@container app (min-width:700px){
  .tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .w-hero,.w-side{grid-column:span 6}
}
@container app (min-width:1100px){
  .tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .w-hero{grid-column:span 8}
  .w-side{grid-column:span 4}
}

/* Audience chips: every page says whose view it is */
.aud{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:var(--r-pill);padding:2px 10px;white-space:nowrap}
.aud-client{background:var(--good-bg);color:var(--good-ink)}
.aud-internal{background:var(--brand-tint);color:var(--brand-ink)}

/* Provenance footer: data date, record, kit revision */
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;font-size:12.5px;color:var(--muted)}

/* Count badge in the navigation: the "waiting on you" number */
.snav a,.snav button{position:relative}
.tabbar a,.tabbar button{position:relative}
.nav-count{margin-left:auto;font-size:11px;font-weight:800;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-pill);padding:0 7px;line-height:18px;min-width:20px;text-align:center}
.tabbar .nav-count{position:absolute;top:0;left:calc(50% + 6px);margin:0}
@container app (min-width:700px) and (max-width:1099px){.snav .nav-count{position:absolute;top:2px;right:6px;margin:0}}

/* Selected row in a list: the detail shows beside it */
.lsplit{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

  .lsplit{grid-template-columns:minmax(0,1fr) 440px}
  .lsplit>.panel{display:block}
}

/* Progress bars: segments widths are set inline from the data */
.pbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.pbar.sm{height:8px}
.pb{display:block;height:100%}
.pb-done{background:var(--good)}
.pb-active{background:var(--brand)}
.pb-review{background:var(--warn)}
.pb-expected{background:repeating-linear-gradient(45deg,var(--line-2) 0 3px,transparent 3px 7px)}
.plegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.plegend span{display:inline-flex;align-items:center;gap:6px}
.plegend i{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--line-2)}
.prow{display:grid;grid-template-columns:minmax(84px,140px) minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:8px;font-size:13.5px}
.prow+.prow{border-top:1px solid var(--line)}
.prow .pn{color:var(--ink);font-weight:700}
.prow .pv{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}

/* Stage strip: nine stages with their gates. Wraps to rows on narrow widths. */
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
@container app (min-width:700px){.stages{grid-template-columns:repeat(5,minmax(0,1fr))}}

.stg{display:grid;gap:5px;align-content:start;min-width:0}
.stg .rail{height:8px;border-radius:4px;background:var(--line)}
.stg.done .rail{background:var(--good)}
.stg.now .rail{background:var(--brand)}
.stg.off .rail{background:repeating-linear-gradient(45deg,var(--line-2) 0 3px,transparent 3px 7px)}
.stg .nm{font-weight:700;color:var(--ink);font-size:13.5px;overflow-wrap:anywhere}
.stg.now .nm{color:var(--brand)}
.stg .stt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stg.done .stt{color:var(--good-ink)}
.stg.now .stt{color:var(--brand-ink)}
.stg .gt{font-size:12px;color:var(--muted)}

.stg .ct{font-size:12px;color:var(--muted)}

.dc-S0{background:var(--warn-bg);color:var(--warn-ink)}
.dc-S1,.dc-S2,.dc-S3,.dc-S4,.dc-S5{background:var(--brand-tint);color:var(--brand-ink)}

.wizbar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;margin-top:8px;background:var(--bg);border-top:1px solid var(--line)}
.person{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}

.st.s-late .dot{background:var(--crit)}

.sw.good{background:var(--good-bg);border-color:var(--good)}
.sw.warn{background:var(--warn-bg);border-color:var(--warn)}
.sw.crit{background:var(--crit-bg);border-color:var(--crit)}
.sw.brand{background:var(--brand-tint);border-color:var(--brand)}

@media print{
  .side,.topbar,.tabbar,.skip,.sheet-wrap,.toast,.page-head .btn,.filters,.wizbar{display:none!important}
  body{background:#FFFFFF;color:#000000}
  .app{display:block}
  .main{padding:0}
  .card,.kpi,.rp-paper{box-shadow:none;break-inside:avoid}
}

<script>/* Arkan UI kit, R0: display settings, sheets, list detail, filters, toasts. No dependencies, no network.
   Load in <head> so the saved display settings apply before the page paints.
   Settings live in localStorage under "arkan-ui.<name>" and are set on <html> as data-theme, data-density, data-size, data-motion.
   Markup contract (data attributes):
     [data-ui-setting="theme|density|size|motion"][data-value]   button of a segmented control
     [data-ui-open="sheetId"]  [data-ui-close]                   open or close a .sheet-wrap
     [data-ui-detail="templateId"]                               a row that shows <template id> in the side panel, or in a sheet on narrow widths
     [data-ui-filter="name"] [data-value]                        chips or tree buttons; rows are [data-ui-row="name"][data-tags="a b"]
     [data-ui-search="name"]                                     text input that filters the same rows
     [data-ui-toast="message"]                                   shows a short message

  var PREFIX = 'arkan-ui.';
  var CHOICES = {
    theme: ['system', 'light', 'dark', 'contrast'],
    density: ['comfortable', 'compact'],
    size: ['small', 'normal', 'large'],
    motion: ['full', 'reduce']
  };
  var DEFAULT = { theme: 'system', density: 'comfortable', size: 'normal', motion: 'full' };
  var root = document.documentElement;
  var state = {};
  var lastFocus = null;
  var toastTimer = null;

  function read(k) {
    try {
      var v = localStorage.getItem(PREFIX + k);
      return CHOICES[k].indexOf(v) > -1 ? v : DEFAULT[k];
    } catch (e) { return DEFAULT[k]; }
  }
  function write(k, v) { try { localStorage.setItem(PREFIX + k, v); } catch (e) { /* storage blocked: the choice lasts for this page only */ } }

  /* A page that embeds this one may set data-theme itself (a viewer's own light or dark choice). "System" must leave that alone:

  var hostTheme = null, ownsTheme = false;
  function paint(k, v) {
    state[k] = v;
    if (k === 'theme') {

          ownsTheme = false;
          if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme');

        if (!ownsTheme) { hostTheme = root.getAttribute('data-theme'); ownsTheme = true; }

    lastFocus = document.activeElement;
    wrap.hidden = false;

// Sparkline: one or more series over the last 60 minutes, hover shows the values at that time
const SPARKS = {};

function spark(series, times, {tall = false, unitKey} = {}) {

  const paths = series.map(s => {
    let d = '';
    s.pts.forEach((v, i) => { if (v !== null) d += `${d && s.pts[i - 1] !== null ? 'L' : 'M'}${X(i).toFixed(2)},${Y(v).toFixed(2)}`; });
    return `<path d="${d}" style="stroke:${s.color}" vector-effect="non-scaling-stroke"/>`;
  }).join('');
  const id = 'sp' + (++sparkId);
  SPARKS[id] = {series, times, unitKey};
  return `<svg class="spark${tall ? ' tall' : ''}" id="${id}" viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img" aria-label="last 60 minutes">
    ${paths}<line class="xh" y1="0" y2="${H}" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>`;
}

document.addEventListener('mousemove', ev => {

  document.querySelectorAll('svg.spark .xh').forEach(l => { if (!svg || l.parentNode !== svg) l.setAttribute('visibility', 'hidden'); });
  if (!svg || !SPARKS[svg.id]) { hideTip(); return; }

  const i = Math.max(0, Math.min(n - 1, Math.round((ev.clientX - r.left) / r.width * (n - 1))));

function card(label, key, v, pts, times, extra = '') {

}

    al.map(a => `<li><span class="ai ${SEV[a.severity] || 'info'}">${icon(a.severity === 'info' ? 'info' : 'alert')}</span>

    </div></section>`;

// /api/v1/history/<site> (one row per local hour, from the day files) and /api/v1/history/<site>/day/<date> (1-minute power).
const HCACHE = {};

  const j = await getJ(`/api/v1/history/${site}?days=${days}`);

  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;

  const spanD = (x1 - x0) / 864e5;

  const nt = Math.max(3, Math.floor(CW / 110));   // about one label per 110 px
  const tick = spanD > 1.5 ? 864e5 * Math.max(1, Math.ceil(spanD / nt)) : 36e5 * Math.max(1, Math.ceil(24 / nt));
  for (let v = Math.ceil(x0 / tick) * tick; v <= x1; v += tick)
    g += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${CM.t}" y2="${CH - CM.b}"/><text class="ax" x="${X(v)}" y="${CH - CM.b + 16}" text-anchor="middle">${spanD > 1.5 ? fdate(v) : fhm(v)}</text>`;

    for (const [t, v] of s.pts) { if (v === null) { prev = null; continue; }

  box.innerHTML = `${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}
    <svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))}">
    ${g}<text class="ax" x="12" y="${(CH - CM.b + CM.t) / 2}" transform="rotate(-90 12 ${(CH - CM.b + CM.t) / 2})" text-anchor="middle">${esc(unit)}</text>
    ${paths}<line class="xh" y1="${CM.t}" y2="${CH - CM.b}" visibility="hidden"/><g class="dots"></g>
    <rect x="${CM.l}" y="${CM.t}" width="${CW - CM.l - CM.r}" height="${CH - CM.t - CM.b}" fill="transparent"/></svg>`;
  const svg = box.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots');
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), t = x0 + ((ev.clientX - r.left) / r.width * CW - CM.l) / (CW - CM.l - CM.r) * (x1 - x0);
    let rows = '', dd = '', ref = null;
    for (const s of series) {
      let best = null; for (const p of s.pts) if (p[1] !== null && (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
      if (!best || Math.abs(best[0] - t) > gapMs) continue; ref = ref ?? best[0];
      dd += `<circle cx="${X(best[0])}" cy="${Y(best[1])}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`;
      rows += `<div>${series.length > 1 ? `<span class="sq" style="background:${s.color}"></span>${esc(s.name)}: ` : ''}<b>${best[1].toFixed(digits)}</b> ${esc(unit)}${s.extra ? s.extra(best) : ''}</div>`;
    }
    if (ref === null) { hideTip(); return; }
    dots.innerHTML = dd; xh.setAttribute('x1', X(ref)); xh.setAttribute('x2', X(ref)); xh.setAttribute('visibility', 'visible');
    showTip(ev, `<b>${fdate(ref)} ${fhm(ref)}${step > 6e4 ? '–' + fhm(ref + step) : ''}</b>${rows}`);
  });
  svg.addEventListener('mouseleave', () => { hideTip(); dots.innerHTML = ''; xh.setAttribute('visibility', 'hidden'); });
}

// Bar chart, one bar per item: [{v, l1, l2, tip, light}]
function barChart(box, bars, unit) {
  sizeTo(box);
  if (!bars.length) { box.innerHTML = '<div class="empty">No records for this period.</div>'; return; }
  const yt = nice(0, Math.max(...bars.map(b => b.v)) || 1), y1 = yt[yt.length - 1], bw = (CW - CM.l - CM.r) / bars.length;
  const Y = v => CH - CM.b - v / y1 * (CH - CM.t - CM.b);
  let g = '', b = '';
  for (const v of yt) g += `<line class="grid" x1="${CM.l}" x2="${CW - CM.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${CM.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  bars.forEach((d, i) => {
    const x = CM.l + i * bw + 1, w = Math.max(2, bw - 2), y = Y(d.v), r = Math.max(0, Math.min(4, w / 2, CH - CM.b - y));
    b += `<path d="M${x},${CH - CM.b}V${y + r}q0,${-r} ${r},${-r}h${w - 2 * r}q${r},0 ${r},${r}V${CH - CM.b}Z" style="fill:var(--s1)${d.light ? ';opacity:.45' : ''}"/>`;
    if (i % Math.ceil(26 / bw) === 0) b += `<text class="ax" x="${x + w / 2}" y="${CH - CM.b + 14}" text-anchor="middle">${esc(d.l1)}</text><text class="ax" x="${x + w / 2}" y="${CH - CM.b + 27}" text-anchor="middle">${esc(d.l2)}</text>`;
    b += `<rect data-i="${i}" x="${CM.l + i * bw}" y="${CM.t}" width="${bw}" height="${CH - CM.t - CM.b}" fill="transparent"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${CW} ${CH + 6}" role="img" aria-label="${esc(unit)} per bar">${g}
    <text class="ax" x="12" y="${CH / 2}" transform="rotate(-90 12 ${CH / 2})" text-anchor="middle">${esc(unit)}</text>${b}</svg>`;
  const svg = box.querySelector('svg');
  svg.addEventListener('mousemove', ev => { const i = ev.target.dataset && ev.target.dataset.i; if (i === undefined) return hideTip(); showTip(ev, bars[i].tip); });
  svg.addEventListener('mouseleave', hideTip);
}

const sensorName = k => (PROF.labels?.[k] || k).replace(/\s*\(.*\)\s*$/, '');
function byDay(rows) {   // local date -> {kwh, minutes, peak, peakT, tmin, tmax}
  const d = {};
  for (const r of rows) {
    const k = r.t.slice(0, 10), o = d[k] ??= {kwh: 0, minutes: 0, peak: null, peakT: '', tmin: null, tmax: null};
    o.kwh += r.kwh; o.minutes += r.minutes;
    if (r.p_max !== undefined && (o.peak === null || r.p_max > o.peak)) { o.peak = r.p_max; o.peakT = r.t.slice(11, 13) + ':00'; }
    if (r.TH1_t_min !== undefined) { o.tmin = o.tmin === null ? r.TH1_t_min : Math.min(o.tmin, r.TH1_t_min); o.tmax = o.tmax === null ? r.TH1_t_max : Math.max(o.tmax, r.TH1_t_max); }
  }
  return d;
}

async function renderHistory() {

  } else if (view === 'day') {

    const ms = tp(dayShown + ' 00:00'), d = byDay(j0.hours)[dayShown];
    const pts = j.minutes.map(m => [tp(`${dayShown} ${m[0]}`), m[1], m[2], m[3]]);
    const pk = pts.reduce((a, p) => (!a || (p[3] ?? p[1]) > (a[3] ?? a[1]) ? p : a), null);
    const tools = `<div class="seg" role="group" aria-label="Day">${segBtn(`data-day="${isoDay(ms - 864e5)}"`, false, '◀ ' + fdate(ms - 864e5))}${segBtn('', true, fdate(ms))}${
      segBtn(`data-day="${isoDay(ms + 864e5)}"`, false, fdate(ms + 864e5) + ' ▶', dayShown >= today)}</div>`;
    box.innerHTML = head(`One day, minute by minute: ${fdate(ms)}`, 'Total power of every minute (mean of the 15-second samples). Hover for the minute\'s lowest and highest sample.', tools) +
      tiles([statTile(dayShown === today ? 'Energy so far' : 'Energy', d ? d.kwh.toFixed(0) : '–', 'kWh', d && d.minutes < 1430 ? `${(d.minutes / 14.4).toFixed(0)} % of the minutes recorded` : ''),
        statTile('Highest 15-second sample', pk ? (pk[3] ?? pk[1]).toFixed(1) : '–', 'kW', pk ? 'at ' + fhm(pk[0]) : ''),
        statTile('Lowest minute', pts.length ? Math.min(...pts.map(p => p[1])).toFixed(1) : '–', 'kW', 'the base load')]) +
      `<div class="mt-16">${chartCard('ch')}</div>`;
    lineChart(el('ch'), [{name: 'Total power', color: C[0], width: 1.4, pts: pts.map(p => [p[0], p[1]]),
      extra: b => { const p = pts.find(q => q[0] === b[0]); return p && p[2] !== null ? `<div class="dim">samples ${p[2].toFixed(1)} – ${p[3].toFixed(1)} kW</div>` : ''; }}],
      {unit: 'kW', yZero: true, gapMs: 3 * 6e4, step: 6e4});
  } else if (view === 'energy') {
    const j = await hourly(span), days = byDay(j.hours), keys = Object.keys(days).sort(), today = j.now.slice(0, 10);
    const full = keys.filter(k => k !== today && days[k].minutes >= 1430);
    const avg = full.length ? full.reduce((a, k) => a + days[k].kwh, 0) / full.length : null;
    const yest = isoDay(tp(today + ' 00:00') - 864e5);
    box.innerHTML = head('Energy per day', `kWh per hotel day (00:00 to 24:00), from the meter's counter. Lighter bars: today, or a day with missing minutes. Last ${span} days.`, spanPicker()) +
      tiles([statTile('Today so far', days[today] ? days[today].kwh.toFixed(0) : '–', 'kWh'),
        statTile('Yesterday', days[yest] ? days[yest].kwh.toFixed(0) : '–', 'kWh'),
        statTile('Mean of the full days', avg === null ? '–' : avg.toFixed(0), 'kWh', `${full.length} full day${full.length === 1 ? '' : 's'}`)]) +
      `<div class="mt-16">${chartCard('ch')}</div>`;
    barChart(el('ch'), keys.map(k => { const d = days[k], ms = tp(k + ' 00:00'), part = k === today || d.minutes < 1430;
      return {v: d.kwh, light: part, l1: DAYS[new Date(ms).getUTCDay()], l2: `${new Date(ms).getUTCDate()} ${MONS[new Date(ms).getUTCMonth()]}`,
        tip: `<b>${fdate(ms)}</b>${d.kwh.toFixed(1)} kWh${part ? ` (${k === today ? 'so far' : (d.minutes / 14.4).toFixed(0) + ' % of the minutes'})` : ''}` +
          (d.peak !== null ? `<br>peak ${d.peak.toFixed(1)} kW (${d.peakT} hour)` : '') +
          (d.tmin !== null ? `<br>${esc(sensorName('TH1_t'))} ${d.tmin.toFixed(1)}–${d.tmax.toFixed(1)} °C` : '')}; }), 'kWh');
  } else if (view === 'week') {
    const j = await hourly(15), now = tp(j.now), d0 = tp(j.now.slice(0, 10) + ' 00:00');
    const w0 = d0 - new Date(d0).getUTCDay() * 864e5, lw0 = w0 - 7 * 864e5;
    const el_ = Math.floor((now - w0) / 36e5) * 36e5;   // complete hours only, the same in both weeks
    if (!el_) { box.innerHTML = head('This week against last week', 'The week started less than an hour ago: come back after the first full hour.'); return; }
    const sum = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.kwh, 0);
    const mins = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.minutes, 0);
    const cur = sum(w0, w0 + el_), last = sum(lw0, lw0 + el_), pct = last ? (cur - last) / last * 100 : null;
    const mx = Math.max(cur, last) || 1, h = v => (v / mx * 240).toFixed(0);
    const perDay = [...Array(7).keys()].map(i => ({i, a: sum(lw0 + i * 864e5, lw0 + (i + 1) * 864e5), b: w0 + i * 864e5 <= now ? sum(w0 + i * 864e5, w0 + (i + 1) * 864e5) : null}));
    const covL = mins(lw0, lw0 + el_) / (el_ / 6e4), covT = mins(w0, w0 + el_) / (el_ / 6e4);
    const gaps = covL < 0.97 || covT < 0.97;
    const verdict = gaps ? `<div class="verdict bad">Not comparable yet: records cover ${(covL * 100).toFixed(0)} % of last week's hours and ${(covT * 100).toFixed(0)} % of this week's (logger offline or backlog not uploaded)</div>`
      : pct === null ? '' : Math.abs(pct) < 0.5 ? `<div class="verdict">About the same as last week (${pct >= 0 ? '+' : ''}${pct.toFixed(1)} %)</div>`
      : `<div class="verdict ${pct > 0 ? 'bad' : 'ok'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)} % ${pct > 0 ? 'more' : 'less'} than last week</div>`;
    box.innerHTML = head('This week against last week', `Weeks start on Sunday 00:00. The complete hours of this week so far, against the same ${(el_ / 36e5).toFixed(0)} hours of last week.`) +
      `<section class="card"><div class="cmp">
        <div><div class="cv">${last.toFixed(0)} kWh</div><div class="cbar prev" style="height:${h(last)}px"></div><div><b class="ink">Last week</b><br><small>${fdate(lw0)} – ${fdate(lw0 + el_)} ${fhm(lw0 + el_)}</small></div></div>
        <div><div class="cv">${cur.toFixed(0)} kWh</div><div class="cbar" style="height:${h(cur)}px"></div><div><b class="ink">This week so far</b><br><small>${fdate(w0)} – ${fdate(w0 + el_)} ${fhm(w0 + el_)}</small></div></div>
       </div>${verdict}</section>` + sec('Day by day') +
      tableCard(`<tr><th>Day</th><th>Last week</th><th>This week</th><th>Change</th></tr>${perDay.map(r => {
         const ch = r.b === null || !r.a ? '' : ((r.b - r.a) / r.a * 100);
         return `<tr><td>${DAYS[r.i]}</td><td>${r.a ? r.a.toFixed(0) + ' kWh' : '–'}</td><td>${r.b === null ? '–' : r.b.toFixed(0) + ' kWh' + (w0 + (r.i + 1) * 864e5 > now ? ' so far' : '')}</td>
           <td>${ch === '' || w0 + (r.i + 1) * 864e5 > now ? '' : `<span class="${ch > 0.5 ? 'bad' : ch < -0.5 ? 'ok' : ''}">${ch >= 0 ? '+' : ''}${ch.toFixed(1)} %</span>`}</td></tr>`; }).join('')}`);
  } else if (view === 'temperature' || view === 'humidity') {
    const j = await hourly(span), q = view === 'temperature' ? 't' : 'rh', unit = q === 't' ? '°C' : '% RH';
    const ids = [...new Set(j.hours.flatMap(r => Object.keys(r)).filter(k => /^TH\d+_/.test(k)).map(k => k.split('_')[0]))].sort();
    const series = ids.map((id, n) => ({name: sensorName(`${id}_${q}`), color: C[n] || QUIET,
      pts: j.hours.map(r => [tp(r.t), r[`${id}_${q}`] ?? null]),
      extra: b => { const r = j.hours.find(x => tp(x.t) === b[0]); return r && r[`${id}_${q}_min`] !== undefined ? ` <span class="dim">(${r[`${id}_${q}_min`].toFixed(q === 't' ? 1 : 0)}–${r[`${id}_${q}_max`].toFixed(q === 't' ? 1 : 0)})</span>` : ''; }}));
    const tl = [];
    for (const s of series) { const v = s.pts.map(p => p[1]).filter(x => x !== null);
      if (v.length) tl.push(statTile(`${s.name}: lowest – highest`, `${Math.min(...v).toFixed(q === 't' ? 1 : 0)} – ${Math.max(...v).toFixed(q === 't' ? 1 : 0)}`, unit, 'hourly means')); }
    box.innerHTML = head(view === 'temperature' ? 'Temperature' : 'Relative humidity',
      `Hourly means of the 5-minute readings; hover for the hour's lowest and highest. ${esc(Object.entries(PROF.sensors || {}).map(([k, v]) => `${k}: ${v}`).join(' · '))}. Last ${span} days.`, spanPicker()) +
      `<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${tl.join('')}</div><div class="mt-16">${chartCard('ch')}</div>`;
    lineChart(el('ch'), series, {unit, digits: q === 't' ? 1 : 0});
  }
}

const fwState = {};   // device -> last view from the server
const fwPost = (url, body, json) => fetch(url, {method: 'POST', cache: 'no-store', body,
  headers: {'X-Requested-With': 'arkan', 'Content-Type': json ? 'application/json' : 'application/octet-stream'}});
function fwStatusHtml(v, off) {
  let h = `Running <b>${esc(v.running || 'unknown')}</b>${v.env ? ` (${esc(v.env)} build)` : ''}. `;
  const o = v.offer;
  if (!o) h += 'No firmware offered.';

    const who = `${o.scope === 'default' ? 'to every logger' : 'to this logger'}${o.by ? ' by ' + esc(o.by) : ''}, ${localTime(o.published, off)}`;
    const what = `<b>${esc(o.version)}</b> (${esc(o.source || o.file)}) offered ${who}`;
    h += {installed: `<span class="ok">${what}: installed.</span>`,
          waiting: `<span class="warnc">${what}: waiting for the logger (within a minute if it is online, else at its next check).</span>`,
          rolled_back: `<span class="bad">${what}: the logger kept restarting on it and went back to ${esc(v.running)}. Not offered again.</span>`,
          not_newer: `${what}: not newer than the running version, nothing to do.`}[v.state] || what;
  }
  if (v.ota_on === '0') h += '<br><span class="bad">ota_on is 0 on this logger: it does not take updates (manage.py set-config ota_on=1).</span>';
  for (const e of v.events.slice(0, 6)) {
    const d = e.kind === 'firmware' ? (e.from ? `firmware ${esc(e.from)} -> ${esc(e.to)}` : `first seen with firmware ${esc(e.to)}`)
            : e.kind === 'boot' ? `restart: ${esc(e.reason)}`
            : `${esc(e.kind.replace('ota_', ''))} ${esc(e.version || '')} ${e.by ? 'by ' + esc(e.by) : ''}`;
    h += `<div class="ev">${localTime(e.ts, off)}: ${d}</div>`;
  }
  return h;
}
async function fwRefresh(dev, off) {
  const r = await fetch(`/api/v1/admin/fw/${encodeURIComponent(dev)}`, {cache: 'no-store'});
  if (!r.ok) return;
  const v = await r.json();
  fwState[dev] = v;
  el(`fws-${dev}`).innerHTML = fwStatusHtml(v, off);
  el(`fwsum-${dev}`).textContent = `${dev} · running ${v.running || 'unknown'}${v.state === 'waiting' ? ', update waiting' : ''}`;
  const sel = el(`fwfile-${dev}`);
  if (!sel.dataset.done) {
    sel.innerHTML = v.files.length ? v.files.map(f => `<option value="${esc(f.file)}">${esc(f.file)} (${Math.round(f.size / 1024)} kB)</option>`).join('') : '<option value="">none yet</option>';
    sel.dataset.done = 1;

}
async function fwGithub(devs) {
  let rel = [], err = '';
  try { const r = await fetch('/api/v1/admin/github/releases', {cache: 'no-store'}); const j = await r.json(); if (r.ok) rel = j.releases; else err = j.error; }
  catch (e) { err = 'server not reachable'; }
  for (const dev of devs) {
    const sel = el(`fwgh-${dev}`), env = fwState[dev]?.env || 'usb';
    if (err || !rel.length) { sel.innerHTML = `<option value="">${esc(err || 'no release with a logger-*.bin file')}</option>`; continue; }
    let o = '', picked = false;
    for (const x of rel) for (const a of x.assets) {
      const aEnv = (a.name.match(/^logger-([a-z0-9]+)-\d/) || [, 'usb'])[1];
      const pick = !picked && aEnv === env;
      picked = picked || pick;
      o += `<option value="${a.id}"${pick ? ' selected' : ''}>${esc(x.tag)}: ${esc(a.name)}${x.prerelease ? ' (pre-release)' : ''}</option>`;
    }
    sel.innerHTML = o;
  }
}
async function fwAction(dev, kind, off) {
  const m = el(`fwmsg-${dev}`), force = el(`fwforce-${dev}`).checked;
  let label, call;
  if (kind === 'cancel') {
    if (!ask(`Withdraw the firmware offered to ${dev}?`)) return;
    call = () => fwPost(`/api/v1/admin/fw/${dev}/cancel`, '{}', true);
  } else {
    if (kind === 'github') {
      const id = el(`fwgh-${dev}`).value;
      if (!id) return;
      label = el(`fwgh-${dev}`).selectedOptions[0].textContent;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/github`, JSON.stringify({asset_id: +id, force}), true);
    } else if (kind === 'upload') {
      const f = el(`fwup-${dev}`).files[0];
      if (!f) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Choose a .bin file first.</div>'; return; }
      label = f.name;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/upload?force=${force ? 1 : 0}&name=${encodeURIComponent(f.name)}`, f, false);
    } else {
      const file = el(`fwfile-${dev}`).value;
      if (!file) return;
      label = file;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/offer`, JSON.stringify({file, force}), true);
    }
    if (!ask(`Send ${label} to ${dev}?\n\nThe logger installs it and restarts (about 30 s without readings, nothing is lost: the SD card keeps recording). If the new firmware keeps restarting, it goes back to the current one by itself.`)) return;
  }
  m.textContent = 'Working...';
  try {
    const r = await call();
    const j = await r.json();
    m.innerHTML = r.ok ? `<div class="banner good" style="margin:8px 0 0">${kind === 'cancel' ? (j.cancelled ? 'Offer withdrawn.' : 'Nothing was offered to this logger.') : `Firmware ${esc(j.offer.version)} offered to ${esc(dev)}.`}</div>`
                       : `<div class="banner crit" style="margin:8px 0 0">${esc(j.error || 'HTTP ' + r.status)}</div>`;
    if (r.ok) el(`fwfile-${dev}`).dataset.done = '';
  } catch (e) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Server not reachable.</div>'; }
  fwRefresh(dev, off);
}

  await Promise.all(devs.map(dev => fwRefresh(dev, off)));
  if (ME.github) fwGithub(devs);
  setInterval(() => devs.forEach(dev => fwRefresh(dev, off)), 30000);
}

// ------------------------------------------------------------------ page
const LABEL = {versions: 'firmware versions', register: 'register table', sites: 'list of sites'};
async function show(id) {
  view = VIEWS.some(v => v.id === id) ? id : 'now';
  renderChrome();
  el('fw').hidden = true;
  scrollTo(0, 0);
  if (view === 'firmware') {   // the panel lives in #fw, out of reach of the 15 s refresh of #content
    el('content').innerHTML = '';
    await fwReady;
    if (view !== 'firmware') return;
    if (isAdmin()) el('fw').hidden = false;
    else el('content').innerHTML = head('Firmware update', '') + '<section class="card"><div class="empty">Firmware update is only for the logins listed in ADMIN_USERS on the server (docs/OTA.md).</div></section>';
    return;
  }
  if (view === 'now') { el('content').innerHTML = ''; return tick(); }
  el('content').innerHTML = '<section class="card"><div class="empty">Loading…</div></section>';
  try { await renderHistory(); }
  catch (e) { console.error(e); el('content').innerHTML = `<section class="card"><div class="empty">Could not read the ${WXVIEWS[view] ? 'weather' : LABEL[view] || 'history'} from the server.</div></section>`; }
}
document.addEventListener('click', ev => {
  const r = ev.target.closest('button[data-role]');
  if (r) return setRole(r.dataset.role);
  const b = ev.target.closest('button[data-span],button[data-day],button[data-vf]');
  if (!b || b.disabled) return;
  if (b.dataset.vf) vfAll = b.dataset.vf === 'all';
  if (b.dataset.span) span = +b.dataset.span;
  if (b.dataset.day) dayShown = b.dataset.day;
  show(view);
});
addEventListener('hashchange', () => show(location.hash.slice(1)));
const STATIC = ['now', 'firmware', 'prefs', 'register'];   // not redrawn by a resize or the 5-minute refresh
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!STATIC.includes(view)) renderHistory().catch(() => {}); }, 300); });

async function tick() {
  try { await loadSite(); }
  catch (e) { console.error(e); STATUS = '<span class="live-pill off"><i></i>Server not reachable</span>'; renderChrome(); }
}
if (MOCK) el('mocknote').hidden = false;
fwReady = fwInit().catch(() => {});
view = VIEWS.some(v => v.id === location.hash.slice(1)) ? location.hash.slice(1) : 'now';
renderChrome();
if (view === 'now') tick(); else tick().finally(() => fwReady).finally(() => show(view));
setInterval(tick, 15000);
setInterval(() => { if (!STATIC.includes(view) && !document.hidden) { delete HCACHE[span]; WXC = null; WXL = {}; show(view); } }, 300e3);
</script>
