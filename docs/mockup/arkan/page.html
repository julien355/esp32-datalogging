<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arkan Monitoring: design mockup</title>
<style>/*__KIT_CSS__*/</style>
<style>
/* Monitoring additions to the Arkan UI kit (the kit itself is not changed). */
/* Series colours: L1, L2, L3 / first, second, third series, never cycled; --s4 is the quiet reference line. */
:root{--s1:#0D62BC;--s2:#D9641E;--s3:#12957F;--s4:#9AA5B1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="contrast"]){--s1:#5AA2EC;--s2:#F5924E;--s3:#3CC9AE;--s4:#6E7C91}}
:root[data-theme="dark"]{--s1:#5AA2EC;--s2:#F5924E;--s3:#3CC9AE;--s4:#6E7C91}
:root[data-theme="contrast"]{--s1:#FFE14D;--s2:#7FD4FF;--s3:#FF9CF0;--s4:#E6E6E6}

/* View as above the navigation, as in the CMMS (cmms-demo/src/features.css) */
.side-role{display:flex;flex-direction:column;gap:8px}
.side-role .full{display:none}
@container app (min-width:1100px){.side-role .rail{display:none}.side-role .full{display:flex;flex-direction:column;gap:8px}}
.side a.prop{text-decoration:none;color:inherit}
.side a.prop:hover{background:var(--surface-2)}
.snav .nl{display:none}
@container app (min-width:1100px){.snav .nl{display:inline}.snav .ns{display:none}}
.side-foot .full{font-size:12.5px;color:var(--muted);padding:0 4px}
/* The page list scrolls on its own; Settings and the live state stay at the bottom of the side bar */
.side{overflow:hidden}
#snav{flex:1 1 auto;min-height:0;overflow-y:auto}
.side-foot{margin-top:0;border-top:1px solid var(--line);padding-top:8px}
@container app (min-width:1100px){.snav a{padding-block:7px}.snav .sep{margin-block:6px}}
@container app (max-width:699px){.wxline{border-radius:var(--r-lg);padding:8px 14px}}
.topbar .icon-btn{margin:0}

.sec{margin:24px 2px 10px}
.sec span{text-transform:none;letter-spacing:0;font-weight:500}
.tiles{margin-bottom:0}
.kpi .eyebrow{min-height:0}
.headtools{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.clock{font-size:13px;color:var(--muted);white-space:nowrap}
.live-pill.off{color:var(--crit-ink);background:var(--crit-bg)}
.live-pill.off i{background:var(--crit);animation:none}
.live-pill.idle{color:var(--muted);background:var(--surface-2)}
.live-pill.idle i{background:var(--muted);animation:none}
.spark{display:block;width:100%;height:40px;margin-top:4px;overflow:visible}
.spark.tall{height:64px;margin-top:10px}
.spark path{fill:none;stroke-width:2;stroke-linejoin:round}
.spark .xh{stroke:var(--control);stroke-dasharray:2 2}
.phase{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:2px 12px;align-items:baseline}
.phase .h{font-size:12px;color:var(--muted);text-align:right}
.phase .n{font-size:22px;font-weight:800;color:var(--ink);text-align:right;line-height:1.25;letter-spacing:-.01em}
.phase .l{font-size:12.5px;color:var(--muted)}
.swl{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.capbar span.warn{background:var(--warn)}
.capbar span.crit{background:var(--crit)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.facts>div{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.facts small{display:block;color:var(--muted);font-size:12px}
.facts b{display:block;font-size:15px;color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.facts .note{display:block;font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto}
.chart svg path.sl{fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .xh{stroke-dasharray:3 3}
.legend{margin:0 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.ftip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow-pop);z-index:90;display:none}
.ftip>b:first-child{display:block;margin-bottom:2px}
.ftip .sq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.ftip .dim{opacity:.75}
.cmp{display:flex;gap:48px;justify-content:center;align-items:flex-end;min-height:300px;text-align:center}
.cmp .cbar{width:130px;max-width:30vw;border-radius:6px 6px 0 0;margin:4px auto 6px;background:var(--s1)}
.cmp .cbar.prev{opacity:.45}
.cmp .cv{font-size:19px;font-weight:800;color:var(--ink)}
.cmp small{color:var(--muted);font-size:12px}
.verdict{text-align:center;font-weight:700;margin:14px 0 4px;color:var(--ink-2)}
.ok{color:var(--good-ink)}.bad{color:var(--crit-ink)}.warnc{color:var(--warn-ink)}
.dimtxt{color:var(--muted);font-size:12px;font-weight:500}
.wxline{display:inline-flex;flex-wrap:wrap;gap:4px 12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:3px 14px;font-size:13.5px;color:var(--ink-2);text-decoration:none}
.wxline b{color:var(--ink)}
.wxline:hover{background:var(--surface-2)}
.wxi{margin-right:4px}
table.data tr.past td{color:var(--muted)}
table.data tr.cur td{background:var(--brand-tint);font-weight:700}
table.data{margin-top:0}
table.data a{font-weight:700;text-decoration:none}
.banner.good{background:var(--good-bg);color:var(--good-ink)}
.banner.crit{background:var(--crit-bg);color:var(--crit-ink)}
.banner{white-space:pre-wrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar select,.bar input[type="text"]{width:auto}
table.regs input,table.regs select{padding:4px 6px;font-size:13px;min-width:64px}
table.regs input[type="checkbox"]{width:18px;height:18px;min-width:0;accent-color:var(--action)}
table.regs tr.changed td{background:var(--warn-bg)}
table.regs tr.new td{background:var(--good-bg)}
table.regs td.n{color:var(--muted);width:2em}
textarea.csv{min-height:220px;font-family:var(--mono);font-size:12.5px}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
code{background:var(--surface-2);padding:0 4px;border-radius:4px;font-family:var(--mono);font-size:.86em}
pre{background:var(--surface-2);padding:10px 12px;border-radius:var(--r-md);font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.help{font-size:13px;color:var(--muted)}
.help p{margin-top:8px}
.fwrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 12px;align-items:end;padding-block:10px;border-top:1px solid var(--line)}
@container app (min-width:700px){.fwrow{grid-template-columns:220px minmax(0,1fr) auto;align-items:center}}
.fwrow b{color:var(--ink);font-size:14px}
.fwstat{font-size:14px;margin-bottom:10px}
.fwstat .ev{font-size:12.5px;color:var(--muted);margin-top:2px}
@container app (max-width:560px){.hide-s{display:none}}
.mocknote{background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px;font-weight:600;text-align:center;padding:4px 12px}
</style>
<script>/*__KIT_JS__*/</script>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<div class="mocknote" id="mocknote" hidden>Design mockup · simulated data, 14 days · nothing is sent to a logger</div>
<div class="shell" id="shell">
  <div class="app" id="app">
    <aside class="side" aria-label="Main navigation">
      <div class="brand"><!--__MARK__--><!--__BRANDTXT__--></div>
      <a class="prop" href="#sites" id="prop"><b>Site</b><small></small></a>
      <div class="side-role" id="sideRole"></div>
      <nav class="snav" id="snav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <header class="topbar">
      <!--__MARK__-->
      <div class="t-prop"><b id="tSite">Site</b><small id="tView"></small></div>
      <button class="icon-btn" data-ui-open="roleSheet" aria-label="View as" title="View as"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    </header>
    <main class="main" id="main"><div id="content"></div><div id="fw" hidden></div></main>
    <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
  </div>
</div>
<div class="sheet-wrap" id="moreSheet" hidden><div class="sheet small" tabindex="-1" role="dialog" aria-label="All pages">
  <div class="sheet-top"><h2>All pages</h2><button class="icon-btn" data-ui-close aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="more-list" id="moreList"></div></div></div>
<div class="sheet-wrap" id="roleSheet" hidden><div class="sheet small" tabindex="-1" role="dialog" aria-label="View as">
  <div class="sheet-top"><h2>View as</h2><button class="icon-btn" data-ui-close aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="roleList"></div><p class="muted small" id="roleHint"></p></div></div>
<div class="toast" id="ui-toast" role="status" hidden></div>
<div class="ftip" id="tip"></div>
<script>
const FX = /*__FIXTURES__*/null;   // mockup only: the answers of the server, saved by capture.py. The real page has no FX.
const MOCK = !!FX;
const site = MOCK ? FX.site : (location.pathname.match(/^\/live\/([a-z0-9-]+)/) || [])[1] || null;
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = ['var(--s1)', 'var(--s2)', 'var(--s3)'];   // L1, L2, L3 / series order, never cycled
const QUIET = 'var(--s4)';
const num = x => { const v = parseFloat(x); return isFinite(v) ? v : null; };
const nowMs = () => MOCK ? Date.parse(FX.time) : Date.now();
const toast = msg => window.ArkanUI && ArkanUI.toast(msg);
// The mockup may run in a frame where confirm() is refused: there it goes ahead (nothing is sent anyway).
const ask = text => MOCK ? true : confirm(text);

const IC = {
 gauge:'<path d="M12 14.5 16 10"/><path d="M4 18a9 9 0 1 1 16 0z"/>',
 zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
 bars:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
 thermo:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 12.5l2 2 4-4"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
 upload:'<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 dots:'<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',
 alert:'<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.1"/>',
 info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.1"/>',
 check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
 down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
};
const icon = (n, cls) => `<svg class="i${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;

// Decimals and unit by value name (the part after the device or sensor id)
const FMT = {p: [1, 'kW'], s: [1, 'kVA'], q: [1, 'kVAr'], pf: [2, ''], f: [2, 'Hz'], v1: [1, 'V'], v2: [1, 'V'], v3: [1, 'V'],
  v12: [0, 'V'], v23: [0, 'V'], v31: [0, 'V'], i1: [1, 'A'], i2: [1, 'A'], i3: [1, 'A'], p1: [1, 'kW'], p2: [1, 'kW'], p3: [1, 'kW'],
  e: [0, 'kWh'], eq: [0, 'kVArh'], t: [1, '°C'], rh: [0, '%']};
const part = k => k.slice(k.indexOf('_') + 1).replace(/_(min|max)$/, '');
const fmt = (k, v) => { if (v === null || v === undefined) return '–'; const f = FMT[part(k)]; return f ? v.toFixed(f[0]) : String(+v.toFixed(3)); };
const unitOf = k => (FMT[part(k)] || [0, ''])[1];
const cleanLabel = lab => lab.replace(/\s*\(C\)\s*$/, ' temperature').replace(/\s*\(%RH\)\s*$/, ' humidity')
  .replace(/\s*\((kW|kVA|Hz|A|V)\)\s*$/, '');
function dewPoint(t, rh) {   // same formula as the alarms (server/app/alarms.py)
  if (t === null || rh === null || rh <= 0) return null;
  const a = 17.62, b = 243.12, g = Math.log(rh / 100) + a * t / (b + t);
  return b * g / (a - g);
}
function localTime(iso, offH, withDate = true) {
  if (!iso) return '–';
  const s = new Date(Date.parse(iso) + (offH || 0) * 3600e3).toISOString();
  return withDate ? s.slice(0, 16).replace('T', ' ') : s.slice(11, 19);
}
// Time axis helpers: "YYYY-MM-DD HH:MM" (hotel time) as a number, no time zone conversion
const tp = s => { const [d, h] = s.split(' '); const [Y, Mo, Da] = d.split('-').map(Number); const [hh, mm] = (h || '0:0').split(':').map(Number);
  return Date.UTC(Y, Mo - 1, Da, hh, mm); };
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fdate = ms => { const d = new Date(ms); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONS[d.getUTCMonth()]}`; };
const fhm = ms => new Date(ms).toISOString().slice(11, 16);
const isoDay = ms => new Date(ms).toISOString().slice(0, 10);

// ------------------------------------------------------------------ mockup: the server's answers come from FX
if (MOCK) {
  const J = (body, status = 200) => Promise.resolve({ok: status < 400, status, json: async () => JSON.parse(JSON.stringify(body))});
  const since = days => isoDay(tp(FX.history.now.slice(0, 10) + ' 00:00') - (days - 1) * 864e5);
  window.fetch = (url, opt = {}) => {
    const u = String(url); let m;
    if ((opt.method || 'GET') === 'POST') {
      toast('Mockup: nothing was sent');
      if (/\/registers\/[^/]+\/check$/.test(u)) { const csv = JSON.parse(opt.body).csv; return J({ok: true, errors: [], warnings: [], rows: csvToRows(csv), csv}); }
      if (/\/(registers|meter-settings)\//.test(u)) return J({ok: true, version: (FX.registers.platform?.version || 0) + 1});
      if (/\/cancel$/.test(u)) return J({ok: true, cancelled: false});
      return J({ok: true, offer: {version: FX.versions.latest || '0.0.0'}});
    }
    if (u === '/api/v1/status') return J(FX.status);
    if (u === '/api/v1/admin/me') return J(FX.me);
    if (u === '/api/v1/admin/github/releases') return J(FX.github);
    if (/^\/api\/v1\/admin\/fw\//.test(u)) return J(FX.fw);
    if (/^\/api\/v1\/admin\/registers\//.test(u)) return J(FX.registers);
    if (/^\/api\/v1\/live\/[a-z0-9-]+$/.test(u)) return J(FX.live);
    if (/^\/api\/v1\/alarms\//.test(u)) return J(FX.alarms);
    if (/^\/api\/v1\/versions\//.test(u)) return J(FX.versions);
    if ((m = u.match(/^\/api\/v1\/history\/[a-z0-9-]+\/day\/(\d{4}-\d{2}-\d{2})$/))) {
      const ks = Object.keys(FX.days).sort(), k = FX.days[m[1]] ? m[1] : ks[0];   // days not saved show the oldest saved day
      return J({...FX.days[k], day: m[1]});
    }
    if ((m = u.match(/^\/api\/v1\/history\/[a-z0-9-]+\?days=(\d+)$/))) { const f = since(+m[1]); return J({...FX.history, from: f + ' 00:00', hours: FX.history.hours.filter(r => r.t >= f)}); }
    if ((m = u.match(/^\/api\/v1\/weather\/[a-z0-9-]+\/log\?days=(\d+)/))) { const f = since(+m[1]);
      return J({...FX.wxlog, hours: FX.wxlog.hours.filter(r => r.t >= f), days: FX.wxlog.days.filter(d => d.date >= f)}); }
    if (/^\/api\/v1\/weather\/[a-z0-9-]+$/.test(u)) return J(FX.weather);
    return J({ok: false, error: 'not in the mockup'}, 404);
  };
}
const getJ = async url => (await fetch(url, {cache: 'no-store'})).json();

// ------------------------------------------------------------------ navigation, View as, chrome
// grp: the group label starts at this item. admin: only for logins in ADMIN_USERS. global: not tied to a site.
const VIEWS = [
  {id: 'now', name: 'Live now', short: 'Live', ic: 'gauge', note: 'every 15 s'},
  {id: 'power', name: 'Power', ic: 'zap', grp: 'History', note: 'kW, hour by hour'},
  {id: 'day', name: 'One day', ic: 'clock', note: 'minute by minute'},
  {id: 'energy', name: 'Energy per day', short: 'Energy', ic: 'bars', note: 'kWh'},
  {id: 'week', name: 'This week vs last', short: 'Week', ic: 'swap', note: 'kWh so far'},
  {id: 'temperature', name: 'Temperature', short: 'Temp.', ic: 'thermo', note: 'room and outdoor'},
  {id: 'humidity', name: 'Humidity', ic: 'drop', note: 'room and outdoor'},
  {id: 'wtoday', name: 'Today', ic: 'sun', grp: 'Weather', note: 'forecast hour by hour'},
  {id: 'wtomorrow', name: 'Tomorrow', ic: 'cal', note: 'next day forecast'},
  {id: 'wlog', name: 'Weather log', short: 'Log', ic: 'clip', note: 'actual vs forecast'},
  {id: 'register', name: 'Meter registers', short: 'Registers', ic: 'list', grp: 'Logger', note: 'see, edit, send the table'},
  {id: 'versions', name: 'Firmware versions', short: 'Versions', ic: 'chip', note: 'running, history'},
  {id: 'firmware', name: 'Firmware update', short: 'Update', ic: 'upload', note: 'remote, admins only', admin: true},
  {id: 'sites', name: 'All sites', short: 'Sites', ic: 'home', grp: 'Platform', note: 'every site and logger', global: true},
  {id: 'prefs', name: 'Settings', ic: 'sliders', note: 'display, view as', global: true, foot: true},
];
let ME = {user: '', admin: false, github: false};   // from /api/v1/admin/me: the Caddy login and whether it is in ADMIN_USERS
let viewAs = 'admin';
try { viewAs = localStorage.getItem('arkan-mon.viewas') || 'admin'; } catch (e) {}
const isAdmin = () => ME.admin && viewAs === 'admin';
const ROLE_NAME = {admin: 'Admin', viewer: 'Viewer'};
const ROLE_NOTE = {admin: 'every page, firmware update included', viewer: 'what a login outside ADMIN_USERS sees'};
const roles = () => ME.admin ? ['admin', 'viewer'] : ['viewer'];
const role = () => isAdmin() ? 'admin' : 'viewer';
let view = 'now', span = 14, dayShown = null, PROF = {}, STATUS = '', fwReady = Promise.resolve();
const visible = () => VIEWS.filter(v => !(v.admin && !isAdmin()));

const navLink = v => `<a href="#${v.id}" title="${esc(v.name + ': ' + v.note)}"${v.id === view ? ' aria-current="page"' : ''}>${icon(v.ic)}<span class="nl">${esc(v.name)}</span><span class="ns">${esc(v.short || v.name)}</span></a>`;
const renderFoot = () => { el('sideFoot').innerHTML = `<nav class="snav" aria-label="Settings">${VIEWS.filter(v => v.foot).map(navLink).join('')}</nav><div class="full">${STATUS}${MOCK ? `<span class="chip-demo">${icon('alert', 'sm')}Simulated data</span>` : ''}</div>`; };
let chromeName = null;
function renderChrome() {
  const name = PROF.name || site || 'Monitoring', cur = VIEWS.find(v => v.id === view) || VIEWS[0];
  chromeName = PROF.name || null;
  el('prop').innerHTML = `<b>${esc(name)}</b><small>${esc(site || '')} · all sites</small>`;
  el('tSite').textContent = name; el('tView').textContent = cur.name;
  let h = '';
  for (const v of visible().filter(v => !v.foot)) {
    if (v.grp) h += `<div class="sep" role="separator"></div><div class="sep-l">${esc(v.grp)}</div>`;
    h += navLink(v);
  }

// ------------------------------------------------------------------ Live now
// Sparkline: one or more series over the last 60 minutes, hover shows the values at that time
const SPARKS = {};
let sparkId = 0;
function spark(series, times, {tall = false, unitKey} = {}) {
  const all = series.flatMap(s => s.pts).filter(v => v !== null);
  if (all.length < 2) return '<div class="sub">History builds up over the next minutes</div>';
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const n = times.length, H = tall ? 60 : 36, X = i => (n > 1 ? i / (n - 1) * 100 : 50), Y = v => (H - 2) - (v - lo) / (hi - lo) * (H - 4);
  const paths = series.map(s => {
    let d = '';
    s.pts.forEach((v, i) => { if (v !== null) d += `${d && s.pts[i - 1] !== null ? 'L' : 'M'}${X(i).toFixed(2)},${Y(v).toFixed(2)}`; });
    return `<path d="${d}" style="stroke:${s.color}" vector-effect="non-scaling-stroke"/>`;
  }).join('');
  const id = 'sp' + (++sparkId);
  SPARKS[id] = {series, times, unitKey};
  return `<svg class="spark${tall ? ' tall' : ''}" id="${id}" viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img" aria-label="last 60 minutes">
    ${paths}<line class="xh" y1="0" y2="${H}" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>`;
}
function showTip(ev, html) {
  const tip = el('tip'); tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.max(4, Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8)) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
}
const hideTip = () => { el('tip').style.display = 'none'; };
document.addEventListener('mousemove', ev => {
  if (ev.target.closest && ev.target.closest('.chart')) return;   // the history charts have their own tooltip
  const svg = ev.target.closest && ev.target.closest('svg.spark');
  document.querySelectorAll('svg.spark .xh').forEach(l => { if (!svg || l.parentNode !== svg) l.setAttribute('visibility', 'hidden'); });
  if (!svg || !SPARKS[svg.id]) { hideTip(); return; }
  const sp = SPARKS[svg.id], r = svg.getBoundingClientRect(), n = sp.times.length;
  const i = Math.max(0, Math.min(n - 1, Math.round((ev.clientX - r.left) / r.width * (n - 1))));
  const xh = svg.querySelector('.xh'), x = n > 1 ? i / (n - 1) * 100 : 50;
  xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
  showTip(ev, `<b>${esc(sp.times[i])}</b>` + sp.series.map(s => `<div>${sp.series.length > 1 ? `<span class="sq" style="background:${s.color}"></span>${esc(s.name)}: ` : ''}<b>${fmt(sp.unitKey || s.key, s.pts[i])}</b> ${esc(unitOf(sp.unitKey || s.key))}</div>`).join(''));
});

function card(label, key, v, pts, times, extra = '') {
  const vals = pts.filter(x => x !== null);
  const range = vals.length > 1 ? `<div class="sub">60 min: ${fmt(key, Math.min(...vals))} – ${fmt(key, Math.max(...vals))} ${esc(unitOf(key))}</div>` : '';
  return `<div class="kpi"><span class="eyebrow">${esc(label)}</span><div class="big">${fmt(key, v)}<small>${esc(unitOf(key))}</small></div>${extra}${range}
    ${spark([{key, name: label, color: C[0], pts}], times)}</div>`;
}
function capBar(frac, text) {
  if (frac === null || !isFinite(frac)) return '';
  const pct = Math.max(0, frac * 100), cls = pct >= 90 ? 'crit' : pct >= 75 ? 'warn' : '';
  return `<div><div class="capbar"><span class="${cls}" style="width:${Math.min(100, pct).toFixed(1)}%"></span></div><div class="sub">${pct.toFixed(0)} % ${esc(text)}</div></div>`;
}

async function loadSite() {
  for (const k in SPARKS) delete SPARKS[k];
  const j = await getJ(`/api/v1/live/${site}`);
  const prof = j.profile || {}; PROF = prof;
  const labels = prof.labels || {}, off = prof.utc_offset_h ?? 8, sensors = prof.sensors || {};
  const wanted = (prof.live && prof.live.values) || null;
  document.title = `Live: ${prof.name || site}`;
  let html = '', worst = null;

  // Open alarms first
  const al = j.alarms || [];
  if (al.length) html += `<section class="card mb-16"><div class="card-head"><h2>Open alarms</h2><span class="pill ${al.some(a => a.severity === 'critical') ? 'crit' : 'warn'}">${al.length} open</span></div><ul class="alist">${
    al.map(a => `<li><span class="ai ${SEV[a.severity] || 'info'}">${icon(a.severity === 'info' ? 'info' : 'alert')}</span>
      <div><b>${esc(a.id)} ${esc(a.name)}</b><small>since ${localTime(a.since, off)} · worst ${esc(a.worst ?? '–')} ${esc(a.unit)}</small></div>${sevPill(a.severity)}</li>`).join('')}</ul></section>`;
  html += `<div class="inline">${al.length ? '' : `<span class="state good">${icon('check')}No open alarm</span>`}${await wxStrip()}</div>`;

  const devs = Object.keys(j.devices || {});
  if (!devs.length) html += sec('Now') + '<section class="card"><div class="empty">No live data for this site (logger offline or not installed yet).</div></section>';

  for (const dev of devs) {
    const d = j.devices[dev], vals = d.last.values || {}, sys = d.last.sys || {};
    worst = Math.max(worst ?? 0, d.age_s);
    const times = d.history.map(h => localTime(h.ts, off, false));
    const H = k => d.history.map(h => num(h.values[k]));
    const V = k => num(vals[k]);
    const keys = (wanted || Object.keys(vals)).filter(k => k in vals);
    const used = new Set();
    const has = k => keys.includes(k);
    const L = (k, dflt) => cleanLabel(labels[k] || dflt || k);
    const meters = [...new Set(keys.map(k => k.split('_')[0]).filter(p => /^EM\d+$/.test(p)))];
    if (devs.length > 1) html += `<h2 class="sec" style="font-size:17px">${esc(dev)}</h2>`;

    for (const M of meters) {
      // Power: the headline values
      const g = [];
      if (has(`${M}_p`)) { used.add(`${M}_p`); g.push(card(L(`${M}_p`, 'Total power'), `${M}_p`, V(`${M}_p`), H(`${M}_p`), times)); }
      if (has(`${M}_s`)) { used.add(`${M}_s`);
        g.push(card(L(`${M}_s`, 'Apparent power'), `${M}_s`, V(`${M}_s`), H(`${M}_s`), times,
          prof.contracted_kva ? capBar(V(`${M}_s`) / prof.contracted_kva, `of the ${prof.contracted_kva} kVA PLN contract`) : '')); }
      for (const [k, dl] of [['pf', 'Power factor'], ['f', 'Frequency']])
        if (has(`${M}_${k}`)) { used.add(`${M}_${k}`); g.push(card(L(`${M}_${k}`, dl), `${M}_${k}`, V(`${M}_${k}`), H(`${M}_${k}`), times)); }
      if (g.length) html += sec('Power' + (meters.length > 1 ? ' · ' + M : '')) + tiles(g);

      // Per phase: voltage and current, three lines in one card each
      let ph = '';
      for (const [q, title] of [['v', 'Voltage L-N'], ['i', 'Current']]) {
        const ks = [1, 2, 3].map(n => `${M}_${q}${n}`);
        if (!ks.some(has)) continue;
        ks.forEach(k => used.add(k));
        const cur = ks.map(V);
        let rows = `<div></div><div class="h">L1</div><div class="h">L2</div><div class="h">L3</div><div class="l">now</div>` +
          cur.map((v, n) => `<div class="n"><span class="swl" style="background:${C[n]}"></span>${fmt(ks[n], v)}</div>`).join('');
        const hist = ks.map(H);
        rows += `<div class="l">60 min</div>` + hist.map((h, n) => { const x = h.filter(v => v !== null);
          return `<div class="h">${x.length ? fmt(ks[n], Math.min(...x)) + '–' + fmt(ks[n], Math.max(...x)) : '–'}</div>`; }).join('');
        let extra = '', note = '';
        if (q === 'i') {   // against the PLN per-phase limit (contract kVA / 3 / contract voltage), else the breaker

          const pln = prof.contracted_kva && prof.contract_v_ln ? prof.contracted_kva * 1000 / 3 / prof.contract_v_ln : null;
          if (pln) extra = capBar(mx / pln, `of the ${pln.toFixed(0)} A PLN phase limit (highest phase)`);

        ph += `<section class="card"><div class="card-head"><h2>${title} (${unitOf(ks[0])})</h2>${note ? `<span class="muted small">${note}</span>` : ''}</div><div class="phase">${rows}</div>${extra}
          ${spark(ks.map((k, n) => ({key: k, name: 'L' + (n + 1), color: C[n], pts: hist[n]})), times, {tall: true})}</section>`;

    const env = [];
    for (const S of ths) for (const q of ['t', 'rh']) {

      <div><small>Last reading (hotel time)</small><b>${localTime(d.last.ts, off).slice(0, 10)} ${localTime(d.last.ts, off, false)}</b></div>
      <div><small>WiFi signal</small><b>${rssi === null ? '–' : `${rssi} dBm <span class="dimtxt${q === 'weak' ? ' bad' : ''}">${q}</span>`}</b></div>
      <div><small>Upload backlog</small><b class="${(num(sys.backlog_min) || 0) > 60 ? 'bad' : ''}">${esc(sys.backlog_min ?? '–')} min</b></div>

      <div><small>Firmware</small><b>${esc(sys.fw ?? '–')}</b></div>
      ${up !== null ? `<div><small>Running for</small><b>${up >= 86400 ? Math.floor(up / 86400) + ' d ' : ''}${Math.floor(up % 86400 / 3600)} h ${Math.floor(up % 3600 / 60)} min</b></div>` : ''}
    </div></section>`;
  }

  // The alarm log last
  try {
    const lj = await getJ(`/api/v1/alarms/${site}`);
    const rows = lj.log.slice(-20).reverse();
    html += sec('Alarm log', 'last 20, hotel time');
    if (!rows.length) html += '<section class="card"><div class="empty">Nothing logged yet.</div></section>';
    else html += tableCard('<tr><th>Time</th><th>Alarm</th><th>State</th><th>Value</th><th class="hide-s">Message</th></tr>' + rows.map(r => {
        const c = r.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x => x.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));
        return `<tr><td>${esc(c[1])}</td><td><span class="mono">${esc(c[3])}</span> ${esc(c[4])} ${sevPill(c[5])}</td><td>${esc(c[6])}</td>
          <td>${esc(c[7])} ${c[9] === 'event' ? '' : esc(c[9])}</td><td class="hide-s wrap">${esc(c[11])}</td></tr>`; }).join(''));
  } catch (e) {}

  const clock = `<span class="clock">Hotel time ${localTime(new Date(nowMs()).toISOString(), off, false).slice(0, 5)}</span>`;
  STATUS = !devs.length ? '<span class="live-pill off"><i></i>No live data</span>'

// ------------------------------------------------------------------ history views
// /api/v1/history/<site> (one row per local hour, from the day files) and /api/v1/history/<site>/day/<date> (1-minute power).
const HCACHE = {};
async function hourly(days) {
  const c = HCACHE[days];
  if (c && Date.now() - c.at < 120e3) return c.j;
  const j = await getJ(`/api/v1/history/${site}?days=${days}`);
  HCACHE[days] = {at: Date.now(), j};
  return j;
}
function nice(lo, hi, n = 5) {
  const sp = hi - lo || 1, s0 = sp / n, p = Math.pow(10, Math.floor(Math.log10(s0)));
  const st = [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= s0);
  const t = []; for (let v = Math.floor(lo / st) * st; v <= Math.ceil(hi / st) * st + st / 2; v += st) t.push(+v.toFixed(6));
  return t;
}
let CW = 900, CH = 320;
const CM = {l: 50, r: 14, t: 10, b: 34};
const sizeTo = box => { CW = Math.max(320, Math.round(box.clientWidth)); CH = CW < 600 ? 240 : 320; };

// Line chart, one y axis; series = [{name, color, pts: [[ms, value], ...], width}]
function lineChart(box, series, {unit, yZero = false, gapMs = 2 * 36e5, digits = 1, step = 36e5}) {
  sizeTo(box);
  const vals = series.flatMap(s => s.pts.map(p => p[1])).filter(v => v !== null);
  const xs = series.flatMap(s => s.pts.map(p => p[0]));
  if (vals.length < 2) { box.innerHTML = '<div class="empty">No records for this period.</div>'; return; }
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const yt = nice(yZero ? 0 : Math.min(...vals), Math.max(...vals)), y0 = yt[0], y1 = yt[yt.length - 1];
  const X = v => CM.l + (v - x0) / ((x1 - x0) || 1) * (CW - CM.l - CM.r), Y = v => CH - CM.b - (v - y0) / ((y1 - y0) || 1) * (CH - CM.t - CM.b);
  const spanD = (x1 - x0) / 864e5;
  let g = '';
  for (const v of yt) g += `<line class="grid" x1="${CM.l}" x2="${CW - CM.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${CM.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  const nt = Math.max(3, Math.floor(CW / 110));   // about one label per 110 px
  const tick = spanD > 1.5 ? 864e5 * Math.max(1, Math.ceil(spanD / nt)) : 36e5 * Math.max(1, Math.ceil(24 / nt));
  for (let v = Math.ceil(x0 / tick) * tick; v <= x1; v += tick)
    g += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${CM.t}" y2="${CH - CM.b}"/><text class="ax" x="${X(v)}" y="${CH - CM.b + 16}" text-anchor="middle">${spanD > 1.5 ? fdate(v) : fhm(v)}</text>`;
  const paths = series.map(s => { let d = '', prev = null;
    for (const [t, v] of s.pts) { if (v === null) { prev = null; continue; }
      d += `${prev === null || t - prev > gapMs ? 'M' : 'L'}${X(t).toFixed(1)},${Y(v).toFixed(1)}`; prev = t; }
    return `<path class="sl" d="${d}" style="stroke:${s.color};stroke-width:${s.width || 2}"/>`; }).join('');
  box.innerHTML = `${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}
    <svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))}">
    ${g}<text class="ax" x="12" y="${(CH - CM.b + CM.t) / 2}" transform="rotate(-90 12 ${(CH - CM.b + CM.t) / 2})" text-anchor="middle">${esc(unit)}</text>
    ${paths}<line class="xh" y1="${CM.t}" y2="${CH - CM.b}" visibility="hidden"/><g class="dots"></g>
    <rect x="${CM.l}" y="${CM.t}" width="${CW - CM.l - CM.r}" height="${CH - CM.t - CM.b}" fill="transparent"/></svg>`;
  const svg = box.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots');
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), t = x0 + ((ev.clientX - r.left) / r.width * CW - CM.l) / (CW - CM.l - CM.r) * (x1 - x0);
    let rows = '', dd = '', ref = null;
    for (const s of series) {
      let best = null; for (const p of s.pts) if (p[1] !== null && (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
      if (!best || Math.abs(best[0] - t) > gapMs) continue; ref = ref ?? best[0];
      dd += `<circle cx="${X(best[0])}" cy="${Y(best[1])}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`;
      rows += `<div>${series.length > 1 ? `<span class="sq" style="background:${s.color}"></span>${esc(s.name)}: ` : ''}<b>${best[1].toFixed(digits)}</b> ${esc(unit)}${s.extra ? s.extra(best) : ''}</div>`;
    }
    if (ref === null) { hideTip(); return; }
    dots.innerHTML = dd; xh.setAttribute('x1', X(ref)); xh.setAttribute('x2', X(ref)); xh.setAttribute('visibility', 'visible');
    showTip(ev, `<b>${fdate(ref)} ${fhm(ref)}${step > 6e4 ? '–' + fhm(ref + step) : ''}</b>${rows}`);
  });
  svg.addEventListener('mouseleave', () => { hideTip(); dots.innerHTML = ''; xh.setAttribute('visibility', 'hidden'); });
}

// Bar chart, one bar per item: [{v, l1, l2, tip, light}]
function barChart(box, bars, unit) {
  sizeTo(box);
  if (!bars.length) { box.innerHTML = '<div class="empty">No records for this period.</div>'; return; }
  const yt = nice(0, Math.max(...bars.map(b => b.v)) || 1), y1 = yt[yt.length - 1], bw = (CW - CM.l - CM.r) / bars.length;
  const Y = v => CH - CM.b - v / y1 * (CH - CM.t - CM.b);
  let g = '', b = '';
  for (const v of yt) g += `<line class="grid" x1="${CM.l}" x2="${CW - CM.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${CM.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  bars.forEach((d, i) => {
    const x = CM.l + i * bw + 1, w = Math.max(2, bw - 2), y = Y(d.v), r = Math.max(0, Math.min(4, w / 2, CH - CM.b - y));
    b += `<path d="M${x},${CH - CM.b}V${y + r}q0,${-r} ${r},${-r}h${w - 2 * r}q${r},0 ${r},${r}V${CH - CM.b}Z" style="fill:var(--s1)${d.light ? ';opacity:.45' : ''}"/>`;
    if (i % Math.ceil(26 / bw) === 0) b += `<text class="ax" x="${x + w / 2}" y="${CH - CM.b + 14}" text-anchor="middle">${esc(d.l1)}</text><text class="ax" x="${x + w / 2}" y="${CH - CM.b + 27}" text-anchor="middle">${esc(d.l2)}</text>`;
    b += `<rect data-i="${i}" x="${CM.l + i * bw}" y="${CM.t}" width="${bw}" height="${CH - CM.t - CM.b}" fill="transparent"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${CW} ${CH + 6}" role="img" aria-label="${esc(unit)} per bar">${g}
    <text class="ax" x="12" y="${CH / 2}" transform="rotate(-90 12 ${CH / 2})" text-anchor="middle">${esc(unit)}</text>${b}</svg>`;
  const svg = box.querySelector('svg');
  svg.addEventListener('mousemove', ev => { const i = ev.target.dataset && ev.target.dataset.i; if (i === undefined) return hideTip(); showTip(ev, bars[i].tip); });
  svg.addEventListener('mouseleave', hideTip);
}

const sensorName = k => (PROF.labels?.[k] || k).replace(/\s*\(.*\)\s*$/, '');
function byDay(rows) {   // local date -> {kwh, minutes, peak, peakT, tmin, tmax}
  const d = {};
  for (const r of rows) {
    const k = r.t.slice(0, 10), o = d[k] ??= {kwh: 0, minutes: 0, peak: null, peakT: '', tmin: null, tmax: null};
    o.kwh += r.kwh; o.minutes += r.minutes;
    if (r.p_max !== undefined && (o.peak === null || r.p_max > o.peak)) { o.peak = r.p_max; o.peakT = r.t.slice(11, 13) + ':00'; }
    if (r.TH1_t_min !== undefined) { o.tmin = o.tmin === null ? r.TH1_t_min : Math.min(o.tmin, r.TH1_t_min); o.tmax = o.tmax === null ? r.TH1_t_max : Math.max(o.tmax, r.TH1_t_max); }
  }
  return d;
}

async function renderHistory() {
  const box = el('content');
  hideTip();
  if (WXVIEWS[view]) return WXVIEWS[view](box);
  if (view === 'versions') return versionsView(box);
  if (view === 'sites') return sitesView(box);
  if (view === 'prefs') return settingsView(box);
  if (view === 'register') return registerView(box);
  if (view === 'power') {

       statTile('Mean over the period', (j.hours.reduce((a, r) => a + (r.p ?? 0), 0) / (j.hours.filter(r => r.p !== undefined).length || 1)).toFixed(1), 'kW'),
       PROF.contracted_kva ? statTile('PLN contract', PROF.contracted_kva, 'kVA', 'apparent power, see Live now') : '']) +

    lineChart(el('ch'), [{name: 'Mean of the hour', color: C[0], pts: j.hours.map(r => [tp(r.t), r.p ?? null])},
      {name: 'Highest 15-second sample', color: C[1], width: 1.4, pts: j.hours.map(r => [tp(r.t), r.p_max ?? null])}], {unit: 'kW', yZero: true});
  } else if (view === 'day') {
    const j0 = await hourly(Math.max(span, 14)), today = j0.now.slice(0, 10);
    dayShown ??= today;
    const j = await getJ(`/api/v1/history/${site}/day/${dayShown}`);
    const ms = tp(dayShown + ' 00:00'), d = byDay(j0.hours)[dayShown];
    const pts = j.minutes.map(m => [tp(`${dayShown} ${m[0]}`), m[1], m[2], m[3]]);
    const pk = pts.reduce((a, p) => (!a || (p[3] ?? p[1]) > (a[3] ?? a[1]) ? p : a), null);
    const tools = `<div class="seg" role="group" aria-label="Day">${segBtn(`data-day="${isoDay(ms - 864e5)}"`, false, '◀ ' + fdate(ms - 864e5))}${segBtn('', true, fdate(ms))}${
      segBtn(`data-day="${isoDay(ms + 864e5)}"`, false, fdate(ms + 864e5) + ' ▶', dayShown >= today)}</div>`;
    box.innerHTML = head(`One day, minute by minute: ${fdate(ms)}`, 'Total power of every minute (mean of the 15-second samples). Hover for the minute\'s lowest and highest sample.', tools) +
      tiles([statTile(dayShown === today ? 'Energy so far' : 'Energy', d ? d.kwh.toFixed(0) : '–', 'kWh', d && d.minutes < 1430 ? `${(d.minutes / 14.4).toFixed(0)} % of the minutes recorded` : ''),
        statTile('Highest 15-second sample', pk ? (pk[3] ?? pk[1]).toFixed(1) : '–', 'kW', pk ? 'at ' + fhm(pk[0]) : ''),
        statTile('Lowest minute', pts.length ? Math.min(...pts.map(p => p[1])).toFixed(1) : '–', 'kW', 'the base load')]) +
      `<div class="mt-16">${chartCard('ch')}</div>`;
    lineChart(el('ch'), [{name: 'Total power', color: C[0], width: 1.4, pts: pts.map(p => [p[0], p[1]]),
      extra: b => { const p = pts.find(q => q[0] === b[0]); return p && p[2] !== null ? `<div class="dim">samples ${p[2].toFixed(1)} – ${p[3].toFixed(1)} kW</div>` : ''; }}],
      {unit: 'kW', yZero: true, gapMs: 3 * 6e4, step: 6e4});
  } else if (view === 'energy') {
    const j = await hourly(span), days = byDay(j.hours), keys = Object.keys(days).sort(), today = j.now.slice(0, 10);
    const full = keys.filter(k => k !== today && days[k].minutes >= 1430);
    const avg = full.length ? full.reduce((a, k) => a + days[k].kwh, 0) / full.length : null;
    const yest = isoDay(tp(today + ' 00:00') - 864e5);
    box.innerHTML = head('Energy per day', `kWh per hotel day (00:00 to 24:00), from the meter's counter. Lighter bars: today, or a day with missing minutes. Last ${span} days.`, spanPicker()) +
      tiles([statTile('Today so far', days[today] ? days[today].kwh.toFixed(0) : '–', 'kWh'),
        statTile('Yesterday', days[yest] ? days[yest].kwh.toFixed(0) : '–', 'kWh'),
        statTile('Mean of the full days', avg === null ? '–' : avg.toFixed(0), 'kWh', `${full.length} full day${full.length === 1 ? '' : 's'}`)]) +
      `<div class="mt-16">${chartCard('ch')}</div>`;
    barChart(el('ch'), keys.map(k => { const d = days[k], ms = tp(k + ' 00:00'), part = k === today || d.minutes < 1430;
      return {v: d.kwh, light: part, l1: DAYS[new Date(ms).getUTCDay()], l2: `${new Date(ms).getUTCDate()} ${MONS[new Date(ms).getUTCMonth()]}`,
        tip: `<b>${fdate(ms)}</b>${d.kwh.toFixed(1)} kWh${part ? ` (${k === today ? 'so far' : (d.minutes / 14.4).toFixed(0) + ' % of the minutes'})` : ''}` +
          (d.peak !== null ? `<br>peak ${d.peak.toFixed(1)} kW (${d.peakT} hour)` : '') +
          (d.tmin !== null ? `<br>${esc(sensorName('TH1_t'))} ${d.tmin.toFixed(1)}–${d.tmax.toFixed(1)} °C` : '')}; }), 'kWh');
  } else if (view === 'week') {
    const j = await hourly(15), now = tp(j.now), d0 = tp(j.now.slice(0, 10) + ' 00:00');
    const w0 = d0 - new Date(d0).getUTCDay() * 864e5, lw0 = w0 - 7 * 864e5;
    const el_ = Math.floor((now - w0) / 36e5) * 36e5;   // complete hours only, the same in both weeks
    if (!el_) { box.innerHTML = head('This week against last week', 'The week started less than an hour ago: come back after the first full hour.'); return; }
    const sum = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.kwh, 0);
    const mins = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.minutes, 0);
    const cur = sum(w0, w0 + el_), last = sum(lw0, lw0 + el_), pct = last ? (cur - last) / last * 100 : null;
    const mx = Math.max(cur, last) || 1, h = v => (v / mx * 240).toFixed(0);
    const perDay = [...Array(7).keys()].map(i => ({i, a: sum(lw0 + i * 864e5, lw0 + (i + 1) * 864e5), b: w0 + i * 864e5 <= now ? sum(w0 + i * 864e5, w0 + (i + 1) * 864e5) : null}));
    const covL = mins(lw0, lw0 + el_) / (el_ / 6e4), covT = mins(w0, w0 + el_) / (el_ / 6e4);
    const gaps = covL < 0.97 || covT < 0.97;
    const verdict = gaps ? `<div class="verdict bad">Not comparable yet: records cover ${(covL * 100).toFixed(0)} % of last week's hours and ${(covT * 100).toFixed(0)} % of this week's (logger offline or backlog not uploaded)</div>`
      : pct === null ? '' : Math.abs(pct) < 0.5 ? `<div class="verdict">About the same as last week (${pct >= 0 ? '+' : ''}${pct.toFixed(1)} %)</div>`
      : `<div class="verdict ${pct > 0 ? 'bad' : 'ok'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)} % ${pct > 0 ? 'more' : 'less'} than last week</div>`;
    box.innerHTML = head('This week against last week', `Weeks start on Sunday 00:00. The complete hours of this week so far, against the same ${(el_ / 36e5).toFixed(0)} hours of last week.`) +
      `<section class="card"><div class="cmp">
        <div><div class="cv">${last.toFixed(0)} kWh</div><div class="cbar prev" style="height:${h(last)}px"></div><div><b class="ink">Last week</b><br><small>${fdate(lw0)} – ${fdate(lw0 + el_)} ${fhm(lw0 + el_)}</small></div></div>
        <div><div class="cv">${cur.toFixed(0)} kWh</div><div class="cbar" style="height:${h(cur)}px"></div><div><b class="ink">This week so far</b><br><small>${fdate(w0)} – ${fdate(w0 + el_)} ${fhm(w0 + el_)}</small></div></div>
       </div>${verdict}</section>` + sec('Day by day') +
      tableCard(`<tr><th>Day</th><th>Last week</th><th>This week</th><th>Change</th></tr>${perDay.map(r => {
         const ch = r.b === null || !r.a ? '' : ((r.b - r.a) / r.a * 100);
         return `<tr><td>${DAYS[r.i]}</td><td>${r.a ? r.a.toFixed(0) + ' kWh' : '–'}</td><td>${r.b === null ? '–' : r.b.toFixed(0) + ' kWh' + (w0 + (r.i + 1) * 864e5 > now ? ' so far' : '')}</td>
           <td>${ch === '' || w0 + (r.i + 1) * 864e5 > now ? '' : `<span class="${ch > 0.5 ? 'bad' : ch < -0.5 ? 'ok' : ''}">${ch >= 0 ? '+' : ''}${ch.toFixed(1)} %</span>`}</td></tr>`; }).join('')}`);
  } else if (view === 'temperature' || view === 'humidity') {
    const j = await hourly(span), q = view === 'temperature' ? 't' : 'rh', unit = q === 't' ? '°C' : '% RH';
    const ids = [...new Set(j.hours.flatMap(r => Object.keys(r)).filter(k => /^TH\d+_/.test(k)).map(k => k.split('_')[0]))].sort();
    const series = ids.map((id, n) => ({name: sensorName(`${id}_${q}`), color: C[n] || QUIET,
      pts: j.hours.map(r => [tp(r.t), r[`${id}_${q}`] ?? null]),
      extra: b => { const r = j.hours.find(x => tp(x.t) === b[0]); return r && r[`${id}_${q}_min`] !== undefined ? ` <span class="dim">(${r[`${id}_${q}_min`].toFixed(q === 't' ? 1 : 0)}–${r[`${id}_${q}_max`].toFixed(q === 't' ? 1 : 0)})</span>` : ''; }}));
    const tl = [];
    for (const s of series) { const v = s.pts.map(p => p[1]).filter(x => x !== null);
      if (v.length) tl.push(statTile(`${s.name}: lowest – highest`, `${Math.min(...v).toFixed(q === 't' ? 1 : 0)} – ${Math.max(...v).toFixed(q === 't' ? 1 : 0)}`, unit, 'hourly means')); }
    box.innerHTML = head(view === 'temperature' ? 'Temperature' : 'Relative humidity',
      `Hourly means of the 5-minute readings; hover for the hour's lowest and highest. ${esc(Object.entries(PROF.sensors || {}).map(([k, v]) => `${k}: ${v}`).join(' · '))}. Last ${span} days.`, spanPicker()) +
      `<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${tl.join('')}</div><div class="mt-16">${chartCard('ch')}</div>`;
    lineChart(el('ch'), series, {unit, digits: q === 't' ? 1 : 0});
  }
}

const fwState = {};   // device -> last view from the server
const fwPost = (url, body, json) => fetch(url, {method: 'POST', cache: 'no-store', body,

function fwStatusHtml(v, off) {

    const what = `<b>${esc(o.version)}</b> (${esc(o.source || o.file)}) offered ${who}`;
    h += {installed: `<span class="ok">${what}: installed.</span>`,
          waiting: `<span class="warnc">${what}: waiting for the logger (within a minute if it is online, else at its next check).</span>`,
          rolled_back: `<span class="bad">${what}: the logger kept restarting on it and went back to ${esc(v.running)}. Not offered again.</span>`,
          not_newer: `${what}: not newer than the running version, nothing to do.`}[v.state] || what;
  }
  if (v.ota_on === '0') h += '<br><span class="bad">ota_on is 0 on this logger: it does not take updates (manage.py set-config ota_on=1).</span>';
  for (const e of v.events.slice(0, 6)) {

            : e.kind === 'boot' ? `restart: ${esc(e.reason)}`
            : `${esc(e.kind.replace('ota_', ''))} ${esc(e.version || '')} ${e.by ? 'by ' + esc(e.by) : ''}`;
    h += `<div class="ev">${localTime(e.ts, off)}: ${d}</div>`;
  }
  return h;
}

async function fwGithub(devs) {

async function fwAction(dev, kind, off) {

    if (!ask(`Withdraw the firmware offered to ${dev}?`)) return;
    call = () => fwPost(`/api/v1/admin/fw/${dev}/cancel`, '{}', true);
  } else {
    if (kind === 'github') {
      const id = el(`fwgh-${dev}`).value;
      if (!id) return;
      label = el(`fwgh-${dev}`).selectedOptions[0].textContent;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/github`, JSON.stringify({asset_id: +id, force}), true);
    } else if (kind === 'upload') {
      const f = el(`fwup-${dev}`).files[0];
      if (!f) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Choose a .bin file first.</div>'; return; }
      label = f.name;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/upload?force=${force ? 1 : 0}&name=${encodeURIComponent(f.name)}`, f, false);
    } else {
      const file = el(`fwfile-${dev}`).value;
      if (!file) return;
      label = file;

    }

  }

    const r = await call();
    const j = await r.json();
    m.innerHTML = r.ok ? `<div class="banner good" style="margin:8px 0 0">${kind === 'cancel' ? (j.cancelled ? 'Offer withdrawn.' : 'Nothing was offered to this logger.') : `Firmware ${esc(j.offer.version)} offered to ${esc(dev)}.`}</div>`
                       : `<div class="banner crit" style="margin:8px 0 0">${esc(j.error || 'HTTP ' + r.status)}</div>`;
    if (r.ok) el(`fwfile-${dev}`).dataset.done = '';
  } catch (e) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Server not reachable.</div>'; }
  fwRefresh(dev, off);
}
async function fwInit() {
  try { ME = await getJ('/api/v1/admin/me'); } catch (e) { return; }
  renderChrome();
  if (!ME.admin) return;
  const st = await getJ('/api/v1/status');
  const devs = Object.keys((st.sites || {})[site] || {});
  if (!devs.length) return;
  const off = (await getJ(`/api/v1/live/${site}`)).profile?.utc_offset_h ?? 8;
  let h = head('Firmware update', 'Send a firmware to one logger: from a GitHub release, a .bin file, or a file already on the server. '
    + 'The logger restarts once; a firmware that keeps restarting goes back to the previous one by itself. See docs/OTA.md.', '<span class="pill info">Admin only</span>');
  for (const dev of devs) {
    const d = esc(dev);
    h += `<section class="card mb-16"><div class="card-head"><h2 id="fwsum-${d}">${d}</h2></div>
      <div class="fwstat" id="fws-${d}">Loading...</div>
      <div class="fwrow"><b>From a GitHub release</b><select id="fwgh-${d}" aria-label="GitHub release"><option value="">${ME.github ? 'loading...' : 'FW_GITHUB_REPO not set on the server'}</option></select>
        <button class="btn primary" data-dev="${d}" data-act="github">Send to ${d}</button></div>
      <div class="fwrow"><b>From a file on this computer</b><input type="file" id="fwup-${d}" accept=".bin" aria-label="Firmware file">
        <button class="btn" data-dev="${d}" data-act="upload">Upload and send to ${d}</button></div>
      <div class="fwrow"><b>Already on the server</b><select id="fwfile-${d}" aria-label="File on the server"></select>
        <button class="btn" data-dev="${d}" data-act="offer">Send to ${d}</button></div>
      <div class="fwrow"><b>Options</b><label class="check" style="padding:0"><input type="checkbox" id="fwforce-${d}"> force: allow an older version or the other build variant</label>
        <button class="btn danger" data-dev="${d}" data-act="cancel">Withdraw the offer</button></div>
      <div id="fwmsg-${d}"></div></section>`;
  }
  el('fw').innerHTML = h;
  el('fw').addEventListener('click', ev => { const b = ev.target.closest('button[data-act]'); if (b) fwAction(b.dataset.dev, b.dataset.act, off); });
  await Promise.all(devs.map(dev => fwRefresh(dev, off)));
  if (ME.github) fwGithub(devs);
  setInterval(() => devs.forEach(dev => fwRefresh(dev, off)), 30000);
}

// ------------------------------------------------------------------ page
const LABEL = {versions: 'firmware versions', register: 'register table', sites: 'list of sites'};
async function show(id) {
  view = VIEWS.some(v => v.id === id) ? id : 'now';
  renderChrome();
  el('fw').hidden = true;
  scrollTo(0, 0);
  if (view === 'firmware') {   // the panel lives in #fw, out of reach of the 15 s refresh of #content
    el('content').innerHTML = '';
    await fwReady;
    if (view !== 'firmware') return;
    if (isAdmin()) el('fw').hidden = false;
    else el('content').innerHTML = head('Firmware update', '') + '<section class="card"><div class="empty">Firmware update is only for the logins listed in ADMIN_USERS on the server (docs/OTA.md).</div></section>';
    return;
  }
  if (view === 'now') { el('content').innerHTML = ''; return tick(); }
  el('content').innerHTML = '<section class="card"><div class="empty">Loading…</div></section>';
  try { await renderHistory(); }
  catch (e) { console.error(e); el('content').innerHTML = `<section class="card"><div class="empty">Could not read the ${WXVIEWS[view] ? 'weather' : LABEL[view] || 'history'} from the server.</div></section>`; }
}
document.addEventListener('click', ev => {
  const r = ev.target.closest('button[data-role]');
  if (r) return setRole(r.dataset.role);
  const b = ev.target.closest('button[data-span],button[data-day],button[data-vf]');
  if (!b || b.disabled) return;
  if (b.dataset.vf) vfAll = b.dataset.vf === 'all';
  if (b.dataset.span) span = +b.dataset.span;
  if (b.dataset.day) dayShown = b.dataset.day;
  show(view);
});
addEventListener('hashchange', () => show(location.hash.slice(1)));
const STATIC = ['now', 'firmware', 'prefs', 'register'];   // not redrawn by a resize or the 5-minute refresh
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!STATIC.includes(view)) renderHistory().catch(() => {}); }, 300); });

async function tick() {
  try { await loadSite(); }
  catch (e) { console.error(e); STATUS = '<span class="live-pill off"><i></i>Server not reachable</span>'; renderChrome(); }
}
if (MOCK) el('mocknote').hidden = false;
fwReady = fwInit().catch(() => {});
view = VIEWS.some(v => v.id === location.hash.slice(1)) ? location.hash.slice(1) : 'now';
renderChrome();
if (view === 'now') tick(); else tick().finally(() => fwReady).finally(() => show(view));
setInterval(tick, 15000);
setInterval(() => { if (!STATIC.includes(view) && !document.hidden) { delete HCACHE[span]; WXC = null; WXL = {}; show(view); } }, 300e3);
</script>
