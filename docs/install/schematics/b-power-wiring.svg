<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>(b) Power wiring: socket, 5 V adapter, USB-C</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#fff"/>
  <text x="20" y="32" font-size="20" font-weight="bold">(b) Power wiring</text>
  <text x="20" y="54" fill="#333">230 V AC side: licensed electrician, panel isolated. 5 V DC side: students.</text>

  <!-- Hazard zone -->
  <rect x="20" y="80" width="330" height="400" fill="#eeeeee" stroke="#000" stroke-width="2" stroke-dasharray="12 6"/>
  <text x="32" y="104" font-weight="bold">ZONE A: inside the MDP</text>
  <text x="32" y="122" font-size="12">230 V AC. ELECTRICIAN ONLY.</text>
  <!-- warning triangle -->
  <path d="M300,92 L330,142 L270,142 z" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="300" y="136" text-anchor="middle" font-size="26" font-weight="bold">!</text>

  <rect x="50" y="160" width="140" height="110" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="60" y="182" font-weight="bold">MCB</text>
  <text x="60" y="200" font-size="12">(dedicated circuit,</text>
  <text x="60" y="216" font-size="12">labelled "LOGGER";</text>
  <text x="60" y="232" font-size="12">rating chosen by</text>
  <text x="60" y="248" font-size="12">the electrician)</text>

  <line x1="190" y1="190" x2="240" y2="190" stroke="#000" stroke-width="2"/>
  <text x="196" y="184" font-size="12">L</text>
  <line x1="190" y1="220" x2="240" y2="220" stroke="#000" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="196" y="214" font-size="12">N</text>
  <line x1="190" y1="250" x2="240" y2="250" stroke="#000" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="196" y="244" font-size="12">PE</text>

  <rect x="240" y="165" width="90" height="110" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="250" y="187" font-weight="bold">Socket</text>
  <text x="250" y="205" font-size="12">230 V AC</text>
  <text x="250" y="221" font-size="12">(in or on</text>
  <text x="250" y="237" font-size="12">the panel)</text>
  <circle cx="270" cy="257" r="5" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="300" cy="257" r="5" fill="none" stroke="#000" stroke-width="2"/>

  <rect x="50" y="310" width="280" height="150" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="60" y="332" font-weight="bold">5 V / 2 A USB-C adapter</text>
  <text x="60" y="352" font-size="12">Plugs into the socket. Pick a branded</text>
  <text x="60" y="368" font-size="12">adapter with a fixed USB-C cable or</text>
  <text x="60" y="384" font-size="12">a USB-A port + USB-A to C cable.</text>
  <text x="60" y="404" font-size="12">Output: 5.0 V DC, at least 2 A.</text>
  <text x="60" y="420" font-size="12">Measured at no load: ______ V</text>
  <text x="60" y="440" font-size="12">No UPS for the trial.</text>
  <line x1="285" y1="262" x2="285" y2="310" stroke="#000" stroke-width="3"/>
  <text x="292" y="294" font-size="12">plug</text>

  <!-- Cable out through gland -->
  <line x1="330" y1="400" x2="470" y2="400" stroke="#000" stroke-width="4"/>
  <text x="358" y="378" font-size="12">USB-C cable</text>
  <text x="358" y="392" font-size="12">5 V DC</text>
  <text x="358" y="420" font-size="12">via gland G1</text>
  <text x="358" y="436" font-size="12">(see drawing e)</text>

  <!-- Logger box -->
  <rect x="470" y="80" width="610" height="400" fill="none" stroke="#000" stroke-width="2"/>
  <text x="482" y="104" font-weight="bold">ZONE B: logger box (IP54) beside the MDP. Extra-low voltage. Students.</text>

  <rect x="500" y="120" width="560" height="345" fill="#f7f7f7" stroke="#000" stroke-width="2"/>
  <text x="515" y="142" font-weight="bold">Bluino ESP32-S3 TMP/RH RS485 RTC AI board</text>
  <text x="515" y="166" font-size="12">Alternative input (to verify on the board): 5 V into a header "5V" pin, GND to "GND".</text>
  <text x="515" y="182" font-size="12" font-weight="bold">ONE SUPPLY AT A TIME: laptop on USB-C = DC jack and 5V pin empty.</text>
  <text x="515" y="198" font-size="12">Check with a multimeter: 5V pin 4.75 to 5.25 V, 3V3 pin 3.2 to 3.4 V.</text>

  <!-- DC jack -->
  <rect x="470" y="270" width="70" height="50" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="478" y="292" font-weight="bold" font-size="12">DC jack</text>
  <text x="478" y="310" font-size="12">7 to 15 V</text>
  <line x1="380" y1="295" x2="470" y2="295" stroke="#000" stroke-width="3"/>
  <line x1="408" y1="276" x2="444" y2="314" stroke="#000" stroke-width="5"/>
  <line x1="444" y1="276" x2="408" y2="314" stroke="#000" stroke-width="5"/>
  <rect x="550" y="262" width="270" height="66" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="560" y="282" font-weight="bold">DO NOT USE WITH 5 V</text>
  <text x="560" y="300" font-size="12">Input of an on-board regulator, 7 to 15 V.</text>
  <text x="560" y="316" font-size="12">5 V here is too low. Never feed two inputs.</text>

  <!-- USB-C -->
  <rect x="470" y="380" width="70" height="40" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="478" y="405" font-weight="bold" font-size="13">USB-C</text>
  <text x="550" y="440" font-weight="bold">USE THIS: USB-C, 5 V</text>
  <text x="550" y="456" font-size="12">(also the programming port)</text>

  <!-- rails -->
  <rect x="860" y="220" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="870" y="242" font-weight="bold">5V rail</text>
  <text x="870" y="260" font-size="12">header pins "5V"</text>
  <text x="870" y="276" font-size="12">(RS485 transceiver)</text>
  <rect x="860" y="350" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="870" y="372" font-weight="bold">3V3 rail</text>
  <text x="870" y="390" font-size="12">from on-board regulator:</text>
  <text x="870" y="406" font-size="12">ESP32, SD, RTC, TH1, TH2</text>
  <line x1="540" y1="400" x2="835" y2="400" stroke="#000" stroke-width="4"/>
  <line x1="835" y1="400" x2="835" y2="255" stroke="#000" stroke-width="4"/>
  <line x1="835" y1="255" x2="858" y2="255" stroke="#000" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="950" y1="290" x2="950" y2="348" stroke="#000" stroke-width="2" marker-end="url(#arr)"/>
  <text x="958" y="324" font-size="12">regulator</text>
  <text x="958" y="338" font-size="12">5 V to 3.3 V</text>

  <!-- Legend -->
  <rect x="20" y="500" width="1060" height="125" fill="#fff" stroke="#000"/>
  <text x="32" y="522" font-weight="bold">Legend</text>
  <line x1="40" y1="545" x2="90" y2="545" stroke="#000" stroke-width="2"/>
  <text x="98" y="549" font-size="12">L (line, 230 V AC)</text>
  <line x1="240" y1="545" x2="290" y2="545" stroke="#000" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="298" y="549" font-size="12">N (neutral)</text>
  <line x1="400" y1="545" x2="450" y2="545" stroke="#000" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="458" y="549" font-size="12">PE (protective earth)</text>
  <line x1="610" y1="545" x2="660" y2="545" stroke="#000" stroke-width="4"/>
  <text x="668" y="549" font-size="12">5 V DC (USB-C cable)</text>
  <rect x="40" y="565" width="50" height="20" fill="#eeeeee" stroke="#000" stroke-dasharray="12 6"/>
  <text x="98" y="580" font-size="12">Zone A: hazardous voltage, electrician only, panel isolated (lock-out, tag-out)</text>
  <g transform="translate(610,560)"><line x1="0" y1="0" x2="30" y2="26" stroke="#000" stroke-width="4"/><line x1="30" y1="0" x2="0" y2="26" stroke="#000" stroke-width="4"/></g>
  <text x="650" y="580" font-size="12">Crossed out = do not connect</text>
  <text x="40" y="608" font-size="12">Pin names from the board silkscreen (photos in docs/img/). Positions are drawn for clarity, not to scale. 5V pin input: to verify in Lab 1.</text>
</svg>
