<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>(d) AM2301 (DHT21) wiring with the 4.7 kohm pull-up</title>
  <rect x="0" y="0" width="1100" height="640" fill="#fff"/>
  <text x="20" y="32" font-size="20" font-weight="bold">(d) AM2301 (DHT21) sensor TH2: wiring with the pull-up</text>
  <text x="20" y="54" fill="#333">All at 3.3 V. ESP32-S3 pins are NOT 5 V tolerant: never connect the pull-up or VCC to 5 V with this 1 m cable.</text>

  <!-- Board -->
  <rect x="20" y="80" width="420" height="330" fill="#f7f7f7" stroke="#000" stroke-width="2"/>
  <text x="32" y="102" font-weight="bold">Bluino board header (logger box)</text>
  <rect x="40" y="130" width="140" height="200" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="50" y="152" font-weight="bold">ESP32-S3</text>
  <text x="50" y="186" font-size="12">3V3 pin</text>
  <text x="50" y="246" font-size="12">GPIO 1 (DATA)</text>
  <text x="50" y="262" font-size="11" font-style="italic">proposed, to verify</text>
  <text x="50" y="306" font-size="12">GND pin</text>

  <!-- rails -->
  <line x1="180" y1="182" x2="440" y2="182" stroke="#000" stroke-width="3"/>
  <line x1="180" y1="242" x2="440" y2="242" stroke="#000" stroke-width="2.5" stroke-dasharray="10 4"/>
  <line x1="180" y1="302" x2="440" y2="302" stroke="#000" stroke-width="2" stroke-dasharray="2 3"/>
  <!-- pull-up resistor between 3V3 and DATA -->
  <circle cx="300" cy="182" r="4" fill="#000"/>
  <circle cx="300" cy="242" r="4" fill="#000"/>
  <line x1="300" y1="182" x2="300" y2="196" stroke="#000" stroke-width="2"/>
  <rect x="292" y="196" width="16" height="32" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="300" y1="228" x2="300" y2="242" stroke="#000" stroke-width="2"/>
  <text x="314" y="208" font-size="12" font-weight="bold">R1 4.7 kohm</text>
  <text x="314" y="222" font-size="11">pull-up, board end</text>
    <!-- decoupling cap -->
  <circle cx="240" cy="182" r="4" fill="#000"/>
  <circle cx="240" cy="302" r="4" fill="#000"/>
  <line x1="240" y1="182" x2="240" y2="264" stroke="#000" stroke-width="1.5"/>
  <line x1="228" y1="264" x2="252" y2="264" stroke="#000" stroke-width="2"/>
  <line x1="228" y1="272" x2="252" y2="272" stroke="#000" stroke-width="2"/>
  <line x1="240" y1="272" x2="240" y2="302" stroke="#000" stroke-width="1.5"/>
  <text x="258" y="268" font-size="11">C1 100 nF</text>
  <text x="258" y="282" font-size="11">(optional)</text>

  <text x="40" y="356" font-size="12">R1 goes between 3V3 and DATA on a small terminal</text>
  <text x="40" y="372" font-size="12">strip or soldered on the header plug, sleeved.</text>
  <text x="40" y="392" font-size="12">Check: DATA at rest = 3.2 to 3.4 V (sensor idle).</text>

  <!-- Gland -->
  <rect x="440" y="160" width="30" height="160" fill="#ddd" stroke="#000" stroke-width="2"/>
  <text x="442" y="150" font-size="12">gland G3</text>

  <!-- cable -->
  <line x1="470" y1="182" x2="760" y2="182" stroke="#000" stroke-width="3"/>
  <line x1="470" y1="242" x2="760" y2="242" stroke="#000" stroke-width="2.5" stroke-dasharray="10 4"/>
  <line x1="470" y1="302" x2="760" y2="302" stroke="#000" stroke-width="2" stroke-dasharray="2 3"/>
  <rect x="520" y="160" width="190" height="160" rx="20" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="545" y="150" font-size="12">3-core shielded outdoor cable, 1 m</text>
  <text x="560" y="176" font-size="12">VCC: red</text>
  <text x="560" y="236" font-size="12">DATA: yellow</text>
  <text x="560" y="296" font-size="12">GND: black</text>
  <text x="540" y="340" font-size="11">colours usual for AM2301 leads:</text>
  <text x="540" y="354" font-size="11">check the label on the sensor</text>
  <polyline points="530,320 530,380 455,380 455,320" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="460" y="396" font-size="11">shield to GND at board end only</text>

  <!-- Sensor -->
  <rect x="760" y="120" width="200" height="230" rx="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="772" y="144" font-weight="bold">AM2301 (DHT21)</text>
  <text x="772" y="162" font-size="12">sensor TH2, outdoors</text>
  <circle cx="760" cy="182" r="5" fill="#000"/>
  <circle cx="760" cy="242" r="5" fill="#000"/>
  <circle cx="760" cy="302" r="5" fill="#000"/>
  <text x="772" y="186" font-size="12">VCC (3.3 to 5.5 V)</text>
  <text x="772" y="246" font-size="12">DATA (open drain)</text>
  <text x="772" y="306" font-size="12">GND</text>
  <text x="772" y="334" font-size="11" font-style="italic">no internal pull-up assumed</text>

  <!-- Timing sketch -->
  <rect x="20" y="430" width="680" height="190" fill="#fff" stroke="#000"/>
  <text x="32" y="452" font-weight="bold">One read on the DATA line (simplified)</text>
  <polyline points="40,480 80,480 80,560 150,560 150,480 180,480 180,560 220,560 220,480 260,480 260,560 300,560 300,480 320,480 320,560 360,560 360,480 420,480 420,560 460,560 460,480 520,480" fill="none" stroke="#000" stroke-width="2"/>
  <text x="84" y="578" font-size="11">host low</text>
  <text x="84" y="592" font-size="11">at least 1 ms</text>
  <text x="182" y="578" font-size="11">sensor</text>
  <text x="182" y="592" font-size="11">80+80 us</text>
  <text x="196" y="472" font-size="11">bit 0: about 26 us high</text>
  <text x="345" y="472" font-size="11">bit 1: about 70 us high</text>
  <text x="530" y="484" font-size="11">3.3 V (pull-up)</text>
  <text x="530" y="564" font-size="11">0 V (pulled low)</text>
  <text x="40" y="610" font-size="11">40 bits: 16 RH + 16 temperature + 8 checksum. Every low comes from a device pulling the line down; every high comes from R1.</text>

  <!-- Legend -->
  <rect x="720" y="430" width="360" height="190" fill="#fff" stroke="#000"/>
  <text x="732" y="452" font-weight="bold">Legend</text>
  <line x1="740" y1="474" x2="790" y2="474" stroke="#000" stroke-width="3"/>
  <text x="798" y="478" font-size="12">VCC 3.3 V</text>
  <line x1="740" y1="498" x2="790" y2="498" stroke="#000" stroke-width="2.5" stroke-dasharray="10 4"/>
  <text x="798" y="502" font-size="12">DATA</text>
  <line x1="740" y1="522" x2="790" y2="522" stroke="#000" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="798" y="526" font-size="12">GND</text>
  <line x1="740" y1="546" x2="790" y2="546" stroke="#000" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="798" y="550" font-size="12">cable shield</text>
  <rect x="757" y="560" width="16" height="22" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="798" y="576" font-size="12">resistor</text>
  <circle cx="765" cy="598" r="4" fill="#000"/>
  <text x="798" y="602" font-size="12">joined wires / sensor lead</text>
</svg>
