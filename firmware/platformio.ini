; Adab energy and environment logger: Bluino ESP32-S3 board.
; Build:   pio run                       (env "logger", USB-C is the native USB port)
; Flash:   pio run -t upload
; Monitor: pio device monitor
; If the board's USB-C goes through a USB-UART chip (CH340/CP210x) instead of the
; native USB port, use the env "logger-uart" (Serial on UART0).

[platformio]
default_envs = logger

[env]
; espressif32 6.9.0 = Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4)
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; The module may be the 4 MB version: build for 4 MB, two OTA app slots of 1.9 MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
  4-20ma/ModbusMaster@^2.0.1
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wall

[env:logger]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:logger-uart]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
