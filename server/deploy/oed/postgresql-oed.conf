# DRAFT, NOT TESTED.
# PostgreSQL 15 settings for OED on hermes-vps (docs/VPS-MEMORY.md): small and shared server.
# Used as the whole config file (postgres -c config_file=...), so the basics are here too.
# pg_hba.conf stays the one the official image creates in the data folder.

listen_addresses = '*'                 # inside the Docker network only; no port is published
max_connections = 20                   # OED's pg pool opens up to 10 per Node process
shared_buffers = 48MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 192MB
autovacuum_max_workers = 1
max_parallel_workers_per_gather = 0    # no parallel workers: less memory
huge_pages = off

# Same defaults as the stock file of the official image (initdb in a UTC container)
timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'
dynamic_shared_memory_type = posix
