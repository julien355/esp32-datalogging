# Tested on a test machine on 8 Nov 2026 (tutorial 3, Appendix C); not yet run on hermes-vps.
# Open Energy Dashboard on hermes-vps: our lean image, tuned PostgreSQL, memory limits.
# Not OED's default compose (that one runs npm ci and webpack at every start: 1 to 2 GB).
#
#   cd /opt/arkan-monitoring/server/deploy/oed
#   docker compose up -d
#
# Secrets are NOT in this folder: they are in /srv/arkan-monitoring/oed/oed.env (copy of oed.env.example).
# OED web is published on the loopback only (127.0.0.1:8810). Caddy is the only way in.
# Tutorial: docs/tutorials/3-OPEN-ENERGY-DASHBOARD.md
name: arkan-oed

services:
  database:
    image: postgres:15.3                 # the version OED v1.0.0 pins in containers/database/Dockerfile
    container_name: arkan-oed-db
    restart: unless-stopped
    env_file: /srv/arkan-monitoring/oed/oed.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql-oed.conf"]
    volumes:
      - /srv/arkan-monitoring/oed-postgres:/var/lib/postgresql/data
      - ./postgresql-oed.conf:/etc/postgresql/postgresql-oed.conf:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro    # runs once, on an empty data folder only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: arkan-oed:v1.0.0              # built on the laptop from ./Dockerfile, loaded with docker load
    container_name: arkan-oed-web
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: /srv/arkan-monitoring/oed/oed.env
    environment:
      OED_PRODUCTION: "yes"
      OED_SERVER_PORT: "3000"
      OED_DB_USER: oed
      OED_DB_DATABASE: oed
      OED_DB_HOST: database
      OED_DB_PORT: "5432"
      OED_LOG_FILE: /usr/src/app/log/log.txt
      OED_MAIL_METHOD: none
      TZ: Etc/UTC                        # OED's default; readings keep the WITA times we send
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "127.0.0.1:8810:3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/version', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 320m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
