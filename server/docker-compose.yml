# Monitoring ingest service on the VPS.
#   cd /opt/arkan-monitoring/server && docker compose up -d --build
# Data folder on the host: /srv/arkan-monitoring/data (created by deploy/setup-vps.sh), mounted at /data.
# Published on the loopback only: Caddy on the host is the only way in from the internet.
services:
  ingest:
    build:
      context: ..                      # repository root: the image also takes docs/alarms/alarms.csv
      dockerfile: server/Dockerfile
    image: arkan-monitoring-ingest:local
    container_name: arkan-monitoring-ingest
    restart: unless-stopped            # comes back after a crash or a VPS reboot
    ports:
      - "127.0.0.1:${INGEST_PORT:-8800}:8800"
    volumes:
      - ${DATA_DIR_HOST:-/srv/arkan-monitoring/data}:/data
    environment:
      DATA_DIR: /data
      MAX_BODY: "262144"
      # Firmware update from the live page (docs/OTA.md): set in server/.env, never in this file.
      ADMIN_USERS: ${ADMIN_USERS:-}
      # Logins limited to some sites (docs/LIVE.md "Logins"): set in server/.env.
      USER_SITES: ${USER_SITES:-}
      FW_GITHUB_REPO: ${FW_GITHUB_REPO:-}
      FW_GITHUB_TOKEN: ${FW_GITHUB_TOKEN:-}
      # Weather forecast and log for the sites with lat/lon (docs/WEATHER.md): needs outbound HTTPS to api.open-meteo.com.
      WEATHER: ${WEATHER:-on}
      WEATHER_EVERY_MIN: ${WEATHER_EVERY_MIN:-60}
      # 15 s live snapshots saved in the data folder for a second dashboard (docs/DATA-ACCESS.md), 0 = memory only.
      LIVE_KEEP_DAYS: ${LIVE_KEEP_DAYS:-7}
    user: "1000:1000"
    read_only: true                    # the only writable place is /data
    tmpfs:
      - /tmp
    mem_limit: 96m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Fixed network name: a second dashboard's container joins it and reads http://arkan-monitoring-ingest:8800
# (docs/DATA-ACCESS.md). Caddy on the host keeps using 127.0.0.1:8800.
networks:
  default:
    name: arkan-monitoring
