<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Live</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1f2933}
  header{background:#0f2747;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
  header a{color:#cfe0ff;margin-left:12px}
  main{padding:12px;max-width:1100px;margin:auto}
  .status{margin:8px 0;font-weight:600}
  .ok{color:#127a3a}.bad{color:#b42318}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .tile{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .tile .k{font-size:.8em;color:#52606d}.tile .v{font-size:1.6em;font-weight:700}
  svg{width:100%;height:34px}
  table{border-collapse:collapse;background:#fff;width:100%}
  td,th{padding:6px 10px;border-bottom:1px solid #e4e7eb;text-align:left}
  h2{font-size:1.05em;margin:18px 0 6px}
  .al{padding:6px 10px;border-radius:6px;margin:4px 0;background:#fff}
  .critical{border-left:6px solid #b42318}.warning{border-left:6px solid #d97706}.info{border-left:6px solid #2563eb}
  .log td{font-size:.85em}
  details.fw{background:#fff;border-radius:8px;padding:8px 12px;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  details.fw summary{cursor:pointer;font-weight:600}
  .fw .row{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .fw .row b{min-width:210px}
  .fw select{max-width:340px}
  .fw .msg{margin:6px 0;font-weight:600}
  .fw .ev{font-size:.85em;color:#52606d;margin:2px 0}
  .warn{color:#b45309}
</style>
</head>
<body>
<header><strong id="title">Live</strong><span><a id="regLink" href="/live/" hidden>Meter registers</a> <a href="/live/">All sites</a></span></header>
<main>
  <div id="status" class="status">Loading...</div>
  <div id="content"></div>
  <div id="fw"></div>
</main>
<script>
const m = location.pathname.match(/^\/live\/([a-z0-9-]+)\/?$/);
const site = m ? m[1] : null;
const el = id => document.getElementById(id);
if (site) { el('regLink').href = `/live/${site}/register`; el('regLink').hidden = false; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function spark(points) {
  const v = points.filter(x => x !== null && x !== undefined && !isNaN(x));
  if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const d = v.map((y, i) => `${(i / (v.length - 1) * 100).toFixed(1)},${(30 - (y - lo) / span * 28).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 32" preserveAspectRatio="none"><polyline fill="none" stroke="#2563eb" stroke-width="1.5" points="${d}"/></svg>`;
}

function localTime(iso, offH) {
  if (!iso) return '-';
  const t = new Date(Date.parse(iso) + (offH || 0) * 3600e3);
  return t.toISOString().slice(0, 19).replace('T', ' ');
}

async function loadSite() {
  const r = await fetch(`/api/v1/live/${site}`, {cache: 'no-store'});
  const j = await r.json();
  const prof = j.profile || {}, labels = prof.labels || {}, off = prof.utc_offset_h ?? 8;
  const wanted = (prof.live && prof.live.values) || null;
  el('title').textContent = `Live: ${prof.name || site}`;
  let html = '', worst = 0;
  const devs = Object.keys(j.devices);
  if (!devs.length) html = '<p class="bad">No live data for this site (logger offline or not installed yet).</p>';
  for (const dev of devs) {
    const d = j.devices[dev], vals = d.last.values || {};
    worst = Math.max(worst, d.age_s);
    const keys = (wanted || Object.keys(vals)).filter(k => k in vals);
    html += `<h2>${esc(dev)}: ${localTime(d.last.ts, off)} (UTC+${off}), RSSI ${esc(d.last.sys?.rssi ?? '-')} dBm, backlog ${esc(d.last.sys?.backlog_min ?? '-')} min, fw ${esc(d.last.sys?.fw ?? '-')}</h2><div class="grid">`;
    for (const k of keys) {
      const hist = d.history.map(h => parseFloat(h.values[k]));
      html += `<div class="tile"><div class="k">${esc(labels[k] || k)}</div><div class="v">${esc(vals[k])}</div>${spark(hist)}</div>`;
    }
    html += '</div>';
  }
  // Open alarms first, the alarm log last
  const al = j.alarms || [];
  let top = al.length ? '<h2>Open alarms</h2>' : '<h2>No open alarm</h2>';
  for (const a of al) top += `<div class="al ${esc(a.severity)}"><b>${esc(a.id)} ${esc(a.name)}</b> (${esc(a.severity)}) since ${localTime(a.since, off)}, worst ${esc(a.worst ?? '-')} ${esc(a.unit)}</div>`;
  let log = '';
  try {
    const lj = await (await fetch(`/api/v1/alarms/${site}`, {cache: 'no-store'})).json();
    const rows = lj.log.slice(-20).reverse();
    log = '<h2>Alarm log (last 20, local time)</h2><table class="log"><tr><th>Time</th><th>Alarm</th><th>State</th><th>Value</th><th>Message</th></tr>';
    for (const r of rows) {
      const c = r.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x => x.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));
      log += `<tr><td>${esc(c[1])}</td><td>${esc(c[3])} ${esc(c[4])}</td><td>${esc(c[6])}</td><td>${esc(c[7])} ${esc(c[9])}</td><td>${esc(c[11])}</td></tr>`;
    }
    log += '</table>';
  } catch (e) {}
  el('content').innerHTML = top + html + log;
  if (!devs.length) { el('status').innerHTML = '<span class="bad">No live data</span>'; return; }
  el('status').innerHTML = worst < 60 ? `<span class="ok">Live, updated ${worst} s ago</span>`
                                      : `<span class="bad">No data for ${Math.round(worst / 60)} min</span>`;
}

async function loadAll() {
  const j = await (await fetch('/api/v1/status', {cache: 'no-store'})).json();
  let html = '<table><tr><th>Site</th><th>Logger</th><th>Last record (UTC)</th><th>Live</th><th>Firmware</th></tr>';
  for (const [s, devs] of Object.entries(j.sites)) {
    for (const [dev, d] of Object.entries(devs)) {
      const live = d.live_age_s === null ? '<span class="bad">none</span>'
                 : d.live_age_s < 60 ? `<span class="ok">${d.live_age_s} s ago</span>` : `<span class="bad">${Math.round(d.live_age_s / 60)} min ago</span>`;
      html += `<tr><td><a href="/live/${esc(s)}/">${esc(s)}</a></td><td>${esc(dev)}</td><td>${esc(d.last_record || '-')}</td><td>${live}</td><td>${esc(d.fw || '-')}</td></tr>`;
    }
  }
  el('content').innerHTML = html + '</table>';
  el('status').textContent = `All sites, ${j.time}`;
}

// ---------------------------------------------------------------- firmware update (ADMIN_USERS only)
const fwState = {};   // device -> last view from the server
const fwPost = (url, body, json) => fetch(url, {method: 'POST', cache: 'no-store', body,
  headers: {'X-Requested-With': 'arkan', 'Content-Type': json ? 'application/json' : 'application/octet-stream'}});

function fwStatusHtml(v, off) {
  let h = `Running <b>${esc(v.running || 'unknown')}</b>${v.env ? ` (${esc(v.env)} build)` : ''}. `;
  const o = v.offer;
  if (!o) h += 'No firmware offered.';
  else {
    const who = `${o.scope === 'default' ? 'to every logger' : 'to this logger'}${o.by ? ' by ' + esc(o.by) : ''}, ${localTime(o.published, off)}`;
    const what = `<b>${esc(o.version)}</b> (${esc(o.source || o.file)}) offered ${who}`;
    h += {installed: `<span class="ok">${what}: installed.</span>`,
          waiting: `<span class="warn">${what}: waiting for the logger (within a minute if it is online, else at its next check).</span>`,
          rolled_back: `<span class="bad">${what}: the logger kept restarting on it and went back to ${esc(v.running)}. Not offered again.</span>`,
          not_newer: `${what}: not newer than the running version, nothing to do.`}[v.state] || what;
  }
  if (v.ota_on === '0') h += '<br><span class="bad">ota_on is 0 on this logger: it does not take updates (manage.py set-config ota_on=1).</span>';
  for (const e of v.events.slice(0, 6)) {
    const d = e.kind === 'firmware' ? (e.from ? `firmware ${esc(e.from)} -> ${esc(e.to)}` : `first seen with firmware ${esc(e.to)}`)
            : e.kind === 'boot' ? `restart: ${esc(e.reason)}`
            : `${esc(e.kind.replace('ota_', ''))} ${esc(e.version || '')} ${e.by ? 'by ' + esc(e.by) : ''}`;
    h += `<div class="ev">${localTime(e.ts, off)}: ${d}</div>`;
  }
  return h;
}

async function fwRefresh(dev, off) {
  const r = await fetch(`/api/v1/admin/fw/${encodeURIComponent(dev)}`, {cache: 'no-store'});
  if (!r.ok) return;
  const v = await r.json();
  fwState[dev] = v;
  el(`fws-${dev}`).innerHTML = fwStatusHtml(v, off);
  el(`fwsum-${dev}`).textContent = `Firmware update: ${dev} (running ${v.running || 'unknown'}${v.state === 'waiting' ? ', update waiting' : ''})`;
  const sel = el(`fwfile-${dev}`);
  if (!sel.dataset.done) {
    sel.innerHTML = v.files.length ? v.files.map(f => `<option value="${esc(f.file)}">${esc(f.file)} (${Math.round(f.size / 1024)} kB)</option>`).join('')
                                   : '<option value="">none yet</option>';
    sel.dataset.done = 1;
  }
}

async function fwGithub(devs) {
  let rel = [], err = '';
  try {
    const r = await fetch('/api/v1/admin/github/releases', {cache: 'no-store'});
    const j = await r.json();
    if (r.ok) rel = j.releases; else err = j.error;
  } catch (e) { err = 'server not reachable'; }
  for (const dev of devs) {
    const sel = el(`fwgh-${dev}`), env = fwState[dev]?.env || 'usb';
    if (err || !rel.length) { sel.innerHTML = `<option value="">${esc(err || 'no release with a logger-*.bin file')}</option>`; continue; }
    let opts = '', picked = false;
    for (const x of rel) for (const a of x.assets) {
      const aEnv = (a.name.match(/^logger-([a-z0-9]+)-\d/) || [, 'usb'])[1];
      const pick = !picked && aEnv === env;
      picked = picked || pick;
      opts += `<option value="${a.id}"${pick ? ' selected' : ''}>${esc(x.tag)}: ${esc(a.name)}${x.prerelease ? ' (pre-release)' : ''}</option>`;
    }
    sel.innerHTML = opts;
  }
}

async function fwAction(dev, kind, off) {
  const msg = el(`fwmsg-${dev}`), force = el(`fwforce-${dev}`).checked;
  let label, call;
  if (kind === 'cancel') {
    if (!confirm(`Withdraw the firmware offered to ${dev}?`)) return;
    call = () => fwPost(`/api/v1/admin/fw/${dev}/cancel`, '{}', true);
  } else {
    if (kind === 'github') {
      const id = el(`fwgh-${dev}`).value;
      if (!id) return;
      label = el(`fwgh-${dev}`).selectedOptions[0].textContent;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/github`, JSON.stringify({asset_id: +id, force}), true);
    } else if (kind === 'upload') {
      const f = el(`fwup-${dev}`).files[0];
      if (!f) { msg.innerHTML = '<span class="bad">Choose a .bin file first.</span>'; return; }
      label = f.name;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/upload?force=${force ? 1 : 0}&name=${encodeURIComponent(f.name)}`, f, false);
    } else {
      const file = el(`fwfile-${dev}`).value;
      if (!file) return;
      label = file;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/offer`, JSON.stringify({file, force}), true);
    }
    if (!confirm(`Send ${label} to ${dev}?\n\nThe logger installs it and restarts (about 30 s without readings, nothing is lost: the SD card keeps recording). If the new firmware keeps restarting, it goes back to the current one by itself.`)) return;
  }
  msg.textContent = 'Working...';
  try {
    const r = await call();
    const j = await r.json();
    msg.innerHTML = r.ok ? `<span class="ok">${kind === 'cancel' ? (j.cancelled ? 'Offer withdrawn.' : 'Nothing was offered to this logger.') : `Firmware ${esc(j.offer.version)} offered to ${esc(dev)}.`}</span>`
                         : `<span class="bad">${esc(j.error || 'HTTP ' + r.status)}</span>`;
    if (r.ok) el(`fwfile-${dev}`).dataset.done = '';
  } catch (e) { msg.innerHTML = '<span class="bad">Server not reachable.</span>'; }
  fwRefresh(dev, off);
}

async function fwInit() {
  let me;
  try { me = await (await fetch('/api/v1/admin/me', {cache: 'no-store'})).json(); } catch (e) { return; }
  if (!me.admin) return;
  const st = await (await fetch('/api/v1/status', {cache: 'no-store'})).json();
  const devs = Object.keys((st.sites || {})[site] || {});
  if (!devs.length) return;
  const off = (await (await fetch(`/api/v1/live/${site}`, {cache: 'no-store'})).json()).profile?.utc_offset_h ?? 8;
  let h = '<h2>Firmware update (remote)</h2>';
  for (const dev of devs) {
    const d = esc(dev);
    h += `<details class="fw"><summary id="fwsum-${d}">Firmware update: ${d}</summary>
      <div id="fws-${d}">Loading...</div>
      <div class="row"><b>From a GitHub release</b><select id="fwgh-${d}"><option value="">${me.github ? 'loading...' : 'FW_GITHUB_REPO not set on the server'}</option></select>
        <button data-dev="${d}" data-act="github">Send to ${d}</button></div>
      <div class="row"><b>From a file on this computer</b><input type="file" id="fwup-${d}" accept=".bin">
        <button data-dev="${d}" data-act="upload">Upload and send to ${d}</button></div>
      <div class="row"><b>Already on the server</b><select id="fwfile-${d}"></select>
        <button data-dev="${d}" data-act="offer">Send to ${d}</button></div>
      <div class="row"><label><input type="checkbox" id="fwforce-${d}"> force: allow an older version or the other build variant</label>
        <button data-dev="${d}" data-act="cancel">Withdraw the offer</button></div>
      <div class="msg" id="fwmsg-${d}"></div></details>`;
  }
  el('fw').innerHTML = h;
  el('fw').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-act]');
    if (b) fwAction(b.dataset.dev, b.dataset.act, off);
  });
  await Promise.all(devs.map(dev => fwRefresh(dev, off)));
  if (me.github) fwGithub(devs);
  setInterval(() => devs.forEach(dev => fwRefresh(dev, off)), 30000);
}

async function tick() {
  try { await (site ? loadSite() : loadAll()); }
  catch (e) { el('status').innerHTML = '<span class="bad">Server not reachable</span>'; }
}
tick();
setInterval(tick, 15000);
if (site) fwInit();
</script>
</body>
</html>
