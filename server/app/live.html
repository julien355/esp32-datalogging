<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Live</title>
<link rel="stylesheet" href="/live/_ui/arkan-ui.css">
<style>
/* Arkan design (the CMMS's UI kit, server/app/arkan-ui/, served at /live/_ui/). Below: the monitoring additions; the kit itself is not changed. */
/* Series colours: L1, L2, L3 / first, second, third series, never cycled; --s4 is the quiet reference line. */
:root{--s1:#0D62BC;--s2:#D9641E;--s3:#12957F;--s4:#9AA5B1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="contrast"]){--s1:#5AA2EC;--s2:#F5924E;--s3:#3CC9AE;--s4:#6E7C91}}
:root[data-theme="dark"]{--s1:#5AA2EC;--s2:#F5924E;--s3:#3CC9AE;--s4:#6E7C91}
:root[data-theme="contrast"]{--s1:#FFE14D;--s2:#7FD4FF;--s3:#FF9CF0;--s4:#E6E6E6}

/* View as above the navigation, as in the CMMS (cmms-demo/src/features.css) */
.side-role{display:flex;flex-direction:column;gap:8px}
.side-role .full{display:none}
@container app (min-width:1100px){.side-role .rail{display:none}.side-role .full{display:flex;flex-direction:column;gap:8px}}
.side a.prop{text-decoration:none;color:inherit}
.side a.prop:hover{background:var(--surface-2)}
.snav .nl{display:none}
@container app (min-width:1100px){.snav .nl{display:inline}.snav .ns{display:none}}
.side-foot .full{font-size:12.5px;color:var(--muted);padding:0 4px}
/* The page list scrolls on its own; Settings and the live state stay at the bottom of the side bar */
.side{overflow:hidden}
#snav{flex:1 1 auto;min-height:0;overflow-y:auto}
.side-foot{margin-top:0;border-top:1px solid var(--line);padding-top:8px}
@container app (min-width:1100px){.snav a{padding-block:7px}.snav .sep{margin-block:6px}}
@container app (max-width:699px){.wxline{border-radius:var(--r-lg);padding:8px 14px}}
.topbar .icon-btn{margin:0}

.sec{margin:24px 2px 10px}
.sec span{text-transform:none;letter-spacing:0;font-weight:500}
.tiles{margin-bottom:0}
.tiles.qt{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.headtools{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.clock{font-size:13px;color:var(--muted);white-space:nowrap}
.live-pill.off{color:var(--crit-ink);background:var(--crit-bg)}
.live-pill.off i{background:var(--crit);animation:none}
.live-pill.idle{color:var(--muted);background:var(--surface-2)}
.live-pill.idle i{background:var(--muted);animation:none}
.spk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 6px;margin-top:6px}
.spk.tall{margin-top:12px}
/* Cards of one row: the label keeps two lines (kit), so the figures line up; the chart sits at the bottom, so the charts line up */
.kpi .spk,.two>.card>.spk{margin-top:auto;padding-top:8px}
.two>.card{display:flex;flex-direction:column}
.two>.card>.phase{margin-bottom:6px}
.spy{display:flex;flex-direction:column;justify-content:space-between;text-align:right}
.spx{grid-column:2;display:flex;justify-content:space-between}
.spy,.spx{font-size:10.5px;line-height:1;color:var(--muted);white-space:nowrap}
.spark{display:block;width:100%;height:44px;overflow:visible;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.spark.tall{height:72px}
.spark .sg{stroke:var(--grid)}
.chart .axl{stroke:var(--line-2);stroke-width:1}
.chart .lim{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:5 4}
.chart .liml{fill:var(--ink-2);stroke:var(--surface);stroke-width:3;paint-order:stroke}
.legend i.limk{height:0;border-top:2px dashed var(--warn);background:none;border-radius:0}
.spark path{fill:none;stroke-width:2;stroke-linejoin:round}
.spark .xh{stroke:var(--control);stroke-dasharray:2 2}
.phase{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:2px 12px;align-items:baseline}
.phase .h{font-size:12px;color:var(--muted);text-align:right}
.phase .n{font-size:22px;font-weight:800;color:var(--ink);text-align:right;line-height:1.25;letter-spacing:-.01em}
.phase .l{font-size:12.5px;color:var(--muted)}
.swl{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.capbar span.warn{background:var(--warn)}
.capbar span.crit{background:var(--crit)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.facts>div{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.facts small{display:block;color:var(--muted);font-size:12px}
.facts b{display:block;font-size:15px;color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.facts .note{display:block;font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto}
.chart svg path.sl{fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .xh{stroke-dasharray:3 3}
.legend{margin:0 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.ftip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow-pop);z-index:90;display:none}
.ftip>b:first-child{display:block;margin-bottom:2px}
.ftip .sq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.ftip .dim{opacity:.75}
.cmp{display:flex;gap:48px;justify-content:center;align-items:flex-end;min-height:300px;text-align:center}
.cmp .cbar{width:130px;max-width:30vw;border-radius:6px 6px 0 0;margin:4px auto 6px;background:var(--s1)}
.cmp .cbar.prev{opacity:.45}
.cmp .cv{font-size:19px;font-weight:800;color:var(--ink)}
.cmp small{color:var(--muted);font-size:12px}
.verdict{text-align:center;font-weight:700;margin:14px 0 4px;color:var(--ink-2)}
.ok{color:var(--good-ink)}.bad{color:var(--crit-ink)}.warnc{color:var(--warn-ink)}
.dimtxt{color:var(--muted);font-size:12px;font-weight:500}
.wxline{display:inline-flex;flex-wrap:wrap;gap:4px 12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:3px 14px;font-size:13.5px;color:var(--ink-2);text-decoration:none}
.wxline b{color:var(--ink)}
.wxline:hover{background:var(--surface-2)}
.wxi{margin-right:4px}
table.data tr.past td{color:var(--muted)}
table.data tr.cur td{background:var(--brand-tint);font-weight:700}
table.data{margin-top:0}
table.data a{font-weight:700;text-decoration:none}
.banner.good{background:var(--good-bg);color:var(--good-ink)}
.banner.crit{background:var(--crit-bg);color:var(--crit-ink)}
.banner{white-space:pre-wrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar select,.bar input[type="text"]{width:auto}
table.regs input,table.regs select{padding:4px 6px;font-size:13px;min-width:64px}
table.regs input[type="checkbox"]{width:18px;height:18px;min-width:0;accent-color:var(--action)}
table.regs tr.changed td{background:var(--warn-bg)}
table.regs tr.new td{background:var(--good-bg)}
table.regs td.n{color:var(--muted);width:2em}
textarea.csv{min-height:220px;font-family:var(--mono);font-size:12.5px}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
code{background:var(--surface-2);padding:0 4px;border-radius:4px;font-family:var(--mono);font-size:.86em}
pre{background:var(--surface-2);padding:10px 12px;border-radius:var(--r-md);font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.help{font-size:13px;color:var(--muted)}
.help p{margin-top:8px}
.fwrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 12px;align-items:end;padding-block:10px;border-top:1px solid var(--line)}
@container app (min-width:700px){.fwrow{grid-template-columns:220px minmax(0,1fr) auto;align-items:center}}
.fwrow b{color:var(--ink);font-size:14px}
.fwstat{font-size:14px;margin-bottom:10px}
.fwstat .ev{font-size:12.5px;color:var(--muted);margin-top:2px}
@container app (max-width:560px){.hide-s{display:none}}
/* Period of the history pages: 7, 14, 31 days or two dates (calendars), and the CSV download */
.period{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.period .acts{display:inline-flex;gap:8px;align-items:center}
a.btn{text-decoration:none}
.dates{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
input[type="date"]{width:auto;min-width:0;padding:5px 8px;border-radius:var(--r-md);border:1px solid var(--control);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;line-height:1.4}
.dates.on input[type="date"]{border-color:var(--action);box-shadow:0 0 0 1px var(--action)}
.btn[aria-disabled="true"]{opacity:.4;cursor:default}
.mocknote{background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px;font-weight:600;text-align:center;padding:4px 12px}
</style>
<script src="/live/_ui/arkan-ui.js"></script>
</head>

async function loadSite() {

      <div><small>Firmware</small><b>${esc(sys.fw ?? '–')}</b></div>

    if (!rows.length) html += '<section class="card"><div class="empty">Nothing logged yet.</div></section>';
    else html += tableCard('<tr><th>Time</th><th>Alarm</th><th>State</th><th>Value</th><th class="hide-s">Message</th></tr>' + rows.map(r => {
        const c = r.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x => x.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));

  const clock = `<span class="clock">Hotel time ${localTime(new Date(nowMs()).toISOString(), off, false).slice(0, 5)}</span>`;
  STATUS = !devs.length ? '<span class="live-pill off"><i></i>No live data</span>'

// ------------------------------------------------------------------ history views
// /api/v1/history/<site> (one row per local hour, from the day files) and /api/v1/history/<site>/day/<date> (1-minute power).
const HCACHE = {};

let CW = 900, CH = 320;

function lineChart(box, series, {unit, yZero = false, gapMs = 2 * 36e5, digits = 1, step = 36e5, refs = [], bands = [], title = null, axis = null, xName = null}) {
  sizeTo(box);

  const xs = series.flatMap(s => s.pts.map(p => p[0]));

    return `<text class="ax liml" x="${CW - CM.r - 4}" y="${ly.toFixed(1)}" text-anchor="end">${esc(r.label)}</text>`; }).join('');
  const keys = [...bands.map(b => `<span><i style="background:${b.color};height:10px"></i>${esc(b.name)}</span>`),

    <svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))}">
    ${g}<text class="ax" x="12" y="${(CH - CM.b + CM.t) / 2}" transform="rotate(-90 12 ${(CH - CM.b + CM.t) / 2})" text-anchor="middle">${esc(axis ?? unit)}</text>
    ${axes(xName || (spanD > 1.5 ? 'Day (hotel time)' : 'Hour (hotel time)'))}${shade}${lines}${paths}${labels}<line class="xh" y1="${CM.t}" y2="${CH - CM.b}" visibility="hidden"/><g class="dots"></g>
    <rect x="${CM.l}" y="${CM.t}" width="${CW - CM.l - CM.r}" height="${CH - CM.t - CM.b}" fill="transparent"/></svg>`;
  const svg = box.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots');
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), t = x0 + ((ev.clientX - r.left) / r.width * CW - CM.l) / (CW - CM.l - CM.r) * (x1 - x0);
    let rows = '', dd = '', ref = null;
    for (const s of series) {
      let best = null; for (const p of s.pts) if (p[1] !== null && (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
      if (!best || Math.abs(best[0] - t) > gapMs) continue; ref = ref ?? best[0];
      dd += `<circle cx="${X(best[0])}" cy="${Y(best[1])}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`;
      rows += `<div>${series.length > 1 ? `<span class="sq" style="background:${s.color}"></span>${esc(s.name)}: ` : ''}<b>${best[1].toFixed(digits)}</b> ${esc(s.unit || unit)}${s.extra ? s.extra(best) : ''}</div>`;
    }
    if (ref === null) { hideTip(); return; }
    for (const b of bands) { const p = (b.at ??= new Map(b.pts.map(q => [q[0], q]))).get(ref);
      if (p && p[1] !== null && p[2] !== null) rows += `<div><span class="sq" style="background:${b.color}"></span>${esc(b.name)}: <b>${p[1].toFixed(digits)} – ${p[2].toFixed(digits)}</b> ${esc(unit)}</div>`; }
    dots.innerHTML = dd; xh.setAttribute('x1', X(ref)); xh.setAttribute('x2', X(ref)); xh.setAttribute('visibility', 'visible');
    showTip(ev, `<b>${title ? esc(title(ref)) : `${fdate(ref)} ${fhm(ref)}${step > 6e4 ? '–' + fhm(ref + step) : ''}`}</b>${rows}`);
  });
  svg.addEventListener('mouseleave', () => { hideTip(); dots.innerHTML = ''; xh.setAttribute('visibility', 'hidden'); });
}

// Bar chart, one bar per item: [{v, l1, l2, tip, light}]
function barChart(box, bars, unit, {xName = 'Day', maxW = 1e9} = {}) {
  sizeTo(box);
  if (!bars.length) { box.innerHTML = '<div class="empty">No records for this period.</div>'; return; }
  const yt = nice(0, Math.max(...bars.map(b => b.v)) || 1), y1 = yt[yt.length - 1], bw = (CW - CM.l - CM.r) / bars.length;
  const Y = v => CH - CM.b - v / y1 * (CH - CM.t - CM.b);
  let g = '', b = '';
  for (const v of yt) g += `<line class="grid" x1="${CM.l}" x2="${CW - CM.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${CM.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  bars.forEach((d, i) => {
    const w = Math.max(2, Math.min(bw - 2, maxW)), x = CM.l + i * bw + (bw - w) / 2, y = Y(d.v), r = Math.max(0, Math.min(4, w / 2, CH - CM.b - y));
    b += `<path d="M${x},${CH - CM.b}V${y + r}q0,${-r} ${r},${-r}h${w - 2 * r}q${r},0 ${r},${r}V${CH - CM.b}Z" style="fill:var(--s1)${d.light ? ';opacity:.45' : ''}"/>`;
    if (i % Math.ceil(26 / bw) === 0) b += `<text class="ax" x="${x + w / 2}" y="${CH - CM.b + 14}" text-anchor="middle">${esc(d.l1)}</text><text class="ax" x="${x + w / 2}" y="${CH - CM.b + 27}" text-anchor="middle">${esc(d.l2)}</text>`;
    b += `<rect data-i="${i}" x="${CM.l + i * bw}" y="${CM.t}" width="${bw}" height="${CH - CM.t - CM.b}" fill="transparent"/>`;
  });
  box.innerHTML = `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(unit)} per bar">${g}
    <text class="ax" x="12" y="${(CH - CM.b + CM.t) / 2}" transform="rotate(-90 12 ${(CH - CM.b + CM.t) / 2})" text-anchor="middle">${esc(unit)}</text>${axes(xName)}${b}</svg>`;
  const svg = box.querySelector('svg');
  svg.addEventListener('mousemove', ev => { const i = ev.target.dataset && ev.target.dataset.i; if (i === undefined) return hideTip(); showTip(ev, bars[i].tip); });
  svg.addEventListener('mouseleave', hideTip);
}

const sensorName = k => (PROF.labels?.[k] || k).replace(/\s*\(.*\)\s*$/, '');
function byDay(rows) {   // local date -> {kwh, minutes, peak, peakT, tmin, tmax}
  const d = {};
  for (const r of rows) {
    const k = r.t.slice(0, 10), o = d[k] ??= {kwh: 0, minutes: 0, peak: null, peakT: '', tmin: null, tmax: null};
    o.kwh += r.kwh; o.minutes += r.minutes;
    if (r.p_max !== undefined && (o.peak === null || r.p_max > o.peak)) { o.peak = r.p_max; o.peakT = r.t.slice(11, 13) + ':00'; }
    if (r.TH1_t_min !== undefined) { o.tmin = o.tmin === null ? r.TH1_t_min : Math.min(o.tmin, r.TH1_t_min); o.tmax = o.tmax === null ? r.TH1_t_max : Math.max(o.tmax, r.TH1_t_max); }
  }
  return d;
}

async function renderHistory() {
  const box = el('content');
  hideTip();
  if (WXVIEWS[view]) return WXVIEWS[view](box);
  if (QVIEWS[view]) return QVIEWS[view](box);
  if (view === 'versions') return versionsView(box);
  if (view === 'sites') return sitesView(box);
  if (view === 'prefs') return settingsView(box);
  if (view === 'register') return registerView(box);
  if (view === 'power') {
    const j = await hourly();
    const pk = j.hours.filter(r => r.p_max !== undefined).reduce((a, r) => (!a || r.p_max > a.p_max ? r : a), null);
    box.innerHTML = head('Power, hour by hour', `Mean kW of each hour and the highest 15-second sample in it. Hotel time, ${pText()}.`, periodPicker(recCsv(j.hours.length > 0))) +
      tiles([statTile('Highest 15-second sample', pk ? pk.p_max.toFixed(1) : '–', 'kW', pk ? `${fdate(tp(pk.t))} ${pk.t.slice(11)}` : ''),
       statTile('Mean over the period', (j.hours.reduce((a, r) => a + (r.p ?? 0), 0) / (j.hours.filter(r => r.p !== undefined).length || 1)).toFixed(1), 'kW'),
       PROF.contracted_kva ? statTile('PLN contract', PROF.contracted_kva, 'kVA', 'apparent power, see Live now') : '']) +
      `<div class="mt-16">${chartCard('ch')}</div>`;
    lineChart(el('ch'), [{name: 'Mean of the hour', color: C[0], pts: j.hours.map(r => [tp(r.t), r.p ?? null])},
      {name: 'Highest 15-second sample', color: C[1], width: 1.4, pts: j.hours.map(r => [tp(r.t), r.p_max ?? null])}], {unit: 'kW', yZero: true});
  } else if (view === 'day') {
    dayShown ??= todayH();
    const day = dayShown, [j0, j] = await Promise.all([hourly({from: day, to: day}), getJ(`/api/v1/history/${site}/day/${day}`)]);
    const today = j0.now.slice(0, 10), ms = tp(day + ' 00:00'), d = byDay(j0.hours)[day];
    const pts = j.minutes.map(m => [tp(`${day} ${m[0]}`), m[1], m[2], m[3]]);
    const pk = pts.reduce((a, p) => (!a || (p[3] ?? p[1]) > (a[3] ?? a[1]) ? p : a), null);
    const tools = `<div class="seg" role="group" aria-label="Day">${segBtn(`data-day="${isoDay(ms - 864e5)}"`, false, '◀ ' + fdate(ms - 864e5))}${segBtn('', true, fdate(ms))}${
      segBtn(`data-day="${isoDay(ms + 864e5)}"`, false, fdate(ms + 864e5) + ' ▶', dayShown >= today)}</div>${dateIn('data-pick="day"', day, 'Day')}${csvBtn(day, day, pts.length > 0)}`;
    box.innerHTML = head(`One day, minute by minute: ${fdate(ms)}`, 'Total power of every minute (mean of the 15-second samples). Hover for the minute\'s lowest and highest sample.', tools) +
      tiles([statTile(dayShown === today ? 'Energy so far' : 'Energy', d ? d.kwh.toFixed(0) : '–', 'kWh', d && d.minutes < 1430 ? `${(d.minutes / 14.4).toFixed(0)} % of the minutes recorded` : ''),
        statTile('Highest 15-second sample', pk ? (pk[3] ?? pk[1]).toFixed(1) : '–', 'kW', pk ? 'at ' + fhm(pk[0]) : ''),
        statTile('Lowest minute', pts.length ? Math.min(...pts.map(p => p[1])).toFixed(1) : '–', 'kW', 'the base load')]) +
      `<div class="mt-16">${chartCard('ch')}</div>`;
    lineChart(el('ch'), [{name: 'Total power', color: C[0], width: 1.4, pts: pts.map(p => [p[0], p[1]]),
      extra: b => { const p = pts.find(q => q[0] === b[0]); return p && p[2] !== null ? `<div class="dim">samples ${p[2].toFixed(1)} – ${p[3].toFixed(1)} kW</div>` : ''; }}],
      {unit: 'kW', yZero: true, gapMs: 3 * 6e4, step: 6e4});
  } else if (view === 'energy') {
    const j = await hourly(), days = byDay(j.hours), keys = Object.keys(days).sort(), today = j.now.slice(0, 10);
    const full = keys.filter(k => k !== today && days[k].minutes >= 1430);
    const avg = full.length ? full.reduce((a, k) => a + days[k].kwh, 0) / full.length : null;
    const yest = isoDay(tp(today + ' 00:00') - 864e5), top = keys.reduce((a, k) => (!a || days[k].kwh > days[a].kwh ? k : a), null);
    box.innerHTML = head('Energy per day', `kWh per hotel day (00:00 to 24:00), from the meter's counter. Lighter bars: today, or a day with missing minutes. ${cap(pText())}.`,
        periodPicker(recCsv(j.hours.length > 0))) +
      tiles([range ? statTile('Total of the period', keys.reduce((a, k) => a + days[k].kwh, 0).toFixed(0), 'kWh', `${keys.length} day${keys.length === 1 ? '' : 's'} with records`)
          : statTile('Today so far', days[today] ? days[today].kwh.toFixed(0) : '–', 'kWh'),
        range ? statTile('Highest day', top ? days[top].kwh.toFixed(0) : '–', 'kWh', top ? fday(top) : '')
          : statTile('Yesterday', days[yest] ? days[yest].kwh.toFixed(0) : '–', 'kWh'),
        statTile('Mean of the full days', avg === null ? '–' : avg.toFixed(0), 'kWh', `${full.length} full day${full.length === 1 ? '' : 's'}`)]) +
      `<div class="mt-16">${chartCard('ch')}</div>`;
    barChart(el('ch'), keys.map(k => { const d = days[k], ms = tp(k + ' 00:00'), part = k === today || d.minutes < 1430;
      return {v: d.kwh, light: part, l1: DAYS[new Date(ms).getUTCDay()], l2: `${new Date(ms).getUTCDate()} ${MONS[new Date(ms).getUTCMonth()]}`,
        tip: `<b>${fdate(ms)}</b>${d.kwh.toFixed(1)} kWh${part ? ` (${k === today ? 'so far' : (d.minutes / 14.4).toFixed(0) + ' % of the minutes'})` : ''}` +
          (d.peak !== null ? `<br>peak ${d.peak.toFixed(1)} kW (${d.peakT} hour)` : '') +
          (d.tmin !== null ? `<br>${esc(sensorName('TH1_t'))} ${d.tmin.toFixed(1)}–${d.tmax.toFixed(1)} °C` : '')}; }), 'kWh');
  } else if (view === 'week') {
    const j = await hourly(15), now = tp(j.now), d0 = tp(j.now.slice(0, 10) + ' 00:00');
    const w0 = d0 - new Date(d0).getUTCDay() * 864e5, lw0 = w0 - 7 * 864e5;
    const el_ = Math.floor((now - w0) / 36e5) * 36e5;   // complete hours only, the same in both weeks
    if (!el_) { box.innerHTML = head('This week against last week', 'The week started less than an hour ago: come back after the first full hour.'); return; }
    const sum = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.kwh, 0);
    const mins = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.minutes, 0);
    const cur = sum(w0, w0 + el_), last = sum(lw0, lw0 + el_), pct = last ? (cur - last) / last * 100 : null;
    const mx = Math.max(cur, last) || 1, h = v => (v / mx * 240).toFixed(0);
    const perDay = [...Array(7).keys()].map(i => ({i, a: sum(lw0 + i * 864e5, lw0 + (i + 1) * 864e5), b: w0 + i * 864e5 <= now ? sum(w0 + i * 864e5, w0 + (i + 1) * 864e5) : null}));
    const covL = mins(lw0, lw0 + el_) / (el_ / 6e4), covT = mins(w0, w0 + el_) / (el_ / 6e4);
    const gaps = covL < 0.97 || covT < 0.97;
    const verdict = gaps ? `<div class="verdict bad">Not comparable yet: records cover ${(covL * 100).toFixed(0)} % of last week's hours and ${(covT * 100).toFixed(0)} % of this week's (logger offline or backlog not uploaded)</div>`
      : pct === null ? '' : Math.abs(pct) < 0.5 ? `<div class="verdict">About the same as last week (${pct >= 0 ? '+' : ''}${pct.toFixed(1)} %)</div>`
      : `<div class="verdict ${pct > 0 ? 'bad' : 'ok'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)} % ${pct > 0 ? 'more' : 'less'} than last week</div>`;
    box.innerHTML = head('This week against last week', `Weeks start on Sunday 00:00. The complete hours of this week so far, against the same ${(el_ / 36e5).toFixed(0)} hours of last week.`) +
      `<section class="card"><div class="chart" id="ch"></div>${verdict}</section>` + sec('Day by day') +
      tableCard(`<tr><th>Day</th><th>Last week</th><th>This week</th><th>Change</th></tr>${perDay.map(r => {
         const ch = r.b === null || !r.a ? '' : ((r.b - r.a) / r.a * 100);
         return `<tr><td>${DAYS[r.i]}</td><td>${r.a ? r.a.toFixed(0) + ' kWh' : '–'}</td><td>${r.b === null ? '–' : r.b.toFixed(0) + ' kWh' + (w0 + (r.i + 1) * 864e5 > now ? ' so far' : '')}</td>
           <td>${ch === '' || w0 + (r.i + 1) * 864e5 > now ? '' : `<span class="${ch > 0.5 ? 'bad' : ch < -0.5 ? 'ok' : ''}">${ch >= 0 ? '+' : ''}${ch.toFixed(1)} %</span>`}</td></tr>`; }).join('')}`);
    const rng = a => `${fdate(a)} – ${fdate(a + el_)} ${fhm(a + el_)}`;
    barChart(el('ch'), [{v: last, light: true, l1: 'Last week: ' + last.toFixed(0) + ' kWh', l2: rng(lw0), tip: `<b>Last week</b>${last.toFixed(0)} kWh<br>${rng(lw0)}`},
      {v: cur, l1: 'This week so far: ' + cur.toFixed(0) + ' kWh', l2: rng(w0), tip: `<b>This week so far</b>${cur.toFixed(0)} kWh<br>${rng(w0)}`}], 'kWh', {xName: 'Same hours of each week', maxW: 150});
  } else if (view === 'temperature' || view === 'humidity') {
    const j = await hourly(), q = view === 'temperature' ? 't' : 'rh', unit = q === 't' ? '°C' : '% RH';
    const ids = [...new Set(j.hours.flatMap(r => Object.keys(r)).filter(k => /^TH\d+_/.test(k)).map(k => k.split('_')[0]))].sort();
    const series = ids.map((id, n) => ({name: sensorName(`${id}_${q}`), color: C[n] || QUIET,
      pts: j.hours.map(r => [tp(r.t), r[`${id}_${q}`] ?? null]),
      extra: b => { const r = j.hours.find(x => tp(x.t) === b[0]); return r && r[`${id}_${q}_min`] !== undefined ? ` <span class="dim">(${r[`${id}_${q}_min`].toFixed(q === 't' ? 1 : 0)}–${r[`${id}_${q}_max`].toFixed(q === 't' ? 1 : 0)})</span>` : ''; }}));
    const tl = [];
    for (const s of series) { const v = s.pts.map(p => p[1]).filter(x => x !== null);
      if (v.length) tl.push(statTile(`${s.name}: lowest – highest`, `${Math.min(...v).toFixed(q === 't' ? 1 : 0)} – ${Math.max(...v).toFixed(q === 't' ? 1 : 0)}`, unit, 'hourly means')); }
    box.innerHTML = head(view === 'temperature' ? 'Temperature' : 'Relative humidity',
      `Hourly means of the 5-minute readings; hover for the hour's lowest and highest. ${esc(Object.entries(PROF.sensors || {}).map(([k, v]) => `${k}: ${v}`).join(' · '))}. ${cap(pText())}.`,
      periodPicker(recCsv(j.hours.length > 0))) +
      `<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${tl.join('')}</div><div class="mt-16">${chartCard('ch')}</div>`;
    lineChart(el('ch'), series, {unit, digits: q === 't' ? 1 : 0});
  }
}

// ------------------------------------------------------------------ weather (server/app/weather.py, docs/WEATHER.md)
let WXC = null, WXL = {};
async function wxNow() {
  if (WXC && Date.now() - WXC.at < 300e3) return WXC.j;
  const j = await getJ(`/api/v1/weather/${site}`);
  WXC = {at: Date.now(), j};
  return j;
}
async function wxLog(p = per()) {
  const k = pq(p), c = WXL[k];
  if (c && Date.now() - c.at < 300e3) return c.j;
  const j = await getJ(`/api/v1/weather/${site}/log?${k}`);
  if (!j.hours) throw new Error(j.error || 'no hours');
  WXL[k] = {at: Date.now(), j};
  return j;
}
function wxIcon(code, day = 1) {   // WMO weather code -> symbol
  if (code === null || code === undefined) return '';
  const i = code <= 1 ? (day === 0 ? '🌙' : '☀️') : code === 2 ? (day === 0 ? '☁️' : '⛅') : code === 3 ? '☁️' : code <= 48 ? '🌫️'
    : code <= 57 ? '🌦️' : code <= 67 || (code >= 80 && code <= 82) ? '🌧️' : code <= 86 ? '🌨️' : '⛈️';
  return `<span class="wxi" aria-hidden="true">${i}</span>`;
}
const f1 = (v, d = 1) => v === null || v === undefined ? '–' : (+v).toFixed(d);
const compass = d => d === null || d === undefined ? '' : ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(d / 45) % 8];
const outId = () => (Object.entries(PROF.sensors || {}).find(([, v]) => /outdoor|outside/i.test(v)) || ['TH2'])[0];
const wxSource = j => `${esc(j.source || 'Open-Meteo')}, model ${esc(j.model || 'best_match')}, ${f1(j.lat, 3)}, ${f1(j.lon, 3)}` +
  (j.fetched ? `, updated ${localTime(j.fetched, PROF.utc_offset_h ?? 8, false).slice(0, 5)} hotel time` : '');
function wxMissing(j, title) {
  if (j.hours && j.hours.length) return '';
  const how = `docker compose exec ingest python tools/manage.py weather ${esc(site)} --lat -8.xxxx --lon 115.xxxx`;
  return head(title, '') + (j.enabled
    ? `<section class="card"><div class="empty">No forecast fetched yet${j.error ? ': ' + esc(j.error) : ' (the service fetches it within a minute of starting, then every hour)'}.</div></section>`
    : `<section class="card">Weather is not set for this site. On the VPS, with the site's position (decimal degrees, south negative):
       <pre>${how}</pre>See docs/WEATHER.md.</section>`);
}
async function measuredOutdoor(p) {   // hotel hour -> {t, min, max} of the outdoor sensor, from the day files
  const O = outId(), m = {};
  try { for (const r of (await hourly(p)).hours) if (r[`${O}_t`] !== undefined) m[r.t] = {t: r[`${O}_t`], min: r[`${O}_t_min`], max: r[`${O}_t_max`]}; }
  catch (e) {}
  return m;
}
function wxTable(rows, nowT, meas = null) {

    <th class="hide-s">Humidity</th><th class="hide-s">Cloud</th><th class="hide-s">Wind</th><th class="hide-s">Sun</th>${meas ? `<th>Measured ${esc(outId())}</th>` : ''}</tr>`;
  for (const r of rows) {

    h += `<tr class="${cls}"><td>${r.t.slice(11)}${r.t === hr ? ' now' : ''}</td><td>${wxIcon(r.code, r.is_day)}${esc(r.condition)}</td><td>${f1(r.temp_c)} °C</td>
      <td class="hide-s">${f1(r.feels_c)} °C</td><td>${r.precip_mm ? f1(r.precip_mm) + ' mm' : '0'}${r.precip_prob_pct !== null && r.precip_prob_pct !== undefined ? ` · ${r.precip_prob_pct} %` : ''}</td>
      <td class="hide-s">${f1(r.rh_pct, 0)} %</td><td class="hide-s">${f1(r.cloud_pct, 0)} %</td><td class="hide-s">${f1(r.wind_kmh, 0)} km/h ${compass(r.wind_dir)}</td>
      <td class="hide-s">${f1(r.rad_wm2, 0)} W/m²</td>${meas ? `<td>${meas[r.t] ? f1(meas[r.t].t) + ' °C' : ''}</td>` : ''}</tr>`;

}
function rainBars(box, rows, nowT) {
  const hr = nowT.slice(0, 13) + ':00';
  barChart(box, rows.map(r => ({v: r.precip_mm ?? 0, light: r.t < hr, l1: r.t.slice(11, 13), l2: r.precip_prob_pct !== null && r.precip_prob_pct !== undefined ? r.precip_prob_pct + '%' : '',
    tip: `<b>${r.t.slice(11)}–${String(+r.t.slice(11, 13) + 1).padStart(2, '0')}:00</b>${wxIcon(r.code, r.is_day)}${esc(r.condition)}<br>${f1(r.precip_mm, 1)} mm` +
      (r.precip_prob_pct !== null && r.precip_prob_pct !== undefined ? `, chance ${r.precip_prob_pct} %` : '')})), 'mm', {xName: 'Hour (hotel time), chance of rain under it'});
}
async function wxStrip() {   // one line on "Live now"

    lineChart(el('ch'), [1, 2, 3].map(k => ({name: 'L' + k, color: C[k - 1], pts: H.map(r => [tp(r.t), r[`v${k}`] ?? null]), extra: rangeTip(k)})),
      {unit: 'V', axis: 'volts', refs: vRefs(j), bands: [{name: 'Lowest – highest 15-second sample', color: BAND, pts: H.map(r => [tp(r.t), ext(r, 'min', Math.min), ext(r, 'max', Math.max)])}]});
    lineChart(el('ch2'), [{name: 'Mean of the hour', color: C[0], pts: H.map(r => [tp(r.t), r.vu ?? null])},
      {name: 'Highest minute', color: C[1], width: 1.4, pts: H.map(r => [tp(r.t), r.vu_max ?? null])}],
      {unit: '%', yZero: true, digits: 2, refs: [{v: L.vu.v, label: limName(L.vu, 'voltage unbalance')}]});

  },

  async pf(box) {
    const j = await qHourly(), H = j.hours, L = j.limits, t = qSum(H), lim = L.pf.v, target = 0.95;
    const title = 'Power factor';
    const note = `Mean power factor of each hour while the load is ${j.pf_load_kw} kW or more (as alarm ${esc(L.pf.id)}), and its lowest 15-second sample. ` +
      `PLN bills the reactive energy above 62 % of the kWh (power factor 0.85) of the month. Hotel time, ${pText()}.`;
    if (t.pf === null && t.kvarh === null) return noMeter(box, title, note, H.length > 0);
    let cap = null;   // the largest need of an hour: kW x (tan phi now - tan phi at the target)
    for (const r of H) if (r.pf > 0 && r.pf < target && r.p !== undefined) {
      const need = Math.abs(r.p) * (tanPhi(r.pf) - tanPhi(target));
      if (!cap || need > cap.v) cap = {v: need, r};
    }
    const excess = t.kwh !== null && t.kvarh !== null ? Math.max(0, t.kvarh - PLN_KVARH * t.kwh) : null;
    const days = qByDay(H);
    box.innerHTML = head(title, note, periodPicker(recCsv(true))) + tiles([
      statTile('Power factor of the period', flag(under(t.pfE, lim), f1(t.pfE, 2)), '',
        t.pfE === null ? 'no kVArh counter in the records' : `${f1(t.kwh, 0)} kWh and ${f1(t.kvarh, 0)} kVArh (meter counters)`),
      statTile('Mean under load', flag(under(t.pf, lim), f1(t.pf, 2)), '', `lowest 15-second sample ${f1(t.pfmin, 2)}`),
      statTile(`Time below ${lim}`, flag(t.pf_low > 0, pctOf(t.pf_low, t.loaded)), '%', `${t.pf_low} of ${t.loaded} minutes under load`),
      statTile('kVArh above 62 % of the kWh', flag(excess > 0, f1(excess, 0)), 'kVArh',
        excess === null ? 'needs the kWh and kVArh counters' : 'what PLN bills as excess reactive energy (counted per month); 0 while the power factor is 0.85 or more'),
      statTile(`Capacitor to reach ${target}`, cap ? f1(cap.v, 0) : '0', 'kvar',
        cap ? `largest hourly need: ${f1(Math.abs(cap.r.p), 1)} kW at ${f1(cap.r.pf, 2)}, ${hourAt(cap.r.t)} · an indication for an automatic bank, to check on site`
          : `every hour at ${target} or more`)]) +
      `<div class="mt-16">${chartCard('ch')}</div>` + sec('By hour of the day', 'mean of the period') + chartCard('ch3') +
      sec('Active and reactive power, hour by hour') + chartCard('ch2') + sec('Day by day') +
      tableCard(`<tr><th>Day</th><th>kWh</th><th>kVArh</th><th>Power factor</th><th class="hide-s">Mean under load</th>
        <th class="hide-s">Lowest sample</th><th>Below ${lim}</th><th class="hide-s">kVArh above 62 %</th></tr>${Object.keys(days).sort().reverse().map(k => {
          const d = days[k], ex = d.kwh !== null && d.kvarh !== null ? Math.max(0, d.kvarh - PLN_KVARH * d.kwh) : null;
          return `<tr><td>${fdate(tp(k + ' 00:00'))}</td><td>${f1(d.kwh, 0)}</td><td>${f1(d.kvarh, 0)}</td><td>${d.pfE === null ? '–' : flag(under(d.pfE, lim), f1(d.pfE, 2))}</td>
            <td class="hide-s">${f1(d.pf, 2)}</td><td class="hide-s">${f1(d.pfmin, 2)}</td><td>${d.loaded ? flag(d.pf_low > 0, pctOf(d.pf_low, d.loaded, 0) + ' %') : '–'}</td>
            <td class="hide-s">${ex === null ? '–' : f1(ex, 0)}</td></tr>`; }).join('')}`) +
      `<div class="foot"><span>Power factor of a period = kWh / √(kWh² + kVArh²), from the meter's counters. The sign of the power factor is not used (leading or lagging);
        no power factor is counted below ${j.pf_load_kw} kW. The capacitor estimate uses hourly means: size a bank with the supplier after a site survey.</span></div>`;
    const byT = new Map(H.map(r => [tp(r.t), r]));
    lineChart(el('ch'), [{name: 'Mean under load', color: C[0], pts: H.map(r => [tp(r.t), r.pf ?? null]),
        extra: b => { const r = byT.get(b[0]); return r && r.p !== undefined ? ` <span class="dim">at ${f1(r.p, 1)} kW</span>` : ''; }},
      {name: 'Lowest 15-second sample', color: C[1], width: 1.4, pts: H.map(r => [tp(r.t), r.pf_min ?? null])}],
      {unit: 'PF', digits: 2, refs: [{v: lim, label: limName(L.pf, 'low power factor')}]});
    lineChart(el('ch2'), [{name: 'Active power', color: C[0], unit: 'kW', pts: H.map(r => [tp(r.t), r.p ?? null])},
      {name: 'Reactive power', color: C[1], unit: 'kvar', pts: H.map(r => [tp(r.t), r.q ?? null])}], {unit: 'kW · kvar', yZero: true});
    const hod = [...Array(24).keys()].map(hr => { const rows = H.filter(r => +r.t.slice(11, 13) === hr), s = qSum(rows);
      const p = rows.filter(r => r.p !== undefined); return {hr, pf: s.pf, p: p.length ? p.reduce((a, r) => a + r.p, 0) / p.length : null}; });
    const T0 = Date.UTC(2000, 0, 1), hh = n => String(n).padStart(2, '0') + ':00';
    lineChart(el('ch3'), [{name: 'Mean under load', color: C[0], pts: hod.map(o => [T0 + o.hr * 36e5, o.pf]),
        extra: b => { const o = hod[Math.round((b[0] - T0) / 36e5)]; return o && o.p !== null ? ` <span class="dim">mean ${f1(o.p, 1)} kW</span>` : ''; }}],
      {unit: 'PF', digits: 2, xName: 'Hour of the day (hotel time)', title: ms => { const n = Math.round((ms - T0) / 36e5); return `${hh(n)}–${hh(n + 1)}, every day`; },
       refs: [{v: lim, label: limName(L.pf, 'low power factor')}]});
  },
};

async function qDaySection() {   // #voltage: one hotel day, minute by minute (redrawn alone by the day buttons)
  const j = await qHourly(), L = j.limits, t = qSum(j.hours), today = j.now.slice(0, 10);
  qDay ??= range && range.to < today ? range.to : today;
  const box = el('qday');
  if (!box) return;
  const day = qDay, dj = await getJ(`/api/v1/quality/${site}/day/${day}`);
  if (el('qday') !== box || day !== qDay) return;   // redrawn (other span, page or day) while this day was loading
  const ci = Object.fromEntries(dj.cols.map((c, i) => [c, i])), R = dj.rows, ms = tp(qDay + ' 00:00');
  const worst = t.vloAt ? t.vloAt.t.slice(0, 10) : null;
  const tools = `<div class="headtools"><div class="seg" role="group" aria-label="Day">${segBtn(`data-qday="${isoDay(ms - 864e5)}"`, false, '◀ ' + fdate(ms - 864e5))}${segBtn('', true, fdate(ms))}${
      segBtn(`data-qday="${isoDay(ms + 864e5)}"`, false, fdate(ms + 864e5) + ' ▶', qDay >= today)}</div>${dateIn('data-pick="qday"', qDay, 'Day')}` +
    (worst && worst !== qDay ? `<button class="btn small" data-qday="${worst}">Lowest of the period: ${fdate(tp(worst + ' 00:00'))}</button>` : '') + '</div>';
  let lo = null, hi = null, dips = 0, swells = 0;
  for (const r of R) for (const k of [1, 2, 3]) {
    const a = r[ci[`v${k}_min`]] ?? r[ci[`v${k}`]], b = r[ci[`v${k}_max`]] ?? r[ci[`v${k}`]];
    if (a !== null && (!lo || a < lo.v)) lo = {v: a, t: r[0], ph: k};
    if (b !== null && (!hi || b > hi.v)) hi = {v: b, t: r[0], ph: k};
  }
  for (const r of R) {
    const a = [1, 2, 3].map(k => r[ci[`v${k}_min`]] ?? r[ci[`v${k}`]]).filter(x => x !== null);
    const b = [1, 2, 3].map(k => r[ci[`v${k}_max`]] ?? r[ci[`v${k}`]]).filter(x => x !== null);
    dips += a.length && Math.min(...a) < L.dip.v; swells += b.length && Math.max(...b) > L.swell.v;
  }
  box.innerHTML = `<div class="page-head" style="margin-top:28px"><div><h2 style="font-size:19px;font-weight:800">One day, minute by minute: ${fdate(ms)}</h2>
      <div class="sub">Mean of each phase per minute, and in grey the lowest to highest 15-second sample of the minute. Hover for each phase's range.</div></div>${tools}</div>` +
    tiles([statTile('Lowest 15-second sample', lo ? flag(lo.v < L.dip.v, f1(lo.v)) : '–', 'V', lo ? `L${lo.ph} at ${lo.t}` : ''),
      statTile('Highest 15-second sample', hi ? flag(hi.v > L.swell.v, f1(hi.v)) : '–', 'V', hi ? `L${hi.ph} at ${hi.t}` : ''),
      statTile('Dips · swells', flag(dips + swells > 0, `${dips} · ${swells}`), 'minutes', `below ${L.dip.v} V · above ${L.swell.v} V`),
      statTile('Minutes recorded', R.length, qDay === today ? 'so far' : 'of 1440', '')]) +
    `<div class="mt-16">${chartCard('ch4')}</div>`;
  const pts = k => R.map(r => [tp(`${qDay} ${r[0]}`), r[ci['v' + k]]]);
  const at = new Map(R.map(r => [tp(`${qDay} ${r[0]}`), r]));
  const rangeTip = k => b => { const r = at.get(b[0]); return r && r[ci[`v${k}_min`]] !== null ? ` <span class="dim">(${f1(r[ci[`v${k}_min`]])}–${f1(r[ci[`v${k}_max`]])})</span>` : ''; };
  const ext = (r, s, f) => { const v = [1, 2, 3].map(k => r[ci[`v${k}_${s}`]] ?? r[ci[`v${k}`]]).filter(x => x !== null); return v.length ? f(...v) : null; };
  lineChart(el('ch4'), [1, 2, 3].map(k => ({name: 'L' + k, color: C[k - 1], width: 1.4, pts: pts(k), extra: rangeTip(k)})),
    {unit: 'V', axis: 'volts', gapMs: 3 * 6e4, step: 6e4, refs: vRefs(j),
     bands: [{name: 'Lowest – highest 15-second sample', color: BAND, pts: R.map(r => [tp(`${qDay} ${r[0]}`), ext(r, 'min', Math.min), ext(r, 'max', Math.max)])}]});
}

let vfAll = false;

function bootText(r) {   // the logger's restart reason, in words
  const s = String(r || ''), [why, ver] = s.split('@');
  const w = {poweron: 'power on', ext: 'reset button', sw: 'restarted by the firmware', panic: 'crash (panic)',
    int_wdt: 'watchdog (frozen)', task_wdt: 'watchdog (task frozen)', wdt: 'watchdog', deepsleep: 'wake from sleep',
    brownout: 'supply voltage dropped (brownout)', sdio: 'SDIO reset', 'sw:ota': 'after a firmware update',
    'sw:ota_rollback': 'went back to the previous firmware', 'sw:daily': 'daily restart', 'sw:console': 'restart typed on the console',
    'sw:portal': 'restart from the setup portal', 'sw:import': 'settings imported from the SD card', 'sw:remote_regs': 'new register table',
    'sw:lowheap': 'memory low', 'sw:offline': 'no network for too long'}[why] || why || 'unknown';
  return w + (ver ? ` (firmware ${ver})` : '');
}
function fwEvent(e) {
  const by = e.by ? ` by ${esc(e.by)}` : '';
  switch (e.kind) {
    case 'firmware': return e.from ? ['Firmware changed', `<b>${esc(e.from)}</b> → <b>${esc(e.to)}</b>`] : ['First seen', `firmware <b>${esc(e.to)}</b>`];
    case 'ota_offered': return ['Update offered', `<b>${esc(e.version)}</b>${e.source ? ' from ' + esc(e.source) : ''}${by}`];
    case 'ota_cancelled': return ['Offer withdrawn', `${esc(e.version || '')}${by}`];
    case 'ota_failed': return ['Update refused by the logger', `<span class="bad">${esc(e.version)}: kept restarting, went back</span>`];
    case 'boot': return ['Restart', esc(bootText(e.reason)) + (e.record ? ` <span class="dimtxt">record ${esc(e.record.slice(11, 16))} UTC</span>` : '')];
    default: return [esc(e.kind), ''];
  }
}

  h += (j.releases || []).length ? tableCard(`<tr><th>Version</th><th>Published</th><th class="hide-s">Files</th><th>Running on</th></tr>${j.releases.map(r => {

          rolled_back: `<span class="bad">${what}: the logger kept restarting on it and went back to ${esc(v.running)}. Not offered again.</span>`,

  if (kind === 'cancel') {
    if (!ask(`Withdraw the firmware offered to ${dev}?`)) return;
    call = () => fwPost(`/api/v1/admin/fw/${dev}/cancel`, '{}', true);
  } else {
    if (kind === 'github') {
      const id = el(`fwgh-${dev}`).value;
      if (!id) return;
      label = el(`fwgh-${dev}`).selectedOptions[0].textContent;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/github`, JSON.stringify({asset_id: +id, force}), true);
    } else if (kind === 'upload') {
      const f = el(`fwup-${dev}`).files[0];
      if (!f) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Choose a .bin file first.</div>'; return; }
      label = f.name;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/upload?force=${force ? 1 : 0}&name=${encodeURIComponent(f.name)}`, f, false);
    } else {
      const file = el(`fwfile-${dev}`).value;
      if (!file) return;
      label = file;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/offer`, JSON.stringify({file, force}), true);
    }
    if (!ask(`Send ${label} to ${dev}?\n\nThe logger installs it and restarts (about 30 s without readings, nothing is lost: the SD card keeps recording). If the new firmware keeps restarting, it goes back to the current one by itself.`)) return;
  }
  m.textContent = 'Working...';
  try {
    const r = await call();
    const j = await r.json();
    m.innerHTML = r.ok ? `<div class="banner good" style="margin:8px 0 0">${kind === 'cancel' ? (j.cancelled ? 'Offer withdrawn.' : 'Nothing was offered to this logger.') : `Firmware ${esc(j.offer.version)} offered to ${esc(dev)}.`}</div>`
                       : `<div class="banner crit" style="margin:8px 0 0">${esc(j.error || 'HTTP ' + r.status)}</div>`;
    if (r.ok) el(`fwfile-${dev}`).dataset.done = '';
  } catch (e) { m.innerHTML = '<div class="banner crit" style="margin:8px 0 0">Server not reachable.</div>'; }
  fwRefresh(dev, off);
}
async function fwInit() {
  try { ME = await getJ('/api/v1/admin/me'); } catch (e) { return; }
  renderChrome();
  if (!ME.admin || !site) return;
  const st = await getJ('/api/v1/status');
  const devs = Object.keys((st.sites || {})[site] || {});
  if (!devs.length) return;
  const off = (await getJ(`/api/v1/live/${site}`)).profile?.utc_offset_h ?? 8;
  let h = head('Firmware update', 'Send a firmware to one logger: from a GitHub release, a .bin file, or a file already on the server. '
    + 'The logger restarts once; a firmware that keeps restarting goes back to the previous one by itself. See docs/OTA.md.', '<span class="pill info">Admin only</span>');
  for (const dev of devs) {
    const d = esc(dev);
    h += `<section class="card mb-16"><div class="card-head"><h2 id="fwsum-${d}">${d}</h2></div>
      <div class="fwstat" id="fws-${d}">Loading...</div>
      <div class="fwrow"><b>From a GitHub release</b><select id="fwgh-${d}" aria-label="GitHub release"><option value="">${ME.github ? 'loading...' : 'FW_GITHUB_REPO not set on the server'}</option></select>
        <button class="btn primary" data-dev="${d}" data-act="github">Send to ${d}</button></div>
      <div class="fwrow"><b>From a file on this computer</b><input type="file" id="fwup-${d}" accept=".bin" aria-label="Firmware file">
        <button class="btn" data-dev="${d}" data-act="upload">Upload and send to ${d}</button></div>
      <div class="fwrow"><b>Already on the server</b><select id="fwfile-${d}" aria-label="File on the server"></select>
        <button class="btn" data-dev="${d}" data-act="offer">Send to ${d}</button></div>
      <div class="fwrow"><b>Options</b><label class="check" style="padding:0"><input type="checkbox" id="fwforce-${d}"> force: allow an older version or the other build variant</label>
        <button class="btn danger" data-dev="${d}" data-act="cancel">Withdraw the offer</button></div>
      <div id="fwmsg-${d}"></div></section>`;
  }
  el('fw').innerHTML = h;
  el('fw').addEventListener('click', ev => { const b = ev.target.closest('button[data-act]'); if (b) fwAction(b.dataset.dev, b.dataset.act, off); });
  await Promise.all(devs.map(dev => fwRefresh(dev, off)));
  if (ME.github) fwGithub(devs);
  setInterval(() => devs.forEach(dev => fwRefresh(dev, off)), 30000);
}

// ------------------------------------------------------------------ page
let shown = 0;   // the latest show(): an older one still loading never writes its error over it
const LABEL = {quality: 'power quality', voltage: 'power quality', pf: 'power quality', versions: 'firmware versions', register: 'register table', sites: 'list of sites'};
async function show(id) {
  view = known(id) ? id : site ? 'now' : 'sites';
  renderChrome();
  el('fw').hidden = true;
  scrollTo(0, 0);
  if (view === 'firmware') {   // the panel lives in #fw, out of reach of the 15 s refresh of #content
    el('content').innerHTML = '';
    await fwReady;
    if (view !== 'firmware') return;
    if (isAdmin()) el('fw').hidden = false;
    else el('content').innerHTML = head('Firmware update', '') + '<section class="card"><div class="empty">Firmware update is only for the logins listed in ADMIN_USERS on the server (docs/OTA.md).</div></section>';
    return;
  }
  if (view === 'now') { el('content').innerHTML = ''; return tick(); }
  el('content').innerHTML = '<section class="card"><div class="empty">Loading…</div></section>';
  const n = ++shown;
  try { await renderHistory(); }
  catch (e) { console.error(e); if (n === shown) el('content').innerHTML = `<section class="card"><div class="empty">Could not read the ${WXVIEWS[view] ? 'weather' : LABEL[view] || 'history'} from the server.</div></section>`; }
}
document.addEventListener('click', ev => {
  const r = ev.target.closest('button[data-role]');
  if (r) return setRole(r.dataset.role);
  const b = ev.target.closest('button[data-span],button[data-day],button[data-vf],[data-qday]');
  if (!b || b.disabled) return;
  if (b.dataset.qday) {   // a day of the power quality pages: a link opens #voltage on it, a button redraws the day only
    qDay = b.dataset.qday;
    if (b.tagName === 'A' || !el('qday')) return;
    return qDaySection().catch(() => { el('qday').innerHTML = '<section class="card"><div class="empty">Could not read that day from the server.</div></section>'; });
  }
  if (b.dataset.vf) vfAll = b.dataset.vf === 'all';
  if (b.dataset.span) { span = +b.dataset.span; range = null; periodChanged(); }
  if (b.dataset.day) dayShown = b.dataset.day;
  show(view);
});
// From and To: Show (or Enter) applies the two dates; until then Show is highlighted. A day's calendar (One day, Voltage) applies
// at once, a moment after the last change, so typing a date digit by digit does not redraw the page at every digit.
document.addEventListener('click', ev => { if (ev.target.closest('button[data-apply]')) applyRange(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && /^(from|to)$/.test(ev.target.dataset?.pick || '')) { ev.preventDefault(); applyRange(); } });
const datesEdited = () => { const b = document.querySelector('button[data-apply]'), d = pDates();
  if (b && el('pFrom') && el('pTo')) b.classList.toggle('primary', el('pFrom').value !== d.from || el('pTo').value !== d.to); };
let pickT;
for (const type of ['input', 'change']) document.addEventListener(type, ev => {
  const k = ev.target.dataset?.pick;
  if (k === 'from' || k === 'to') return datesEdited();
  if (type !== 'change' || (k !== 'day' && k !== 'qday')) return;
  const v = ev.target.value, v0 = view;
  clearTimeout(pickT);
  pickT = setTimeout(() => {   // a redraw meanwhile (resize, refresh) replaced the field: the date chosen still counts
    if (view !== v0 || !/^\d{4}-\d{2}-\d{2}$/.test(v) || v > todayH() || v < '2000-01-01') return;   // other page, or half typed
    if (k === 'day') { dayShown = v; return show(view); }
    if (!el('qday')) return;
    qDay = v;
    qDaySection().catch(() => { el('qday').innerHTML = '<section class="card"><div class="empty">Could not read that day from the server.</div></section>'; });
  }, 600);
});
addEventListener('hashchange', () => show(location.hash.slice(1)));
const STATIC = ['now', 'firmware', 'prefs', 'register'];   // not redrawn by a resize or the 5-minute refresh
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!STATIC.includes(view)) renderHistory().catch(() => {}); }, 300); });

async function tick() {
  try { await loadSite(); }
  catch (e) { console.error(e); STATUS = '<span class="live-pill off"><i></i>Server not reachable</span>'; renderChrome(); }
}
if (MOCK) el('mocknote').hidden = false;
fwReady = fwInit().catch(() => {});
view = known(location.hash.slice(1)) ? location.hash.slice(1) : site ? 'now' : 'sites';
renderChrome();
const redraw = () => renderHistory().catch(() => {});   // in place: no "Loading" and no jump to the top
if (!site) { show(view); setInterval(() => { if (view === 'sites' && !document.hidden) redraw(); }, 15000); }
else {   // the live call also brings the site profile (names, sensors, contract) the other pages use
  if (view === 'now') tick(); else tick().finally(() => fwReady).finally(() => show(view));
  setInterval(tick, 15000);
  setInterval(() => {   // a period that ended before today does not change: not read again
    if (STATIC.includes(view) || document.hidden || (range && range.to < todayH())) return;
    delete HCACHE[pq(per())]; delete QCACHE[pq(per())]; WXC = null; WXL = {}; redraw();
  }, 300e3);
}
</script>
