<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Live</title>
<style>
  :root{color-scheme:light;--ink:#1f2933;--ink2:#52606d;--muted:#7b8794;--line:#e4e7eb;--bg:#eef1f5;--card:#fff;
    --navy:#0f2747;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--good:#127a3a;--warn:#b45309;--bad:#b42318;--info:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
  a{color:inherit}
  .top{background:var(--navy);color:#fff;padding:14px 20px}
  .top .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1400px;margin:auto}
  .top h1{margin:0;font-size:1.3rem}
  .top nav a{color:#cfe0ff;text-decoration:none;margin-left:16px;font-size:.9rem;white-space:nowrap}
  .top nav a:hover{text-decoration:underline}
  .sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:1400px;margin:8px auto 0;font-size:.85rem;color:#cfe0ff}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:600;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);color:#fff}
  .pill i{width:8px;height:8px;border-radius:50%;background:#9aa5b1}
  .pill.live i{background:#3ddc84}.top .pill.bad{color:#fff}.pill.bad{background:#b42318;border-color:#b42318}.pill.bad i{background:#fff}
  .wrap{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1440px;margin:auto;padding:16px 20px 30px}
  .wrap.solo{grid-template-columns:1fr;max-width:1200px}.wrap.solo .side{display:none}
  .side{position:sticky;top:12px;align-self:start}
  .side h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 6px 6px}
  .side h3:first-child{margin-top:4px}
  .side a{display:block;text-decoration:none;padding:7px 10px;border-radius:6px;font-size:.9rem;color:var(--ink)}
  .side a small{display:block;color:var(--muted);font-size:.74rem}
  .side a:hover{background:#dfe5ec}.side a.on{background:var(--card);box-shadow:0 1px 3px rgba(15,39,71,.12);font-weight:600}
  main{min-width:0}
  .vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:2px 0 12px}
  .vt{font-size:1.15rem;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 2px}
  .vn{font-size:.85rem;color:var(--ink2);max-width:720px}
  .seg{display:inline-flex;border:1px solid #c9ced6;border-radius:6px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:5px 10px;font:inherit;font-size:.8rem;color:var(--ink2);cursor:pointer;border-left:1px solid #e4e7eb}
  .seg button:first-child{border-left:0}.seg button.on{background:var(--navy);color:#fff}.seg button:disabled{opacity:.4;cursor:default}
  .chartbox{margin-top:12px;padding:10px 12px}
  svg.chart{display:block;width:100%;height:auto}
  .gl{stroke:#eceff3}.ax text{fill:var(--muted);font-size:11px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2);margin:0 0 4px 44px}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .tip>b:first-child{display:block;margin-bottom:2px}
  .tip .sq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .cmp{display:flex;gap:48px;justify-content:center;align-items:flex-end;min-height:300px;text-align:center}
  .cmp .cbar{width:130px;border-radius:4px 4px 0 0;margin:4px auto 6px}.cmp small{color:var(--muted)}
  .verdict{text-align:center;font-weight:600;margin:12px 0 4px;color:var(--ink2)}
  h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 2px 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .card{background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(15,39,71,.10);position:relative}
  .k{font-size:.8rem;color:var(--ink2)}
  .v{font-size:1.75rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
  .v small{font-size:.9rem;font-weight:500;color:var(--ink2);margin-left:3px}
  .range{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .meter{height:6px;border-radius:3px;background:#e4e7eb;margin:6px 0 2px;overflow:hidden}
  .meter b{display:block;height:100%;border-radius:3px;background:var(--s1)}
  .meter b.warn{background:#d97706}.meter b.bad{background:var(--bad)}
  .spark{display:block;width:100%;height:40px;margin-top:6px;overflow:visible}
  .spark.tall{height:64px}
  .phase{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:2px 12px;align-items:baseline;margin-top:4px;font-variant-numeric:tabular-nums}
  .phase .h{font-size:.72rem;color:var(--muted);text-align:right}
  .phase .n{font-size:1.25rem;font-weight:700;text-align:right}
  .phase .l{font-size:.8rem;color:var(--ink2)}
  .phase .sw{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .alarm{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:10px;padding:10px 14px;margin:8px 0;
    box-shadow:0 1px 3px rgba(15,39,71,.10);border-left:6px solid var(--info)}
  .alarm.critical{border-left-color:var(--bad)}.alarm.warning{border-left-color:#d97706}
  .alarm .ic{font-weight:700;width:20px;text-align:center}
  .alarm.critical .ic{color:var(--bad)}.alarm.warning .ic{color:var(--warn)}.alarm.info .ic{color:var(--info)}
  .alarm .t{font-weight:600}.alarm .d{font-size:.85rem;color:var(--ink2)}
  .okline{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 12px;font-size:.88rem;
    color:var(--good);font-weight:600;box-shadow:0 1px 3px rgba(15,39,71,.10)}
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
  .facts div{font-size:.8rem;color:var(--ink2)}.facts b{display:block;font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
  table{border-collapse:collapse;width:100%;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(15,39,71,.10)}
  td,th{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:.85rem;vertical-align:top}
  th{font-size:.75rem;color:var(--muted);font-weight:600;background:#f8f9fb}
  tr:last-child td{border-bottom:0}
  .sev{display:inline-block;border-radius:4px;padding:1px 6px;font-size:.72rem;font-weight:600;background:#e4e7eb;color:var(--ink2)}
  .sev.critical{background:#fde8e7;color:var(--bad)}.sev.warning{background:#fef3c7;color:var(--warn)}.sev.info{background:#e0ecff;color:var(--info)}
  .tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #d5dae0;border-radius:6px;padding:5px 8px;font-size:.78rem;
    box-shadow:0 2px 6px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:5}
  .empty{background:var(--card);border-radius:10px;padding:18px;color:var(--bad);font-weight:600}
  .ok{color:var(--good)}.bad{color:var(--bad)}
  .foot{font-size:.75rem;color:var(--muted);margin-top:18px}
  .wxline{display:inline-flex;flex-wrap:wrap;gap:4px 12px;align-items:center;background:var(--card);border-radius:999px;padding:5px 14px;
    margin:8px 0 0 8px;font-size:.88rem;color:var(--ink2);text-decoration:none;box-shadow:0 1px 3px rgba(15,39,71,.10)}
  .wxline b{color:var(--ink)}.wxline:hover{background:#f4f7fb}
  tr.past td{color:var(--muted)}tr.cur td{background:#eef5ff;font-weight:600}
  .wxi{font-size:1.1em;margin-right:4px}
  details.fw{background:var(--card);border-radius:10px;padding:10px 14px;margin:8px 0;box-shadow:0 1px 3px rgba(15,39,71,.10)}
  details.fw summary{cursor:pointer;font-weight:600}
  .fw .row{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem}
  .fw .row b{min-width:210px}
  .fw select{max-width:340px}
  .fw .msg{margin:6px 0;font-weight:600}
  .fw .ev{font-size:.82rem;color:var(--ink2);margin:2px 0}
  .fw .warn{color:var(--warn)}
  @media (max-width:900px){.wrap{grid-template-columns:1fr;padding:10px 12px 24px}
    .side{position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}.side h3{display:none}
    .side a{white-space:nowrap;flex:none}.side a small{display:none}}
  @media (max-width:520px){.top nav a{margin:0 12px 0 0}.v{font-size:1.5rem}.grid{grid-template-columns:1fr 1fr}.grid.wide{grid-template-columns:1fr}
    td,th{padding:6px 8px}.hide-s{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="row"><h1 id="title">Live</h1>
    <nav><a href="/live/">All sites</a><a href="/">Open Energy Dashboard ↗</a></nav></div>
  <div class="sub" id="status"><span class="pill"><i></i>Loading…</span></div>
</div>
<div class="wrap" id="wrap"><nav class="side" id="side" aria-label="Site pages"></nav><main><div id="content"></div><div id="fw" class="fw" hidden></div></main></div>
<div class="tip" id="tip"></div>
<script>
const m = location.pathname.match(/^\/live\/([a-z0-9-]+)\/?$/);
const site = m ? m[1] : null;
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = ['#2a78d6', '#eb6834', '#1baf7a'];   // L1, L2, L3 / series order, never cycled
const num = x => { const v = parseFloat(x); return isFinite(v) ? v : null; };

// Decimals and unit by value name (the part after the device or sensor id)
const FMT = {p: [1, 'kW'], s: [1, 'kVA'], q: [1, 'kVAr'], pf: [2, ''], f: [2, 'Hz'], v1: [1, 'V'], v2: [1, 'V'], v3: [1, 'V'],
  v12: [0, 'V'], v23: [0, 'V'], v31: [0, 'V'], i1: [1, 'A'], i2: [1, 'A'], i3: [1, 'A'], p1: [1, 'kW'], p2: [1, 'kW'], p3: [1, 'kW'],
  e: [0, 'kWh'], eq: [0, 'kVArh'], t: [1, '°C'], rh: [0, '%']};
const part = k => k.slice(k.indexOf('_') + 1).replace(/_(min|max)$/, '');
const fmt = (k, v) => { if (v === null || v === undefined) return '–'; const f = FMT[part(k)]; return f ? v.toFixed(f[0]) : String(+v.toFixed(3)); };
const unitOf = k => (FMT[part(k)] || [0, ''])[1];
const cleanLabel = lab => lab.replace(/\s*\(C\)\s*$/, ' temperature').replace(/\s*\(%RH\)\s*$/, ' humidity')
  .replace(/\s*\((kW|kVA|Hz|A|V)\)\s*$/, '');

function dewPoint(t, rh) {   // same formula as the alarms (server/app/alarms.py)
  if (t === null || rh === null || rh <= 0) return null;
  const a = 17.62, b = 243.12, g = Math.log(rh / 100) + a * t / (b + t);
  return b * g / (a - g);
}

function localTime(iso, offH, withDate = true) {
  if (!iso) return '–';
  const s = new Date(Date.parse(iso) + (offH || 0) * 3600e3).toISOString();
  return withDate ? s.slice(0, 16).replace('T', ' ') : s.slice(11, 19);
}

// Sparkline: one or more series over the last 60 minutes, hover shows the values at that time
const SPARKS = {};
let sparkId = 0;
function spark(series, times, {tall = false, unitKey} = {}) {
  const all = series.flatMap(s => s.pts).filter(v => v !== null);
  if (all.length < 2) return '<div class="range">History builds up over the next minutes</div>';
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const n = times.length, H = tall ? 60 : 36, X = i => (n > 1 ? i / (n - 1) * 100 : 50), Y = v => (H - 2) - (v - lo) / (hi - lo) * (H - 4);
  const paths = series.map(s => {
    let d = '';
    s.pts.forEach((v, i) => { if (v !== null) d += `${d && s.pts[i - 1] !== null ? 'L' : 'M'}${X(i).toFixed(2)},${Y(v).toFixed(2)}`; });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  }).join('');
  const id = 'sp' + (++sparkId);
  SPARKS[id] = {series, times, unitKey};
  return `<svg class="spark${tall ? ' tall' : ''}" id="${id}" viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img" aria-label="last 60 minutes">
    ${paths}<line class="xh" y1="0" y2="${H}" stroke="#7b8794" stroke-dasharray="2 2" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>`;
}
document.addEventListener('mousemove', ev => {
  if (ev.target.closest && ev.target.closest('svg.chart')) return;   // the history charts have their own tooltip
  const svg = ev.target.closest && ev.target.closest('svg.spark'), tip = el('tip');
  document.querySelectorAll('svg.spark .xh').forEach(l => { if (!svg || l.parentNode !== svg) l.setAttribute('visibility', 'hidden'); });
  if (!svg || !SPARKS[svg.id]) { tip.style.display = 'none'; return; }
  const sp = SPARKS[svg.id], r = svg.getBoundingClientRect(), n = sp.times.length;
  const i = Math.max(0, Math.min(n - 1, Math.round((ev.clientX - r.left) / r.width * (n - 1))));
  const xh = svg.querySelector('.xh'), x = n > 1 ? i / (n - 1) * 100 : 50;
  xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
  tip.innerHTML = `<b>${esc(sp.times[i])}</b>` + sp.series.map(s => `<div>${sp.series.length > 1 ? `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:5px"></span>${esc(s.name)}: ` : ''}<b>${fmt(sp.unitKey || s.key, s.pts[i])}</b> ${esc(unitOf(sp.unitKey || s.key))}</div>`).join('');
  tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (ev.clientY + 14) + 'px';
});

function card(label, key, v, pts, times, extra = '') {
  const vals = pts.filter(x => x !== null);
  const range = vals.length > 1 ? `<div class="range">60 min: ${fmt(key, Math.min(...vals))} – ${fmt(key, Math.max(...vals))} ${esc(unitOf(key))}</div>` : '';
  return `<div class="card"><div class="k">${esc(label)}</div><div class="v">${fmt(key, v)}<small>${esc(unitOf(key))}</small></div>${extra}${range}
    ${spark([{key, name: label, color: C[0], pts}], times)}</div>`;
}

function meter(frac, text) {
  if (frac === null || !isFinite(frac)) return '';
  const pct = Math.max(0, frac * 100), cls = pct >= 90 ? 'bad' : pct >= 75 ? 'warn' : '';
  return `<div class="meter"><b class="${cls}" style="width:${Math.min(100, pct).toFixed(1)}%"></b></div><div class="range">${pct.toFixed(0)} % ${esc(text)}</div>`;
}

async function loadSite() {
  for (const k in SPARKS) delete SPARKS[k];
  const j = await (await fetch(`/api/v1/live/${site}`, {cache: 'no-store'})).json();
  const prof = j.profile || {}; PROF = prof;
  const labels = prof.labels || {}, off = prof.utc_offset_h ?? 8, sensors = prof.sensors || {};
  const wanted = (prof.live && prof.live.values) || null;
  const name = prof.name || site;
  document.title = `Live: ${name}`;
  el('title').textContent = name;
  let html = '', worst = null;

  // Open alarms first
  const al = j.alarms || [];
  const icon = {critical: '!', warning: '▲', info: 'i'};
  if (al.length) {
    html += '<h2>Open alarms</h2>';
    for (const a of al) html += `<div class="alarm ${esc(a.severity)}"><div class="ic">${icon[a.severity] || 'i'}</div><div>
      <div class="t">${esc(a.id)} ${esc(a.name)} <span class="sev ${esc(a.severity)}">${esc(a.severity)}</span></div>
      <div class="d">since ${localTime(a.since, off)} · worst ${esc(a.worst ?? '–')} ${esc(a.unit)}</div></div></div>`;
  } else html += '<div style="margin-top:4px;display:inline-block"><span class="okline">✓ No open alarm</span></div>';
  html += await wxStrip();

  const devs = Object.keys(j.devices || {});
  if (!devs.length) html += '<h2>Now</h2><div class="empty">No live data for this site (logger offline or not installed yet).</div>';

  for (const dev of devs) {
    const d = j.devices[dev], vals = d.last.values || {}, sys = d.last.sys || {};
    worst = Math.max(worst ?? 0, d.age_s);
    const times = d.history.map(h => localTime(h.ts, off, false));
    const H = k => d.history.map(h => num(h.values[k]));
    const V = k => num(vals[k]);
    const keys = (wanted || Object.keys(vals)).filter(k => k in vals);
    const used = new Set();
    const has = k => keys.includes(k);
    const L = (k, dflt) => cleanLabel(labels[k] || dflt || k);
    const meters = [...new Set(keys.map(k => k.split('_')[0]).filter(p => /^EM\d+$/.test(p)))];
    if (devs.length > 1) html += `<h2 style="font-size:.9rem;color:var(--ink)">${esc(dev)}</h2>`;

    for (const M of meters) {
      // Power: the headline values
      let g = '';
      if (has(`${M}_p`)) { used.add(`${M}_p`); g += card(L(`${M}_p`, 'Total power'), `${M}_p`, V(`${M}_p`), H(`${M}_p`), times); }
      if (has(`${M}_s`)) { used.add(`${M}_s`);
        g += card(L(`${M}_s`, 'Apparent power'), `${M}_s`, V(`${M}_s`), H(`${M}_s`), times,
          prof.contracted_kva ? meter(V(`${M}_s`) / prof.contracted_kva, `of the ${prof.contracted_kva} kVA PLN contract`) : ''); }
      for (const [k, dl] of [['pf', 'Power factor'], ['f', 'Frequency']])
        if (has(`${M}_${k}`)) { used.add(`${M}_${k}`); g += card(L(`${M}_${k}`, dl), `${M}_${k}`, V(`${M}_${k}`), H(`${M}_${k}`), times); }
      if (g) html += `<h2>Power${meters.length > 1 ? ' · ' + esc(M) : ''}</h2><div class="grid">${g}</div>`;

      // Per phase: voltage and current, three lines in one card each
      let ph = '';
      for (const [q, title] of [['v', 'Voltage L-N'], ['i', 'Current']]) {
        const ks = [1, 2, 3].map(n => `${M}_${q}${n}`);
        if (!ks.some(has)) continue;
        ks.forEach(k => used.add(k));
        const cur = ks.map(V);
        let rows = `<div></div><div class="h">L1</div><div class="h">L2</div><div class="h">L3</div><div class="l">now</div>` +
          cur.map((v, n) => `<div class="n"><span class="sw" style="background:${C[n]}"></span>${fmt(ks[n], v)}</div>`).join('');
        const hist = ks.map(H);
        rows += `<div class="l">60 min</div>` + hist.map((h, n) => { const x = h.filter(v => v !== null);
          return `<div class="h">${x.length ? fmt(ks[n], Math.min(...x)) + '–' + fmt(ks[n], Math.max(...x)) : '–'}</div>`; }).join('');
        let extra = '';
        if (q === 'i') {   // against the PLN per-phase limit (contract kVA / 3 / contract voltage), else the breaker
          const mx = Math.max(...cur.filter(v => v !== null));
          const pln = prof.contracted_kva && prof.contract_v_ln ? prof.contracted_kva * 1000 / 3 / prof.contract_v_ln : null;
          if (pln) extra = meter(mx / pln, `of the ${pln.toFixed(0)} A PLN phase limit (highest phase)`);
          else if (prof.rated_a) extra = meter(mx / prof.rated_a, `of the ${prof.rated_a} A main breaker (highest phase)`);
        }
        if (q === 'v' && prof.nominal_v) extra = `<div class="range">nominal ${prof.nominal_v} V</div>`;
        ph += `<div class="card"><div class="k">${title} (${unitOf(ks[0])})</div><div class="phase">${rows}</div>${extra}
          ${spark(ks.map((k, n) => ({key: k, name: 'L' + (n + 1), color: C[n], pts: hist[n]})), times, {tall: true})}</div>`;
      }
      if (ph) html += `<h2>Per phase${meters.length > 1 ? ' · ' + esc(M) : ''}</h2><div class="grid wide">${ph}</div>`;
    }

    // Environment: each sensor, then the room-minus-outdoor difference and the outdoor dew point
    const ths = [...new Set(keys.map(k => k.split('_')[0]).filter(p => /^TH\d+$/.test(p)))];
    let env = '';
    for (const S of ths) for (const q of ['t', 'rh']) {
      const k = `${S}_${q}`; if (!has(k)) continue; used.add(k);
      env += card(L(k, `${S} ${q}`), k, V(k), H(k), times);
    }
    if (has('TH1_t') && has('TH2_t')) {
      const diff = d.history.map(h => { const a = num(h.values.TH1_t), b = num(h.values.TH2_t); return a !== null && b !== null ? a - b : null; });
      const now = V('TH1_t') !== null && V('TH2_t') !== null ? V('TH1_t') - V('TH2_t') : null;
      env += card('Room minus outdoor', 'TH_t', now, diff, times);
    }
    if (has('TH2_t') && has('TH2_rh')) {

// Time axis helpers: "YYYY-MM-DD HH:MM" (hotel time) as a number, no time zone conversion
const tp = s => { const [d, h] = s.split(' '); const [Y, Mo, Da] = d.split('-').map(Number); const [hh, mm] = (h || '0:0').split(':').map(Number);
  return Date.UTC(Y, Mo - 1, Da, hh, mm); };
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fdate = ms => { const d = new Date(ms); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONS[d.getUTCMonth()]}`; };
const fhm = ms => new Date(ms).toISOString().slice(11, 16);
const isoDay = ms => new Date(ms).toISOString().slice(0, 10);
function nice(lo, hi, n = 5) {
  const sp = hi - lo || 1, s0 = sp / n, p = Math.pow(10, Math.floor(Math.log10(s0)));
  const st = [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= s0);
  const t = []; for (let v = Math.floor(lo / st) * st; v <= Math.ceil(hi / st) * st + st / 2; v += st) t.push(+v.toFixed(6));
  return t;
}
let CW = 900, CH = 320;
const CM = {l: 50, r: 14, t: 10, b: 34};
const sizeTo = box => { CW = Math.max(320, Math.round(box.clientWidth - 24)); CH = CW < 600 ? 240 : 320; };
function showTip(ev, html) {
  const tip = el('tip'); tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
}
const hideTip = () => { el('tip').style.display = 'none'; };

// Line chart, one y axis; series = [{name, color, pts: [[ms, value], ...], width}]
function lineChart(box, series, {unit, yZero = false, gapMs = 2 * 36e5, digits = 1, step = 36e5}) {
  sizeTo(box);
  const vals = series.flatMap(s => s.pts.map(p => p[1])).filter(v => v !== null);
  const xs = series.flatMap(s => s.pts.map(p => p[0]));
  if (vals.length < 2) { box.innerHTML = '<div class="card k">No records for this period.</div>'; return; }
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const yt = nice(yZero ? 0 : Math.min(...vals), Math.max(...vals)), y0 = yt[0], y1 = yt[yt.length - 1];
  const X = v => CM.l + (v - x0) / ((x1 - x0) || 1) * (CW - CM.l - CM.r), Y = v => CH - CM.b - (v - y0) / ((y1 - y0) || 1) * (CH - CM.t - CM.b);
  const spanD = (x1 - x0) / 864e5;
  let g = '';
  for (const v of yt) g += `<line class="gl" x1="${CM.l}" x2="${CW - CM.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${CM.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  const nt = Math.max(3, Math.floor(CW / 110));   // about one label per 110 px
  const tick = spanD > 1.5 ? 864e5 * Math.max(1, Math.ceil(spanD / nt)) : 36e5 * Math.max(1, Math.ceil(24 / nt));
  for (let v = Math.ceil(x0 / tick) * tick; v <= x1; v += tick)
    g += `<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="${CM.t}" y2="${CH - CM.b}"/><text x="${X(v)}" y="${CH - CM.b + 16}" text-anchor="middle">${spanD > 1.5 ? fdate(v) : fhm(v)}</text>`;
  const paths = series.map(s => { let d = '', prev = null;
    for (const [t, v] of s.pts) { if (v === null) { prev = null; continue; }
      d += `${prev === null || t - prev > gapMs ? 'M' : 'L'}${X(t).toFixed(1)},${Y(v).toFixed(1)}`; prev = t; }
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round"/>`; }).join('');
  box.innerHTML = `${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}
    <svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))}">
    <g class="ax">${g}<text x="12" y="${(CH - CM.b + CM.t) / 2}" transform="rotate(-90 12 ${(CH - CM.b + CM.t) / 2})" text-anchor="middle">${esc(unit)}</text></g>
    ${paths}<line class="xh" y1="${CM.t}" y2="${CH - CM.b}" stroke="#7b8794" stroke-dasharray="3 3" visibility="hidden"/><g class="dots"></g>
    <rect x="${CM.l}" y="${CM.t}" width="${CW - CM.l - CM.r}" height="${CH - CM.t - CM.b}" fill="transparent"/></svg>`;
  const svg = box.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots');
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), t = x0 + ((ev.clientX - r.left) / r.width * CW - CM.l) / (CW - CM.l - CM.r) * (x1 - x0);
    let rows = '', dd = '', ref = null;
    for (const s of series) {
      let best = null; for (const p of s.pts) if (p[1] !== null && (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
      if (!best || Math.abs(best[0] - t) > gapMs) continue; ref = ref ?? best[0];
      dd += `<circle cx="${X(best[0])}" cy="${Y(best[1])}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
      rows += `<div>${series.length > 1 ? `<span class="sq" style="background:${s.color}"></span>${esc(s.name)}: ` : ''}<b>${best[1].toFixed(digits)}</b> ${esc(unit)}${s.extra ? s.extra(best) : ''}</div>`;
    }
    if (ref === null) { hideTip(); return; }
    dots.innerHTML = dd; xh.setAttribute('x1', X(ref)); xh.setAttribute('x2', X(ref)); xh.setAttribute('visibility', 'visible');
    showTip(ev, `<b>${fdate(ref)} ${fhm(ref)}${step > 6e4 ? '–' + fhm(ref + step) : ''}</b>${rows}`);
  });
  svg.addEventListener('mouseleave', () => { hideTip(); dots.innerHTML = ''; xh.setAttribute('visibility', 'hidden'); });
}

// Bar chart, one bar per item: [{v, l1, l2, tip, light}]
function barChart(box, bars, unit) {
  sizeTo(box);
  if (!bars.length) { box.innerHTML = '<div class="card k">No records for this period.</div>'; return; }
  const yt = nice(0, Math.max(...bars.map(b => b.v)) || 1), y1 = yt[yt.length - 1], bw = (CW - CM.l - CM.r) / bars.length;
  const Y = v => CH - CM.b - v / y1 * (CH - CM.t - CM.b);
  let g = '', b = '';
  for (const v of yt) g += `<line class="gl" x1="${CM.l}" x2="${CW - CM.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${CM.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  bars.forEach((d, i) => {
    const x = CM.l + i * bw + 1, w = Math.max(2, bw - 2), y = Y(d.v), r = Math.min(4, w / 2, CH - CM.b - y);
    b += `<path d="M${x},${CH - CM.b}V${y + r}q0,${-r} ${r},${-r}h${w - 2 * r}q${r},0 ${r},${r}V${CH - CM.b}Z" fill="${d.light ? '#9ec5f4' : C[0]}"/>`;
    if (i % Math.ceil(26 / bw) === 0) b += `<text x="${x + w / 2}" y="${CH - CM.b + 14}" text-anchor="middle" font-size="10.5" fill="#7b8794">${esc(d.l1)}</text><text x="${x + w / 2}" y="${CH - CM.b + 27}" text-anchor="middle" font-size="10.5" fill="#7b8794">${esc(d.l2)}</text>`;
    b += `<rect data-i="${i}" x="${CM.l + i * bw}" y="${CM.t}" width="${bw}" height="${CH - CM.t - CM.b}" fill="transparent"/>`;
  });
  box.innerHTML = `<svg class="chart" viewBox="0 0 ${CW} ${CH + 6}" role="img" aria-label="${esc(unit)} per bar"><g class="ax">${g}
    <text x="12" y="${CH / 2}" transform="rotate(-90 12 ${CH / 2})" text-anchor="middle">${esc(unit)}</text></g>${b}</svg>`;
  const svg = box.querySelector('svg');
  svg.addEventListener('mousemove', ev => { const i = ev.target.dataset && ev.target.dataset.i; if (i === undefined) return hideTip(); showTip(ev, bars[i].tip); });
  svg.addEventListener('mouseleave', hideTip);
}

const statTile = (k, v, unit, note = '') => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${v}<small>${esc(unit)}</small></div>${note ? `<div class="range">${note}</div>` : ''}</div>`;
const spanPicker = () => `<div class="seg">${[7, 14, 31].map(d => `<button data-span="${d}" class="${d === span ? 'on' : ''}">${d} days</button>`).join('')}</div>`;
const sensorName = k => (PROF.labels?.[k] || k).replace(/\s*\(.*\)\s*$/, '');
function frame(title, note, tools = '') {
  return `<div class="vhead"><div><h2 class="vt">${esc(title)}</h2><div class="vn">${note}</div></div>${tools}</div>`;
}
function byDay(rows) {   // local date -> {kwh, minutes, peak, peakT, tmin, tmax}
  const d = {};
  for (const r of rows) {
    const k = r.t.slice(0, 10), o = d[k] ??= {kwh: 0, minutes: 0, peak: null, peakT: '', tmin: null, tmax: null};
    o.kwh += r.kwh; o.minutes += r.minutes;
    if (r.p_max !== undefined && (o.peak === null || r.p_max > o.peak)) { o.peak = r.p_max; o.peakT = r.t.slice(11, 13) + ':00'; }
    if (r.TH1_t_min !== undefined) { o.tmin = o.tmin === null ? r.TH1_t_min : Math.min(o.tmin, r.TH1_t_min); o.tmax = o.tmax === null ? r.TH1_t_max : Math.max(o.tmax, r.TH1_t_max); }

      `<div class="grid">${statTile('Highest 15-second sample', pk ? pk.p_max.toFixed(1) : '–', 'kW', pk ? `${fdate(tp(pk.t))} ${pk.t.slice(11)}` : '')}
       ${statTile('Mean over the period', (j.hours.reduce((a, r) => a + (r.p ?? 0), 0) / (j.hours.filter(r => r.p !== undefined).length || 1)).toFixed(1), 'kW')}
       ${PROF.contracted_kva ? statTile('PLN contract', PROF.contracted_kva, 'kVA', 'apparent power, see Live now') : ''}</div>

    const j = await (await fetch(`/api/v1/history/${site}/day/${dayShown}`, {cache: 'no-store'})).json();
    const ms = tp(dayShown + ' 00:00'), d = byDay(j0.hours)[dayShown];
    const pts = j.minutes.map(m => [tp(`${dayShown} ${m[0]}`), m[1], m[2], m[3]]);
    const pk = pts.reduce((a, p) => (!a || (p[3] ?? p[1]) > (a[3] ?? a[1]) ? p : a), null);
    const tools = `<div class="seg"><button data-day="${isoDay(ms - 864e5)}">◀ ${fdate(ms - 864e5)}</button><button class="on">${fdate(ms)}</button>

    box.innerHTML = frame(`One day, minute by minute: ${fdate(ms)}`, 'Total power of every minute (mean of the 15-second samples). Hover for the minute\'s lowest and highest sample.', tools) +
      `<div class="grid">${statTile(dayShown === today ? 'Energy so far' : 'Energy', d ? d.kwh.toFixed(0) : '–', 'kWh', d && d.minutes < 1430 ? `${(d.minutes / 14.4).toFixed(0)} % of the minutes recorded` : '')}
        ${statTile('Highest 15-second sample', pk ? (pk[3] ?? pk[1]).toFixed(1) : '–', 'kW', pk ? 'at ' + fhm(pk[0]) : '')}
        ${statTile('Lowest minute', pts.length ? Math.min(...pts.map(p => p[1])).toFixed(1) : '–', 'kW', 'the base load')}</div>
       <div class="card chartbox" id="ch"></div>`;
    lineChart(el('ch'), [{name: 'Total power', color: C[0], width: 1.4, pts: pts.map(p => [p[0], p[1]]),

      {unit: 'kW', yZero: true, gapMs: 3 * 6e4, step: 6e4});
  } else if (view === 'energy') {

    const full = keys.filter(k => k !== today && days[k].minutes >= 1430);
    const avg = full.length ? full.reduce((a, k) => a + days[k].kwh, 0) / full.length : null;

       <div class="card chartbox" id="ch"></div>`;
    barChart(el('ch'), keys.map(k => { const d = days[k], ms = tp(k + ' 00:00'), part = k === today || d.minutes < 1430;
      return {v: d.kwh, light: part, l1: DAYS[new Date(ms).getUTCDay()], l2: `${new Date(ms).getUTCDate()} ${MONS[new Date(ms).getUTCMonth()]}`,
        tip: `<b>${fdate(ms)}</b>${d.kwh.toFixed(1)} kWh${part ? ` (${k === today ? 'so far' : (d.minutes / 14.4).toFixed(0) + ' % of the minutes'})` : ''}` +
          (d.peak !== null ? `<br>peak ${d.peak.toFixed(1)} kW (${d.peakT} hour)` : '') +
          (d.tmin !== null ? `<br>${esc(sensorName('TH1_t'))} ${d.tmin.toFixed(1)}–${d.tmax.toFixed(1)} °C` : '')}; }), 'kWh');
  } else if (view === 'week') {
    const j = await hourly(15), now = tp(j.now), d0 = tp(j.now.slice(0, 10) + ' 00:00');
    const w0 = d0 - new Date(d0).getUTCDay() * 864e5, lw0 = w0 - 7 * 864e5;
    const el_ = Math.floor((now - w0) / 36e5) * 36e5;   // complete hours only, the same in both weeks
    if (!el_) { box.innerHTML = frame('This week against last week', 'The week started less than an hour ago: come back after the first full hour.'); return; }
    const sum = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.kwh, 0);
    const mins = (a, b) => j.hours.filter(r => tp(r.t) >= a && tp(r.t) < b).reduce((s, r) => s + r.minutes, 0);
    const cur = sum(w0, w0 + el_), last = sum(lw0, lw0 + el_), pct = last ? (cur - last) / last * 100 : null;
    const mx = Math.max(cur, last) || 1, h = v => (v / mx * 240).toFixed(0);
    const perDay = [...Array(7).keys()].map(i => ({i, a: sum(lw0 + i * 864e5, lw0 + (i + 1) * 864e5), b: w0 + i * 864e5 <= now ? sum(w0 + i * 864e5, w0 + (i + 1) * 864e5) : null}));
    const covL = mins(lw0, lw0 + el_) / (el_ / 6e4), covT = mins(w0, w0 + el_) / (el_ / 6e4);
    const gaps = covL < 0.97 || covT < 0.97;
    const verdict = gaps ? `<div class="verdict bad">Not comparable yet: records cover ${(covL * 100).toFixed(0)} % of last week's hours and ${(covT * 100).toFixed(0)} % of this week's (logger offline or backlog not uploaded)</div>`
      : pct === null ? '' : Math.abs(pct) < 0.5 ? `<div class="verdict">About the same as last week (${pct >= 0 ? '+' : ''}${pct.toFixed(1)} %)</div>`
      : `<div class="verdict ${pct > 0 ? 'bad' : 'ok'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)} % ${pct > 0 ? 'more' : 'less'} than last week</div>`;
    box.innerHTML = frame('This week against last week', `Weeks start on Sunday 00:00. The complete hours of this week so far, against the same ${(el_ / 36e5).toFixed(0)} hours of last week.`) +
      `<div class="card"><div class="cmp">
        <div><div class="range">${last.toFixed(0)} kWh</div><div class="cbar" style="height:${h(last)}px;background:#86b6ef"></div><div class="k">Last week<br><small>${fdate(lw0)} – ${fdate(lw0 + el_)} ${fhm(lw0 + el_)}</small></div></div>
        <div><div class="range">${cur.toFixed(0)} kWh</div><div class="cbar" style="height:${h(cur)}px;background:${C[0]}"></div><div class="k">This week so far<br><small>${fdate(w0)} – ${fdate(w0 + el_)} ${fhm(w0 + el_)}</small></div></div>
       </div>${verdict}</div>
       <h2>Day by day</h2><table><tr><th>Day</th><th>Last week</th><th>This week</th><th>Change</th></tr>${perDay.map(r => {
         const ch = r.b === null || !r.a ? '' : ((r.b - r.a) / r.a * 100);
         return `<tr><td>${DAYS[r.i]}</td><td>${r.a ? r.a.toFixed(0) + ' kWh' : '–'}</td><td>${r.b === null ? '–' : r.b.toFixed(0) + ' kWh' + (w0 + (r.i + 1) * 864e5 > now ? ' so far' : '')}</td>
           <td>${ch === '' || w0 + (r.i + 1) * 864e5 > now ? '' : `<span class="${ch > 0.5 ? 'bad' : ch < -0.5 ? 'ok' : ''}">${ch >= 0 ? '+' : ''}${ch.toFixed(1)} %</span>`}</td></tr>`; }).join('')}</table>`;
  } else if (view === 'temperature' || view === 'humidity') {
    const j = await hourly(span), q = view === 'temperature' ? 't' : 'rh', unit = q === 't' ? '°C' : '% RH';
    const ids = [...new Set(j.hours.flatMap(r => Object.keys(r)).filter(k => /^TH\d+_/.test(k)).map(k => k.split('_')[0]))].sort();
    const series = ids.map((id, n) => ({name: sensorName(`${id}_${q}`), color: C[n] || '#7b8794',
      pts: j.hours.map(r => [tp(r.t), r[`${id}_${q}`] ?? null]),
      extra: b => { const r = j.hours.find(x => tp(x.t) === b[0]); return r && r[`${id}_${q}_min`] !== undefined ? ` <span class="range">(${r[`${id}_${q}_min`].toFixed(q === 't' ? 1 : 0)}–${r[`${id}_${q}_max`].toFixed(q === 't' ? 1 : 0)})</span>` : ''; }}));
    let tiles = '';
    for (const s of series) { const v = s.pts.map(p => p[1]).filter(x => x !== null);
      if (v.length) tiles += statTile(`${s.name}: lowest – highest`, `${Math.min(...v).toFixed(q === 't' ? 1 : 0)} – ${Math.max(...v).toFixed(q === 't' ? 1 : 0)}`, unit, 'hourly means'); }
    box.innerHTML = frame(view === 'temperature' ? 'Temperature' : 'Relative humidity',
      `Hourly means of the 5-minute readings; hover for the hour's lowest and highest. ${esc(Object.entries(PROF.sensors || {}).map(([k, v]) => `${k}: ${v}`).join(' · '))}. Last ${span} days.`, spanPicker()) +
      `<div class="grid">${tiles}</div><div class="card chartbox" id="ch"></div>`;
    lineChart(el('ch'), series, {unit, digits: q === 't' ? 1 : 0});
  }
}

// ------------------------------------------------------------------ weather (server/app/weather.py, docs/WEATHER.md)
// GET /api/v1/weather/<site>: the last Open-Meteo forecast (fetched every hour by the service), today and tomorrow per hour.
// GET /api/v1/weather/<site>/log?days=N: the actual weather of each past hour, with the forecast made the day before.
// Rows are hotel hours "YYYY-MM-DD HH:00" (the hour from HH:00 to HH+1:00), like the history rows: they join on "t".
let WXC = null, WXL = {};
async function wxNow() {
  if (WXC && Date.now() - WXC.at < 300e3) return WXC.j;
  const j = await (await fetch(`/api/v1/weather/${site}`, {cache: 'no-store'})).json();
  WXC = {at: Date.now(), j};
  return j;
}
async function wxLog(days) {
  const c = WXL[days];
  if (c && Date.now() - c.at < 300e3) return c.j;
  const j = await (await fetch(`/api/v1/weather/${site}/log?days=${days}`, {cache: 'no-store'})).json();
  WXL[days] = {at: Date.now(), j};
  return j;
}
function wxIcon(code, day = 1) {   // WMO weather code -> symbol
  if (code === null || code === undefined) return '';
  const i = code <= 1 ? (day === 0 ? '🌙' : '☀️') : code === 2 ? (day === 0 ? '☁️' : '⛅') : code === 3 ? '☁️' : code <= 48 ? '🌫️'
    : code <= 57 ? '🌦️' : code <= 67 || (code >= 80 && code <= 82) ? '🌧️' : code <= 86 ? '🌨️' : '⛈️';
  return `<span class="wxi" aria-hidden="true">${i}</span>`;
}
const f1 = (v, d = 1) => v === null || v === undefined ? '–' : (+v).toFixed(d);
const compass = d => d === null || d === undefined ? '' : ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(d / 45) % 8];
const outId = () => (Object.entries(PROF.sensors || {}).find(([, v]) => /outdoor|outside/i.test(v)) || ['TH2'])[0];
const wxSource = j => `${esc(j.source || 'Open-Meteo')}, model ${esc(j.model || 'best_match')}, ${f1(j.lat, 3)}, ${f1(j.lon, 3)}` +
  (j.fetched ? `, updated ${localTime(j.fetched, PROF.utc_offset_h ?? 8, false).slice(0, 5)} hotel time` : '');
function wxMissing(j, title) {
  if (j.hours && j.hours.length) return '';
  const how = `docker compose exec ingest python tools/manage.py weather ${esc(site)} --lat -8.xxxx --lon 115.xxxx`;
  return frame(title, '') + (j.enabled
    ? `<div class="empty">No forecast fetched yet${j.error ? ': ' + esc(j.error) : ' (the service fetches it within a minute of starting, then every hour)'}.</div>`
    : `<div class="card">Weather is not set for this site. On the VPS, with the site's position (decimal degrees, south negative):
       <pre style="white-space:pre-wrap">${how}</pre>See docs/WEATHER.md.</div>`);
}
async function measuredOutdoor(days) {   // hotel hour -> {t, min, max} of the outdoor sensor, from the day files
  const O = outId(), m = {};
  try { for (const r of (await hourly(days)).hours) if (r[`${O}_t`] !== undefined) m[r.t] = {t: r[`${O}_t`], min: r[`${O}_t_min`], max: r[`${O}_t_max`]}; }
  catch (e) {}
  return m;
}
function wxTable(rows, nowT, meas = null) {
  const hr = nowT.slice(0, 13) + ':00';
  let h = `<table><tr><th>Hour</th><th>Weather</th><th>Temp.</th><th class="hide-s">Feels like</th><th>Rain · chance</th>
    <th class="hide-s">Humidity</th><th class="hide-s">Cloud</th><th class="hide-s">Wind</th><th class="hide-s">Sun</th>${meas ? `<th>Measured ${esc(outId())}</th>` : ''}</tr>`;
  for (const r of rows) {
    const cls = r.t < hr ? 'past' : r.t === hr ? 'cur' : '';
    h += `<tr class="${cls}"><td>${r.t.slice(11)}${r.t === hr ? ' now' : ''}</td><td>${wxIcon(r.code, r.is_day)}${esc(r.condition)}</td><td>${f1(r.temp_c)} °C</td>
      <td class="hide-s">${f1(r.feels_c)} °C</td><td>${r.precip_mm ? f1(r.precip_mm) + ' mm' : '0'}${r.precip_prob_pct !== null && r.precip_prob_pct !== undefined ? ` · ${r.precip_prob_pct} %` : ''}</td>
      <td class="hide-s">${f1(r.rh_pct, 0)} %</td><td class="hide-s">${f1(r.cloud_pct, 0)} %</td><td class="hide-s">${f1(r.wind_kmh, 0)} km/h ${compass(r.wind_dir)}</td>
      <td class="hide-s">${f1(r.rad_wm2, 0)} W/m²</td>${meas ? `<td>${meas[r.t] ? f1(meas[r.t].t) + ' °C' : ''}</td>` : ''}</tr>`;
  }
  return h + '</table>';
}
function rainBars(box, rows, nowT) {
  const hr = nowT.slice(0, 13) + ':00';
  barChart(box, rows.map(r => ({v: r.precip_mm ?? 0, light: r.t < hr, l1: r.t.slice(11, 13), l2: r.precip_prob_pct !== null && r.precip_prob_pct !== undefined ? r.precip_prob_pct + '%' : '',
    tip: `<b>${r.t.slice(11)}–${String(+r.t.slice(11, 13) + 1).padStart(2, '0')}:00</b>${wxIcon(r.code, r.is_day)}${esc(r.condition)}<br>${f1(r.precip_mm, 1)} mm` +
      (r.precip_prob_pct !== null && r.precip_prob_pct !== undefined ? `, chance ${r.precip_prob_pct} %` : '')})), 'mm');
}
async function wxStrip() {   // one line on "Live now"
  try {
    const j = await wxNow(), c = j.current;
    if (!c) return '';
    const today = j.now.slice(0, 10), d = (j.days || []).find(x => x.date === today), t = (j.days || []).find(x => x.date > today);
    return `<a class="wxline" href="#wtoday">${wxIcon(c.code, c.is_day)}<span><b>${f1(c.temp_c, 0)} °C</b> ${esc(c.condition)}</span>` +
      (d ? `<span>today ${f1(d.tmin_c, 0)}–${f1(d.tmax_c, 0)} °C, rain ${f1(d.precip_mm)} mm</span>` : '') +
      (t ? `<span>tomorrow ${wxIcon(t.code)}${f1(t.tmin_c, 0)}–${f1(t.tmax_c, 0)} °C</span>` : '') + '</a>';
  } catch (e) { return ''; }
}

const WXVIEWS = {
  async wtoday(box) {
    const j = await wxNow(), miss = wxMissing(j, 'Weather today');
    if (miss) { box.innerHTML = miss; return; }
    const today = j.now.slice(0, 10), rows = j.hours.filter(r => r.t.startsWith(today)), d = (j.days || []).find(x => x.date === today) || {};
    const c = j.current || {}, meas = await measuredOutdoor(2), O = outId();
    const next = rows.find(r => r.t > j.now && ((r.precip_prob_pct ?? 0) >= 50 || (r.precip_mm ?? 0) >= 0.3));
    const lastM = Object.keys(meas).filter(k => k.startsWith(today)).sort().pop();
    box.innerHTML = frame('Weather today, hour by hour', `Forecast for the hotel's position: ${wxSource(j)}. Past hours in grey. ` +
        `Measured: hourly mean of the logger's outdoor sensor (${esc(O)}).`) +
      `<div class="grid">${statTile('Now · ' + (c.condition || ''), `${wxIcon(c.code, c.is_day)}${f1(c.temp_c)}`, '°C', `feels like ${f1(c.feels_c)} °C · ${f1(c.rh_pct, 0)} % RH · wind ${f1(c.wind_kmh, 0)} km/h`)}
        ${statTile('Today, lowest – highest', `${f1(d.tmin_c, 0)} – ${f1(d.tmax_c, 0)}`, '°C', `${wxIcon(d.code)}${esc(d.condition || '')}`)}
        ${statTile('Rain today', f1(d.precip_mm), 'mm', `chance up to ${f1(d.precip_prob_pct, 0)} %${next ? ` · likely from ${next.t.slice(11)}` : ''}`)}
        ${statTile('Sun', f1(d.sun_kwh_m2), 'kWh/m²', `sunrise ${esc(d.sunrise || '–')} · sunset ${esc(d.sunset || '–')} · UV ${f1(d.uv)}`)}
        ${lastM ? statTile(`Measured outdoor, ${lastM.slice(11)} hour`, f1(meas[lastM].t), '°C', `forecast for that hour ${f1((rows.find(r => r.t === lastM) || {}).temp_c)} °C`) : ''}</div>
      <h2>Temperature</h2><div class="card chartbox" id="ch"></div><h2>Rain per hour · chance under the bar</h2><div class="card chartbox" id="ch2"></div>
      <h2>Hour by hour</h2>${wxTable(rows, j.now, Object.keys(meas).length ? meas : null)}
      <div class="foot">Weather data: ${esc(j.source)}. Rain and sun of the hour from HH:00 to HH+1:00; temperature, humidity and wind: mean of the hour.</div>`;
    const series = [{name: 'Forecast', color: C[1], pts: rows.map(r => [tp(r.t), r.temp_c])},
      {name: 'Feels like', color: '#c4cad3', width: 1.4, pts: rows.map(r => [tp(r.t), r.feels_c])}];
    if (Object.keys(meas).length) series.unshift({name: `Measured outdoor (${O})`, color: C[0], pts: rows.map(r => [tp(r.t), meas[r.t] ? meas[r.t].t : null])});
    lineChart(el('ch'), series, {unit: '°C'});
    rainBars(el('ch2'), rows, j.now);
  },

  async wtomorrow(box) {
    const j = await wxNow(), miss = wxMissing(j, 'Weather tomorrow');
    if (miss) { box.innerHTML = miss; return; }
    const today = j.now.slice(0, 10), tom = isoDay(tp(today + ' 00:00') + 864e5);
    const rows = j.hours.filter(r => r.t.startsWith(tom)), d = (j.days || []).find(x => x.date === tom) || {}, dt = (j.days || []).find(x => x.date === today) || {};
    const diff = d.tmax_c !== undefined && dt.tmax_c !== undefined && d.tmax_c !== null && dt.tmax_c !== null ? d.tmax_c - dt.tmax_c : null;
    const hot = rows.reduce((a, r) => (r.temp_c !== null && (!a || r.temp_c > a.temp_c) ? r : a), null);
    const wet = rows.filter(r => (r.precip_prob_pct ?? 0) >= 50).map(r => r.t.slice(11, 13));
    box.innerHTML = frame(`Weather tomorrow: ${fdate(tp(tom + ' 00:00'))}`, `Forecast: ${wxSource(j)}. ` +
        `Saved every day at ${String(j.dayahead_hour ?? 18).padStart(2, '0')}:00 hotel time in the day-ahead log, to compare with the actual weather (Weather log).`) +
      `<div class="grid">${statTile('Tomorrow', `${wxIcon(d.code)}${f1(d.tmin_c, 0)} – ${f1(d.tmax_c, 0)}`, '°C', esc(d.condition || ''))}
        ${statTile('Highest against today', diff === null ? '–' : (diff >= 0 ? '+' : '') + diff.toFixed(1), '°C', hot ? `warmest hour ${hot.t.slice(11)} (${f1(hot.temp_c)} °C)` : '')}
        ${statTile('Rain', f1(d.precip_mm), 'mm', `chance up to ${f1(d.precip_prob_pct, 0)} %${wet.length ? ` · likely ${wet[0]}:00–${String(+wet[wet.length - 1] + 1).padStart(2, '0')}:00` : ''}`)}
        ${statTile('Sun', f1(d.sun_kwh_m2), 'kWh/m²', `sunrise ${esc(d.sunrise || '–')} · sunset ${esc(d.sunset || '–')} · UV ${f1(d.uv)}`)}</div>
      <h2>Temperature</h2><div class="card chartbox" id="ch"></div><h2>Rain per hour · chance under the bar</h2><div class="card chartbox" id="ch2"></div>
      <h2>Hour by hour</h2>${wxTable(rows, j.now)}
      <div class="foot">Weather data: ${esc(j.source)}. A forecast more than a day ahead is less sure: it changes with each update (every hour).</div>`;
    lineChart(el('ch'), [{name: 'Forecast', color: C[1], pts: rows.map(r => [tp(r.t), r.temp_c])},
      {name: 'Feels like', color: '#c4cad3', width: 1.4, pts: rows.map(r => [tp(r.t), r.feels_c])}], {unit: '°C'});
    rainBars(el('ch2'), rows, j.now);
  },

  async wlog(box) {
    const [lg, j, meas] = await Promise.all([wxLog(span), wxNow(), measuredOutdoor(span)]);
    if (!lg.hours.length) { box.innerHTML = wxMissing(j, 'Weather log') || frame('Weather log', '') +
      '<div class="card k">Nothing logged yet: an hour is logged one hour after it ends, and tomorrow\'s forecast once a day.</div>'; return; }
    let days = {}; try { days = byDay((await hourly(span)).hours); } catch (e) {}
    const O = outId(), both = lg.hours.filter(r => r.temp_c !== null && r.fc_temp_c !== null);
    const mae = both.length ? both.reduce((a, r) => a + Math.abs(r.fc_temp_c - r.temp_c), 0) / both.length : null;
    const bias = both.length ? both.reduce((a, r) => a + r.fc_temp_c - r.temp_c, 0) / both.length : null;
    const sm = lg.hours.filter(r => r.temp_c !== null && meas[r.t]);
    const sd = sm.length ? sm.reduce((a, r) => a + meas[r.t].t - r.temp_c, 0) / sm.length : null;
    const rainy = lg.days.filter(d => d.precip_mm >= 1).length, fcd = lg.days.filter(d => d.fc_hours >= 20);
    const csv = `/api/v1/weather/${esc(site)}/log?days=${span}&format=csv`;
    box.innerHTML = frame('Weather log: actual against forecast', `Actual: the weather service's value for each hour that has passed (logged one hour after it ends). ` +
        `Forecast: what was forecast for that hour the day before, at ${String(j.dayahead_hour ?? 18).padStart(2, '0')}:00. Measured: the logger's outdoor sensor (${esc(O)}). Last ${span} days.`,
        `<div style="display:flex;gap:8px;align-items:center">${spanPicker()}<a class="seg" style="padding:5px 10px;font-size:.8rem;text-decoration:none" href="${csv}">CSV ↓</a></div>`) +
      `<div class="grid">${statTile('Hours logged', lg.hours.length, '', `${both.length} with a day-ahead forecast`)}
        ${statTile('Day-ahead forecast error', mae === null ? '–' : '± ' + mae.toFixed(1), '°C', bias === null ? 'none yet: the first is saved this evening' : `mean of the hours; forecast ${bias >= 0 ? 'warmer' : 'cooler'} by ${Math.abs(bias).toFixed(1)} °C on average`)}
        ${statTile('Rain days (≥ 1 mm)', rainy, `of ${lg.days.length}`, fcd.length ? `forecast the day before: ${fcd.filter(d => d.fc_precip_mm >= 1).length} of ${fcd.length}` : '')}
        ${sd === null ? '' : statTile(`Sensor ${O} against the service`, (sd >= 0 ? '+' : '') + sd.toFixed(1), '°C', `mean over ${sm.length} hours (sun or a wall near the sensor shows here)`)}</div>
      <h2>Temperature</h2><div class="card chartbox" id="ch"></div>
      <h2>Day by day</h2><table><tr><th>Day</th><th>Weather</th><th>Temp. low – high</th><th>Rain</th><th class="hide-s">Sun</th>
        <th>Forecast the day before</th><th class="hide-s">Measured ${esc(O)}</th><th>Energy</th></tr>${lg.days.slice().reverse().map(d => {
          const mm = Object.entries(meas).filter(([k]) => k.startsWith(d.date)).map(([, v]) => v);
          const lo = mm.length ? Math.min(...mm.map(v => v.min ?? v.t)) : null, hi = mm.length ? Math.max(...mm.map(v => v.max ?? v.t)) : null;
          const e = days[d.date];
          return `<tr><td>${fdate(tp(d.date + ' 00:00'))}${d.hours < 24 ? ` <span class="range">${d.hours} h</span>` : ''}</td><td>${wxIcon(d.code)}${esc(d.condition)}</td>
            <td>${f1(d.tmin_c)} – ${f1(d.tmax_c)} °C</td><td>${f1(d.precip_mm)} mm</td><td class="hide-s">${f1(d.sun_kwh_m2)} kWh/m²</td>
            <td>${d.fc_hours ? `${wxIcon(d.fc_code)}${f1(d.fc_tmin_c)} – ${f1(d.fc_tmax_c)} °C, ${f1(d.fc_precip_mm)} mm` : '<span class="range">not saved</span>'}</td>
            <td class="hide-s">${lo === null ? '–' : `${f1(lo)} – ${f1(hi)} °C`}</td><td>${e ? e.kwh.toFixed(0) + ' kWh' : '–'}</td></tr>`; }).join('')}</table>
      <div class="foot">Weather data: ${esc(lg.source)}. Low and high are the coolest and warmest hourly means. Files on the server: sites/${esc(site)}/weather/actual-YYYY.csv and dayahead-YYYY.csv.</div>`;
    lineChart(el('ch'), [{name: 'Actual (weather service)', color: C[1], pts: lg.hours.map(r => [tp(r.t), r.temp_c])},
      {name: 'Forecast the day before', color: '#9aa5b1', width: 1.4, pts: lg.hours.map(r => [tp(r.t), r.fc_temp_c])},
      {name: `Measured outdoor (${O})`, color: C[0], width: 1.4, pts: lg.hours.map(r => [tp(r.t), meas[r.t] ? meas[r.t].t : null])}], {unit: '°C'});
  },
};

// ------------------------------------------------------------------ firmware versions (everyone; sending firmware: #firmware, admins)
// GET /api/v1/versions/<site>: running firmware per logger, the offer, every firmware change and restart (events.jsonl),
// the GitHub releases (asked by the server once an hour) and the files stored on the server.
let vfAll = false;
const BUILD = {usb: 'USB (native)', uart: 'UART'};
function bootText(r) {   // the logger's restart reason, in words
  const s = String(r || ''), [why, ver] = s.split('@');
  const w = {poweron: 'power on', ext: 'reset button', sw: 'restarted by the firmware', panic: 'crash (panic)',
    int_wdt: 'watchdog (frozen)', task_wdt: 'watchdog (task frozen)', wdt: 'watchdog', deepsleep: 'wake from sleep',
    brownout: 'supply voltage dropped (brownout)', sdio: 'SDIO reset', 'sw:ota': 'after a firmware update',
    'sw:ota_rollback': 'went back to the previous firmware', 'sw:daily': 'daily restart', 'sw:console': 'restart typed on the console',
    'sw:portal': 'restart from the setup portal', 'sw:import': 'settings imported from the SD card', 'sw:remote_regs': 'new register table',
    'sw:lowheap': 'memory low', 'sw:offline': 'no network for too long'}[why] || why || 'unknown';
  return w + (ver ? ` (firmware ${ver})` : '');
}
function fwEvent(e) {
  const by = e.by ? ` by ${esc(e.by)}` : '';
  switch (e.kind) {
    case 'firmware': return e.from ? ['Firmware changed', `<b>${esc(e.from)}</b> → <b>${esc(e.to)}</b>`] : ['First seen', `firmware <b>${esc(e.to)}</b>`];
    case 'ota_offered': return ['Update offered', `<b>${esc(e.version)}</b>${e.source ? ' from ' + esc(e.source) : ''}${by}`];
    case 'ota_cancelled': return ['Offer withdrawn', `${esc(e.version || '')}${by}`];
    case 'ota_failed': return ['Update refused by the logger', `<span class="bad">${esc(e.version)}: kept restarting, went back</span>`];
    case 'boot': return ['Restart', esc(bootText(e.reason)) + (e.record ? ` <span class="range">record ${esc(e.record.slice(11, 16))} UTC</span>` : '')];
    default: return [esc(e.kind), ''];
  }
}
async function versionsView(box) {
  const j = await (await fetch(`/api/v1/versions/${site}`, {cache: 'no-store'})).json(), off = PROF.utc_offset_h ?? 8;
  const L = j.loggers || [];
  const badge = d => d.update === 'available' ? `<span class="sev warning">${esc(j.latest)} available</span>`
    : d.update === 'up_to_date' ? '<span class="sev info">up to date</span>' : '';
  let h = frame('Firmware versions', 'What each logger runs, since when, what is offered to it, and every firmware change and restart. ' +
    `Sending a firmware: ${isAdmin ? '<a href="#firmware">Firmware update</a>' : 'Firmware update (logins in ADMIN_USERS)'}. See docs/OTA.md.`);
  h += `<div class="grid">${statTile('Latest release on GitHub', j.latest ? esc(j.latest) : '–', '',
      j.latest_published ? 'published ' + localTime(j.latest_published, off).slice(0, 10) : esc(j.releases_error || 'no release with logger files'))}` +
    L.map(d => statTile(d.device, esc(d.running || '–'), '', `${badge(d)} ${d.env ? esc(BUILD[d.env] || d.env) + ' build' : ''}`)).join('') + '</div>';
  if (!L.length) h += '<div class="card k" style="margin-top:12px">No logger registered on this site.</div>';
  for (const d of L) {
    const o = d.offer, st = {installed: '<span class="ok">installed</span>', waiting: '<span class="warn">waiting for the logger</span>',
      rolled_back: '<span class="bad">refused: the logger went back</span>', not_newer: 'not newer than the running one'}[d.state] || '';
    h += `<h2>${esc(d.device)}${d.disabled ? ' · <span class="bad">disabled</span>' : ''}</h2><div class="card"><div class="facts">
      <div>Running<b>${esc(d.running || '–')}</b></div>
      <div>Build<b>${esc(BUILD[d.env] || d.env || '–')}</b></div>
      <div>Running it since (hotel time)<b>${d.since ? localTime(d.since, off) : '–'}</b></div>
      <div>Last restart<b>${d.last_boot ? localTime(d.last_boot.ts, off) : '–'}</b>${d.last_boot ? `<span class="range">${esc(bootText(d.last_boot.reason))}</span>` : ''}</div>
      <div>Last report from the logger<b>${d.reported ? localTime(d.reported, off) : '–'}</b></div>
      <div>Remote update<b>${d.ota_on === '0' ? '<span class="bad">off (ota_on=0)</span>' : d.reported ? 'on' : '–'}</b></div>
      <div>Offered<b>${o ? esc(o.version) : 'nothing'}</b>${o ? `<span class="range">${st}${o.scope === 'default' || d.scope === 'default' ? ', to every logger' : ''}${o.by ? ', by ' + esc(o.by) : ''}</span>` : ''}</div>
      <div>Refused versions<b>${d.failed.length ? `<span class="bad">${d.failed.map(esc).join(', ')}</span>` : 'none'}</b></div>
      <div>Data format, settings, registers<b>${d.reported ? `${esc(d.schema ?? '–')} · v${esc(d.cfg_version ?? '–')} · v${esc(d.reg_version ?? '–')}` : '–'}</b><span class="range">${esc(d.reg_source || '')}</span></div>
      <div>Registered on the server<b>${d.added ? localTime(d.added, off).slice(0, 10) : '–'}</b></div>
    </div></div>`;
  }
  const rows = L.flatMap(d => d.history.map(e => ({...e, device: d.device}))).filter(e => vfAll || e.kind !== 'boot' || /ota/.test(e.reason || ''))
    .sort((a, b) => (a.ts < b.ts ? 1 : -1));
  h += `<div class="vhead" style="margin-top:22px"><h2 style="margin:0">History · hotel time</h2><div class="seg">
      <button data-vf="fw" class="${vfAll ? '' : 'on'}">Firmware only</button><button data-vf="all" class="${vfAll ? 'on' : ''}">With every restart</button></div></div>`;
  h += rows.length ? `<table><tr><th>Time</th>${L.length > 1 ? '<th>Logger</th>' : ''}<th>Event</th><th>Detail</th></tr>${rows.slice(0, 300).map(e => {
      const [what, det] = fwEvent(e);
      return `<tr><td>${localTime(e.ts, off)}</td>${L.length > 1 ? `<td>${esc(e.device)}</td>` : ''}<td>${what}</td><td>${det}</td></tr>`; }).join('')}</table>`
    : '<div class="card k">Nothing recorded yet.</div>';
  const runs = {}; for (const d of L) if (d.running) (runs[d.running] ??= []).push(d.device);
  h += `<h2>Releases on GitHub${j.releases_error ? ` · <span class="bad" style="text-transform:none;letter-spacing:0">${esc(j.releases_error)}</span>` : ''}</h2>`;
  h += (j.releases || []).length ? `<table><tr><th>Version</th><th>Published</th><th class="hide-s">Files</th><th>Running on</th></tr>${j.releases.map(r => {
      const v = String(r.tag || '').replace(/^fw-v/, '');
      return `<tr><td><b>${esc(v)}</b>${r.prerelease ? ' <span class="sev">pre-release</span>' : ''}</td><td>${r.published ? localTime(r.published, off).slice(0, 10) : '–'}</td>
        <td class="hide-s">${r.assets.map(a => esc(a.name)).join(', ')}</td><td>${(runs[v] || []).map(esc).join(', ')}</td></tr>`; }).join('')}</table>`
    : '<div class="card k">None listed.</div>';
  h += `<h2>Firmware files on the server</h2>` + ((j.files || []).length ? `<table><tr><th>File</th><th>Version</th><th>Build</th><th>Size</th></tr>${j.files.map(f =>
      `<tr><td>${esc(f.file)}</td><td>${esc(f.version)}</td><td>${esc(BUILD[f.env] || f.env)}</td><td>${Math.round(f.size / 1024)} kB</td></tr>`).join('')}</table>`
    : '<div class="card k">None yet (sent from GitHub or uploaded on Firmware update).</div>');
  box.innerHTML = h + '<div class="foot">From the server\'s records: devices.json, each logger\'s events.jsonl and settings-reported.json. GitHub is asked at most once an hour.</div>';
}

async function show(id) {
  view = VIEWS.some(v => v.id === id) ? id : 'now';
  document.querySelectorAll('#side a[data-id]').forEach(a => a.classList.toggle('on', a.dataset.id === view));
  el('fw').hidden = true;
  if (view === 'firmware') {   // the panel lives in #fw, out of reach of the 15 s refresh of #content
    el('content').innerHTML = '';
    await fwReady;
    if (view !== 'firmware') return;
    if (isAdmin) el('fw').hidden = false;
    else el('content').innerHTML = '<div class="empty">Firmware update is only for the logins listed in ADMIN_USERS on the server (docs/OTA.md).</div>';
    return;
  }
  if (view === 'now') { el('content').innerHTML = ''; return tick(); }
  el('content').innerHTML = '<div class="card k">Loading…</div>';
  try { await renderHistory(); }
  catch (e) { el('content').innerHTML = `<div class="empty">Could not read the ${WXVIEWS[view] ? 'weather' : view === 'versions' ? 'firmware versions' : 'history'} from the server.</div>`; }
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-span],button[data-day],button[data-vf]');
  if (!b) return;
  if (b.dataset.vf) vfAll = b.dataset.vf === 'all';
  if (b.dataset.span) span = +b.dataset.span;
  if (b.dataset.day) dayShown = b.dataset.day;
  show(view);
});
addEventListener('hashchange', () => show(location.hash.slice(1)));
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (site && view !== 'now' && view !== 'firmware') renderHistory().catch(() => {}); }, 300); });

// ---------------------------------------------------------------- firmware update (ADMIN_USERS only)
const fwState = {};   // device -> last view from the server
const fwPost = (url, body, json) => fetch(url, {method: 'POST', cache: 'no-store', body,
  headers: {'X-Requested-With': 'arkan', 'Content-Type': json ? 'application/json' : 'application/octet-stream'}});

function fwStatusHtml(v, off) {
  let h = `Running <b>${esc(v.running || 'unknown')}</b>${v.env ? ` (${esc(v.env)} build)` : ''}. `;
  const o = v.offer;
  if (!o) h += 'No firmware offered.';
  else {
    const who = `${o.scope === 'default' ? 'to every logger' : 'to this logger'}${o.by ? ' by ' + esc(o.by) : ''}, ${localTime(o.published, off)}`;
    const what = `<b>${esc(o.version)}</b> (${esc(o.source || o.file)}) offered ${who}`;
    h += {installed: `<span class="ok">${what}: installed.</span>`,
          waiting: `<span class="warn">${what}: waiting for the logger (within a minute if it is online, else at its next check).</span>`,
          rolled_back: `<span class="bad">${what}: the logger kept restarting on it and went back to ${esc(v.running)}. Not offered again.</span>`,
          not_newer: `${what}: not newer than the running version, nothing to do.`}[v.state] || what;
  }
  if (v.ota_on === '0') h += '<br><span class="bad">ota_on is 0 on this logger: it does not take updates (manage.py set-config ota_on=1).</span>';
  for (const e of v.events.slice(0, 6)) {
    const d = e.kind === 'firmware' ? (e.from ? `firmware ${esc(e.from)} -> ${esc(e.to)}` : `first seen with firmware ${esc(e.to)}`)
            : e.kind === 'boot' ? `restart: ${esc(e.reason)}`
            : `${esc(e.kind.replace('ota_', ''))} ${esc(e.version || '')} ${e.by ? 'by ' + esc(e.by) : ''}`;
    h += `<div class="ev">${localTime(e.ts, off)}: ${d}</div>`;
  }
  return h;
}

async function fwRefresh(dev, off) {
  const r = await fetch(`/api/v1/admin/fw/${encodeURIComponent(dev)}`, {cache: 'no-store'});
  if (!r.ok) return;
  const v = await r.json();
  fwState[dev] = v;
  el(`fws-${dev}`).innerHTML = fwStatusHtml(v, off);
  el(`fwsum-${dev}`).textContent = `Firmware update: ${dev} (running ${v.running || 'unknown'}${v.state === 'waiting' ? ', update waiting' : ''})`;
  const sel = el(`fwfile-${dev}`);
  if (!sel.dataset.done) {
    sel.innerHTML = v.files.length ? v.files.map(f => `<option value="${esc(f.file)}">${esc(f.file)} (${Math.round(f.size / 1024)} kB)</option>`).join('')
                                   : '<option value="">none yet</option>';
    sel.dataset.done = 1;
  }
}

async function fwGithub(devs) {
  let rel = [], err = '';
  try {
    const r = await fetch('/api/v1/admin/github/releases', {cache: 'no-store'});
    const j = await r.json();
    if (r.ok) rel = j.releases; else err = j.error;
  } catch (e) { err = 'server not reachable'; }
  for (const dev of devs) {
    const sel = el(`fwgh-${dev}`), env = fwState[dev]?.env || 'usb';
    if (err || !rel.length) { sel.innerHTML = `<option value="">${esc(err || 'no release with a logger-*.bin file')}</option>`; continue; }
    let opts = '', picked = false;
    for (const x of rel) for (const a of x.assets) {
      const aEnv = (a.name.match(/^logger-([a-z0-9]+)-\d/) || [, 'usb'])[1];
      const pick = !picked && aEnv === env;
      picked = picked || pick;
      opts += `<option value="${a.id}"${pick ? ' selected' : ''}>${esc(x.tag)}: ${esc(a.name)}${x.prerelease ? ' (pre-release)' : ''}</option>`;
    }
    sel.innerHTML = opts;
  }
}

async function fwAction(dev, kind, off) {
  const msg = el(`fwmsg-${dev}`), force = el(`fwforce-${dev}`).checked;
  let label, call;
  if (kind === 'cancel') {
    if (!confirm(`Withdraw the firmware offered to ${dev}?`)) return;
    call = () => fwPost(`/api/v1/admin/fw/${dev}/cancel`, '{}', true);
  } else {
    if (kind === 'github') {
      const id = el(`fwgh-${dev}`).value;
      if (!id) return;
      label = el(`fwgh-${dev}`).selectedOptions[0].textContent;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/github`, JSON.stringify({asset_id: +id, force}), true);
    } else if (kind === 'upload') {
      const f = el(`fwup-${dev}`).files[0];
      if (!f) { msg.innerHTML = '<span class="bad">Choose a .bin file first.</span>'; return; }
      label = f.name;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/upload?force=${force ? 1 : 0}&name=${encodeURIComponent(f.name)}`, f, false);
    } else {
      const file = el(`fwfile-${dev}`).value;
      if (!file) return;
      label = file;
      call = () => fwPost(`/api/v1/admin/fw/${dev}/offer`, JSON.stringify({file, force}), true);
    }
    if (!confirm(`Send ${label} to ${dev}?\n\nThe logger installs it and restarts (about 30 s without readings, nothing is lost: the SD card keeps recording). If the new firmware keeps restarting, it goes back to the current one by itself.`)) return;
  }
  msg.textContent = 'Working...';
  try {
    const r = await call();
    const j = await r.json();
    msg.innerHTML = r.ok ? `<span class="ok">${kind === 'cancel' ? (j.cancelled ? 'Offer withdrawn.' : 'Nothing was offered to this logger.') : `Firmware ${esc(j.offer.version)} offered to ${esc(dev)}.`}</span>`
                         : `<span class="bad">${esc(j.error || 'HTTP ' + r.status)}</span>`;
    if (r.ok) el(`fwfile-${dev}`).dataset.done = '';
  } catch (e) { msg.innerHTML = '<span class="bad">Server not reachable.</span>'; }
  fwRefresh(dev, off);
}

async function fwInit() {
  let me;
  try { me = await (await fetch('/api/v1/admin/me', {cache: 'no-store'})).json(); } catch (e) { return; }
  if (!me.admin) return;
  const st = await (await fetch('/api/v1/status', {cache: 'no-store'})).json();
  const devs = Object.keys((st.sites || {})[site] || {});
  if (!devs.length) return;
  isAdmin = true;
  sideMenu();
  const off = (await (await fetch(`/api/v1/live/${site}`, {cache: 'no-store'})).json()).profile?.utc_offset_h ?? 8;
  let h = `${frame('Firmware update', 'Send a firmware to one logger: from a GitHub release, a .bin file, or a file already on the server. '
    + 'The logger restarts once; a firmware that keeps restarting goes back to the previous one by itself. See docs/OTA.md.')}`;
  for (const dev of devs) {
    const d = esc(dev);
    h += `<details class="fw"${devs.length === 1 ? ' open' : ''}><summary id="fwsum-${d}">Firmware update: ${d}</summary>
      <div id="fws-${d}">Loading...</div>
      <div class="row"><b>From a GitHub release</b><select id="fwgh-${d}"><option value="">${me.github ? 'loading...' : 'FW_GITHUB_REPO not set on the server'}</option></select>
        <button data-dev="${d}" data-act="github">Send to ${d}</button></div>
      <div class="row"><b>From a file on this computer</b><input type="file" id="fwup-${d}" accept=".bin">
        <button data-dev="${d}" data-act="upload">Upload and send to ${d}</button></div>
      <div class="row"><b>Already on the server</b><select id="fwfile-${d}"></select>
        <button data-dev="${d}" data-act="offer">Send to ${d}</button></div>
      <div class="row"><label><input type="checkbox" id="fwforce-${d}"> force: allow an older version or the other build variant</label>
        <button data-dev="${d}" data-act="cancel">Withdraw the offer</button></div>
      <div class="msg" id="fwmsg-${d}"></div></details>`;
  }
  el('fw').innerHTML = h;
  el('fw').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-act]');
    if (b) fwAction(b.dataset.dev, b.dataset.act, off);
  });
  await Promise.all(devs.map(dev => fwRefresh(dev, off)));
  if (me.github) fwGithub(devs);
  setInterval(() => devs.forEach(dev => fwRefresh(dev, off)), 30000);
}

async function tick() {
  try { await (site ? loadSite() : loadAll()); }
  catch (e) { el('status').innerHTML = '<span class="pill bad"><i></i>Server not reachable</span>'; }
}
if (site) {   // the live call also brings the site profile (names, sensors, contract) the history pages use
  fwReady = fwInit().catch(() => {});
  view = VIEWS.some(v => v.id === location.hash.slice(1)) ? location.hash.slice(1) : 'now';
  sideMenu();
  if (view === 'now') tick(); else tick().finally(() => show(view));
}
else { el('wrap').classList.add('solo'); tick(); }
setInterval(tick, 15000);
setInterval(() => { if (site && view !== 'now' && view !== 'firmware' && !document.hidden) { delete HCACHE[span]; WXC = null; WXL = {}; show(view); } }, 300e3);
</script>
</body>
